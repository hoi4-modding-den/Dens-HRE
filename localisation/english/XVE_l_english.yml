### EVENTS ###
XVE_domestic_events.1.t:0 "Gathering at the Doge’s Palace"
XVE_domestic_events.1.desc:0 "The annual meeting of the governing coalition has convened, uniting the Republicans, Liberal Conservatives, and Corporatists to review the past year and plan for the future. This official gathering is a key event in the Republic’s political calendar, providing an opportunity to align strategies, reaffirm their shared goals, and coordinate new policies. Each faction contributes its vision and expertise, ensuring that Venice moves forward with a clear, united agenda for continued strength and prosperity."
XVE_domestic_events.1.a:0 "To cooperation and prosperity!"
XVE_domestic_events.2.t:0 "Low Governmental Support in the Great Council"
XVE_domestic_events.2.desc:0 "The Maggior Consiglio has begun to withdraw its support from the current government. Growing dissatisfaction among its members is undermining the administration’s ability to govern effectively. If tensions continue to escalate, we could face severe political instability, stronger demands for governmental reform, and the potential collapse of our leadership structure."
XVE_domestic_events.2.a:0 "We must rebuild trust at once."

