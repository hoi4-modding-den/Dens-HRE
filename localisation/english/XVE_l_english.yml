### EVENTS ###
XVE_domestic_events.1.t:0 "Gathering at the Doge’s Palace"
XVE_domestic_events.1.desc:0 "The annual meeting of the governing coalition has convened, uniting the Republicans, Liberal Conservatives, and Corporatists to review the past year and plan for the future. This official gathering is a key event in the Republic’s political calendar, providing an opportunity to align strategies, reaffirm their shared goals, and coordinate new policies. Each faction contributes its vision and expertise, ensuring that Venice moves forward with a clear, united agenda for continued strength and prosperity."
XVE_domestic_events.1.a:0 "To cooperation and prosperity!"
XVE_domestic_events.2.t:0 "Low Governmental Support in the Great Council"
XVE_domestic_events.2.desc:0 "The Maggior Consiglio has begun to withdraw its support from the current government. Growing dissatisfaction among its members is undermining the administration’s ability to govern effectively. If tensions continue to escalate, we could face severe political instability, stronger demands for governmental reform, and the potential collapse of our leadership structure."
XVE_domestic_events.2.a:0 "We must rebuild trust at once"
XVE_domestic_events.4.t:0 "Classify the Istrian Freedom Front"
XVE_domestic_events.4.desc:0 "The Istrian Freedom Front (IFF) has grown increasingly bold, organizing protests and allegedly smuggling arms into the region. Members claim to fight for autonomy and cultural rights, but the Great Council’s conservative bloc calls for swift action. Declaring the IFF a terrorist organization would grant us sweeping authority to crush dissent, but it risks alienating the local population and could spark further unrest. The question now stands: do we silence them with force, or tolerate their presence for the sake of stability?"
XVE_domestic_events.4.a:0 "Declare the IFF a terrorist organization"
XVE_domestic_events.4.b:0 "We should not increase tensions"
XVE_domestic_events.5.t:0 "Istrian Participation in Regional Affairs"
XVE_domestic_events.5.desc:0 "The Istrian peninsula has long been a region of vibrant culture and trade, yet its governance has often been a matter of delicate balance. Recent petitions from Istrian civic leaders, merchants, and prominent families have called for a more direct role in shaping local policy. After careful deliberation, the Maggior Consiglio has approved the establishment of a Joint Istrian-Venetian Council, a body designed to manage regional affairs and foster cooperation between Venice and Istria.\nThis council will oversee matters such as infrastructure, trade, and development, with Venetian and Istrian representatives working side by side. Supporters see this as a pragmatic step toward ensuring stability and prosperity across the Adriatic, while some members of the Maggior Consiglio caution that too much regional influence could challenge Venice’s central authority. For now, the creation of this council marks a new chapter in Venetian-Istrian relations, one built on dialogue, compromise, and shared ambitions for the future under the management of Giuseppe Volpi."
XVE_domestic_events.5.a:0 "Establish a limited advisory council"
XVE_domestic_events.5.b:0 "Push it one step further, grant the Council broader local powers"
XVE_domestic_events.6.t:0 "IFF Terrorism on the Rise"
XVE_domestic_events.6.desc:0 "The recently imposed travel restrictions between Istria and Venice have done little to quell the growing unrest. While government officials tout the checkpoints as a necessary safeguard against smuggling and insurgency, they have become symbols of oppression for the local population. Long lines, invasive inspections, and arbitrary denials of passage have stirred resentment and fueled anti-Venetian sentiment.\nReports indicate that the Istrian Freedom Front (IFF) has taken advantage of these measures, turning frustration into recruitment drives. Their operatives are smuggling propaganda, weapons, and supplies across the Adriatic despite the increased security. Tensions between soldiers and civilians are escalating, with small skirmishes already reported near key crossings. The people of Istria, once quietly enduring Venetian rule, are beginning to see the IFF as their only voice for freedom."
XVE_domestic_events.6.a:0 "We must press harder, for security and order!"
XVE_domestic_events.7.t:0 "Istrian Politicans Walk"
XVE_domestic_events.7.desc:0 "The imposition of strict travel checkpoints between Istria and Venice has caused an uproar in the Maggior Consiglio. In open protest, the Istrian Partisan delegates have walked out, declaring they will not return or support any proposals until the restrictions are lifted. Their departure leaves the council visibly fractured, fueling fears that continued heavy-handed policies may push Istrian sentiment toward more radical factions."
XVE_domestic_events.7.a:0 "They weren't needed anyways..."
XVE_domestic_events.8.t:0 "Nationalist Enter a State of Confidence and Supply"
XVE_domestic_events.8.desc:0 "With the Istrian Partisans having stormed out of the Maggior Consiglio, the chamber has been thrown into turmoil. Yet this absence has created a new political reality. The Nationalist benches, long critical of our government, have now declared their confidence and supply, citing our recent conservative policies as proof of a shared vision. Their support secures a stronger majority and greater stability for the coming months, but it also signals a clear shift toward traditionalist and hardline values, further alienating the Istrian opposition."
XVE_domestic_events.8.a:0 "Perhaps it is time to look to more conservative values"
XVE_domestic_events.9.t:0 "Examine the People's Constitutional Petition"
XVE_domestic_events.9.desc:0 "The streets of Venice and the surrounding mainland have been stirred by the recent submission of a petition signed by 1.78 million citizens calling for sweeping constitutional reforms. The petition demands a significant shift away from the entrenched corporatist system toward a more democratic and representative form of government. While Giuseppe Volpi and his administration have not yet committed to any concrete steps, they have begun a careful review of the document and its implications.\nWithin the chambers of the Maggior Consiglio, opinions remain divided. Some warn that conceding to these popular demands could erode the foundations of traditional authority that have long maintained Venice’s stability and power. Others caution that dismissing such a widespread public outcry risks provoking unrest and severely undermining the government’s legitimacy."
XVE_domestic_events.9.a:0 "We'd need a tremendous amount of support to pass a reform of this scale"
XVE_domestic_events.10.t:0 "Anti-Corruption Measures Bears Fruit"
XVE_domestic_events.10.desc:0 "Giuseppe Volpi and his government have successfully uncovered and dismantled a major corruption scandal involving influential members of the elite. The investigation exposed widespread abuses of power and financial misconduct, shaking the foundations of the established order. This decisive action has strengthened public trust and earned increased support from the Maggior Consiglio, demonstrating that the government’s Anti-Corruption Measures are beginning to take effect and restore integrity within the Republic."
XVE_domestic_events.10.a:0 "We must keep rooting out corruption in the Republic"
XVE_domestic_events.11.t:0 "Reds and Greens"
XVE_domestic_events.11.desc:0 "Following our recent progressive initiatives, a number of socialist members within the Maggior Consiglio have pledged their support for the government. This new backing complements our coalition with the Agrarians and broadens our political base. Their support signals a growing confidence in our administration’s direction and strengthens our position in the council."
XVE_domestic_events.11.a:0 "The more the merrier!"
XVE_domestic_events.12.t:0 "The Republican Youth Union"
XVE_domestic_events.12.desc:0 "The Republican Youth Union has seen a significant boost in donations and recruitment efforts due to our recent progressive reforms. This surge reflects growing support among the younger generation for republican ideals and a more active political engagement within the Republic of Venice. The government’s increased backing aims to cultivate future leaders aligned with its vision, strengthening the party’s influence across the political landscape and promoting a more peaceful climate in these tense times."
XVE_domestic_events.12.a:0 "Investing in the future generations is our priority"
XVE_domestic_events.13.t:0 "Preparations for the Ceremony of San Marco"
XVE_domestic_events.13.desc:0 "The Republic is gearing up for the San Marco Ceremony, a grand festivity held once every half decade to celebrate our rich traditions and cultural heritage. This event holds great significance for the people and symbolizes unity and pride in our history. However, rising internal tensions and the resurgence of the Istrian Freedom Front have cast a shadow of doubt over the upcoming celebrations. Concerns about potential unrest and security threats are growing, prompting discussions on whether to allocate additional funds to bolster security measures and ensure the ceremony proceeds without incident."
XVE_domestic_events.13.a:0 "Ramp up security preparations"
XVE_domestic_events.13.b:0 "Nothing ever happens, maintain current security levels"
XVE_domestic_events.14.t:0 "The Nationalist Speaks"
XVE_domestic_events.14.desc:0 "In a highly publicized address lasting over an hour, Vittorio Cini, leader of the nationalist political group, delivered a passionate speech praising the heritage, traditions, and cultural achievements of the Republic of Venice. His words struck a chord with many Venetians who value the preservation of national identity. However, his complete omission of the Istrian minority has not gone unnoticed, fueling criticism from opposition groups who accuse him of ignoring a significant part of the Republic’s population."
XVE_domestic_events.14.a:0 "Bit Venetian-centered, eh"
XVE_domestic_events.15.t:0 "The Great Council Urges to Begin Preparations"
XVE_domestic_events.15.desc:0 "With the San Marco Ceremony approaching, it is crucial to begin thorough preparations immediately. This grand event, vital to our cultural heritage, requires careful planning and coordination to ensure everything runs smoothly. Failure to act now risks disorganization and potential disorder in the streets, threatening the dignity and safety of the festivities."
XVE_domestic_events.15.a:0 "We must begin at once!"

XVE_domestic_events.16.t:0 "Branching Outwards"
XVE_domestic_events.16.desc:0 "The political landscape of the Republic of Venice is becoming increasingly unstable. Our coalition, once regarded as a solid foundation of governance, has grown fragmented and unreliable. With tensions rising across the Republic, driven by social unrest, the resurgence of the Istrian Freedom Front, and mounting dissatisfaction within the Maggior Consiglio, it is clear that depending solely on the traditional political forces may no longer be enough to guarantee stability or control.\nMany within the government now argue that we must begin reaching out to alternative political forces, parties once considered too radical or out of step with mainstream Venetian politics. Among these potential allies are the Nationalists, led by the charismatic and staunchly traditionalist Vittorio Cini, whose unwavering commitment to Venetian heritage and order has resonated with segments of the population frustrated by the current crisis. Another potential partner is the Royalist movement, which, after decades of marginal influence, is once again gaining traction. Their message of unity under a restored monarchy is finding a sympathetic audience among those who view the current republican system as too weak to meet the challenges we face.\nThe decision to court such groups is not without risk. Aligning with Cini’s Nationalists or the Royalists could shift the Republic’s political direction in ways that alienate existing allies or provoke backlash from progressive and moderate forces. Yet, in this moment of crisis, some argue that bold steps and unconventional alliances are necessary if we are to weather the storms ahead and secure a stable future for Venice."
XVE_domestic_events.16.a:0 "Align with the £GFX_royalist_texticon  §LRoyalists§!, we could use their aid."
XVE_domestic_events.16.b:0 "Contact Mr. Cini and the £GFX_SOV_propaganda_text_icon  §ONationalists§!"

XVE_domestic_events.17.t:0 "Royalist Movements Surge in Record Numbers"
XVE_domestic_events.17.desc:0 "The Republic finds itself at the center of a growing political storm. In the wake of rumors that the Law on Public Display of Royalist Symbols will soon pass, royalist movements have surged in record numbers. Across Venice and the surrounding territories, royalist flags and insignias, once hidden in private homes, are now being proudly displayed in streets, squares, and marketplaces. For many citizens, these symbols are not just relics of the past but statements of hope for a return to a more unified and powerful state under monarchical traditions. The enthusiasm has been palpable, with public rallies and gatherings swelling in size, giving the impression of a royalist resurgence unlike anything seen in the last fifty years.\nYet this wave of royalist expression has not gone unchallenged. Democratic factions within the Maggior Consiglio, particularly the Republicans, Liberal Democrats, Agrarians, and Socialists, have strongly condemned the growing movement. They argue that allowing such displays undermines the very principles upon which the Republic of Venice was built. To them, this sudden rise in royalist activity represents not just nostalgia but a direct threat to republican values and institutions. Some have gone so far as to call the situation an outrage, warning that the government is dangerously close to eroding the foundation of democracy by pandering to reactionary forces.\nAs tension rises, the government is caught between two powerful currents. On one hand, ignoring the royalist groundswell could risk alienating a large and increasingly vocal segment of the population. On the other, embracing it might fracture the existing coalition and embolden factions that seek to fundamentally change the political order. With the law not yet officially passed, the atmosphere grows thick with uncertainty, and the decisions made in the coming days will shape the Republic’s political future for years to come."
XVE_domestic_events.17.a:0 "The people will surely demand a referundum if this continues!"

