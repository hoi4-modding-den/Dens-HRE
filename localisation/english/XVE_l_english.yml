XVE_prolong_law_on_personal_freedoms:0 "Prolong the Law on Personal Liberties"
XVE_prolong_law_on_personal_freedoms_desc:0 "The Law on Personal Liberties, introduced by Doge Volpi, was instrumental in easing tensions in Istria by granting limited freedoms and legal safeguards. With unrest threatening to resurface, extending this law by another ten years would reaffirm our commitment to stability and maintain the delicate balance between authority and local rights."
XVE_expand_the_worker_aid_program:0 "Expand the Workers' Aid Program"
XVE_expand_the_worker_aid_program_desc:0 "We must increase the current and well-working Workers' Aid Program in order to not only guarantee the safety and security of our workers, but aim for long-term performance gain, instead of straining the Venetian people."
XVE_facilitate_technocratic_policymaking:0 "Facilitate Technocratic Policymaking"
XVE_facilitate_technocratic_policymaking_desc:0 "We should streamline policymaking by empowering technocrats within the government. By relying on experts and specialized knowledge, the administration seeks to increase efficiency and implement evidence-based solutions. Technocratic groups view this move favorably, potentially strengthening their influence and support for the government."
XVE_ceremony_reminder:0 "Begin Preparation for the Ceremony of San Marco"
XVE_ceremony_reminder_desc:0 "It is imperative that we begin preparing to host the Ceremony of San Marco, held twice every decade, to potentially avoid any troubles."
XVE_the_magnate_speech_decision:0 "The Magnate Speech"
XVE_the_magnate_speech_decision_desc:0 "Vittorio Cini and his Nationalist faction are preparing to deliver a major speech in the Maggior Consiglio. The event is expected to center on Venetian pride, cultural preservation, and the call for a return to traditional values. Many see this as a pivotal moment for the Nationalists to rally support, with the potential to sway undecided council members and push the political debate in a more conservative direction."
XVE_monarchist_publications_decision:0 "Permit Monarchist Newspapers"
XVE_monarchist_publications_decision_desc:0 "After years of strict control, the government is considering allowing monarchist newspapers to operate once again within the Republic. This move would be framed as a fulfillment of the "Law on Personal Liberties," reaffirming the administration’s commitment to free expression. At the same time, it could serve as a calculated gesture to gain favor with the Royalist movement, bringing them closer to supporting the government’s initiatives."
XVE_legalize_royalist_symbols_decision:0 "Law on the Public Display of Royalist Symbols"
XVE_legalize_royalist_symbols_decision_desc:0 "The Maggior Consiglio is preparing to debate a controversial proposal to legalize the public display of royalist flags, emblems, and symbols. Advocates claim that such a law would help reconcile the Royalists with the Republic, building a broader coalition of support. However, critics warn that going too far could trigger the largest surge of monarchist enthusiasm seen in fifty years, potentially destabilizing the balance of power in Venetian politics."

