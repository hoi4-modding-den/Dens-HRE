l_english:
  #Event
  ZGR_Political_Camp_Choice.1.t:0 "Who will you fight for?"
  ZGR_Political_Camp_Choice.1.desc:0 "Its election season..."
  ZGR_Political_Camp_Choice.1.a:0 "The Communist"
  ZGR_Political_Camp_Choice.1.b:0 "The Status Qou"
  ZGR_Political_Camp_Choice.1.c:0 "The King"
  ZGR_Political_Camp_Choice.1.d:0 "The Byzantine Ideals"

  ZGR_Flavor.1.t:0 "The costal nights"
  ZGR_Flavor.1.d:0 "It started quietly. A few workers would go on a small strike. A young officer would share his ideas at a cafe. A student would write Glory to the King, Glory to Greece on the campus wall at night. No-one in the government understood what this meant, until it was too late…"
  ZGR_Flavor.1.a:0 "Change is on the Horizon"

  ZGR_Flavor.2.t:0 "The New University"
  ZGR_Flavor.2.d:0 "We have built a new costal Univerity. We will put a large focus on Physics and Mechanical engineering, thus raising a patriotic generation who can build the weapons of the future."
  ZGR_Flavor.2.a:0 "Yay!"

  ZGR_Political_Result.1.t:0 "Minor Communist Victory"
  ZGR_Political_Result.1.d:0 "Altough considered bearly a party worth mentioning, the communists and other aligned parties have gained an unexpected result."
  ZGR_Political_Result.1.a:0 "Form a socialist Parliament"

  ZGR_Commie_st_Election.1.t:0 "Visit from Greece"
  ZGR_Commie_st_Election.1.desc:0 "The small airport was overtaken by dust. There was dust in the air, on the ground, and even on the plane. A man in a black suit stepped out of it. He walked the narrow bustling street to a small, coastal cafe. There he met you, and gave you what you asked for - §GFunds§! for the party..."
  ZGR_Commie_st_Election.1.a:0 "Yay!"

  ZGR_Commie_st_Election.2.t:0 "The Plan"
  ZGR_Commie_st_Election.2.d:0 "You, and 3 other anarchist friends decide to rob a bank to get funds for your cause. You walk into the dark, small room, curitans closed. Around the round table, are 3 large seats. Two of them already taken. You slam down the building plans on the table. This is how we are entering the bank!"

  ZGR_Commie_st_Election.2.a:0 "The Main Entrance!"
  ZGR_Commie_st_Election.2.b:0 "We grapple down the roof!"
  ZGR_Commie_st_Election.2.c:0 "We Use the Back Door!"

  ZGR_Commie_st_Election.5.t:0 "Guns Blazin!"
  ZGR_Commie_st_Election.5.d:0 "The calm street overlooked the whole town. It was filled with cafes, rich apartments and gave off the charm of a well fed Bourgeoisie. The bank slashed trough the street, its imposing marble pillars paving the way of two large engraved doors. The calm facade was over when three masked gunmen walked out an alley, and headed straight for the main entrace. As you opened the large doors, a lone shot rang out, striking your friend.\n You ran."  
  ZGR_Commie_st_Election.5.a:0 "Oops!"

  ZGR_Commie_st_Election.3.t:0 "Dive down"
  ZGR_Commie_st_Election.3.d:0 "The bank roof was high up. The cool morning air flew over the coast and right in your face. You where here with two others, all wearing masks, guns holstered. You kicked in the sunroof, and jumped down. A shot rang out, shooting the guard who stood at the entrance. You had landed in the main lobby, in all its marble glory. There stood a glass window, and behind it, a schocked bank teller. Her face cleared, as she pressed the emergency button, but your friend managed to get a bag of money out of her. As you ran out the main entrance, two policemen opened fire. \nYou managed to escape."  
  ZGR_Commie_st_Election.3.a:0 "Good Enough..."

  ZGR_Commie_st_Election.4.t:0 "The Small Entrance"
  ZGR_Commie_st_Election.4.d:0 "You turned from the street to a dark alley. It was a real contrast to the clean and classy steet. The warm air made the intense smell and garbage intolerable. A lone rat ran across the alley, as you joined your two friends at the back entrance. You quitely opened the door, stepping in. The clean room felt empty, but the ilumination from the flashlight showed something else. Built into the walls were Rows upon rows of small metal boxes..."  
  ZGR_Commie_st_Election.4.a:0 "Bingo."

  ZGR_Commie_st_Election.6.t:0 "The Infiltration"
  ZGR_Commie_st_Election.6.d:0 "The glowing windows of the bar were in a dark corner of the small street. As you entered the bar, the walls closed in, made of people, chairs and tables. At the far end, stood as small stage with a Byzantine flag. A well dressed young man stepped on it. He talked, and talked, about glory, about the Greek spirit. But you talked too, with the various people there. Turns out, some of them liked what you were saying..."  
  ZGR_Commie_st_Election.6.a:0 "We will be good friends!"

  ZGR_Commie_st_Election.7.t:0 "The Turkish Workers"
  ZGR_Commie_st_Election.7.d:0 "Turkish workers are often underpaid. As you sneaked into the factory, the whirring of machines, the hot air, smelling of sweat and oil hit you. You looked upon the workers, working the machines. You walk up, and start a conversation..."  
  ZGR_Commie_st_Election.7.a:0 "We will be good friends!"

  ZGR_Commie_st_Election.8.t:0 "The Turkish and Greek Workers"
  ZGR_Commie_st_Election.8.d:0 "In the middle of one day, You, and a few Turkish workers sneak into a Factory. It is similar to the Turkish one, but slighty cleaner. As you stand on a wooden box, the workers listen..."  
  ZGR_Commie_st_Election.8.a:0 "Workers of New Greece, Unite!"

  ZGR_Commie_st_Election.9.t:0 "The Massive Rally"
  ZGR_Commie_st_Election.9.d:0 "The Rally was massive. The burning sun, the threath of police, couldn't stop the hordes of workers from marching the short and narrow streets, all the way to the main square. Apart from a fre minor incidents, it went well."  
  ZGR_Commie_st_Election.9.a:0 "Wow!"

  ZGR_Commie_st_Election.10.t:0 "The Founding Of the Congress."
  ZGR_Commie_st_Election.10.d:0 "The room was stuffed full of people. When you entered, you could bearly squeeze your way trough, but as you made your way to the podium cheers erupted. You, and many other free thinkers declared the New Greek Communist Congress Open."  
  ZGR_Commie_st_Election.10.a:0 "Cool!"