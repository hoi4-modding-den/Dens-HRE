 XWB_burgundy_remnant_desc:0 "This state was once a constituent part of the Kingdom of Burgundy within the Holy Roman Empire. The collapse of Burgundy following the War of the River Rhine has left the government of this state disoriented and unrecognized. This may be resolved if a clear successor to Burgundy is ever determined."
 
