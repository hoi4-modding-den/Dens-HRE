 #Events#
 #News Events#
 XWB_NE.1.t:0 "The Reformation of Burgundy"
 XWB_NE.1.d:0 "Having retaken all former territories of the previous Kingdom of Burgundy, the [FROM.GetOldNameDef] has declared a new Burgundian successor state. The Kingdom of Burgundy had collapsed into civil war following the stalemate in the War of the River Rhine, and had remained in pieces for decades, until now.\n[FROM.GetLeader] has held a celebratory ceremony in honor of the new unified state, and has proclaimed that ''The hardships of our past have finally `been put to rest. Let us claim our rightful place in the Empire.'' Time will tell if this new Burgundy will avoid the pitfalls of the previous Burgundian government."
 XWB_NE.1.a:0 "Finally, some order in the state of Burgundy."
 XWB_NE.2.t:0 "Formation of the Ständesfront"
 XWB_NE.2.d:0 "The [XWB.GetName] has announced the formation of a formal military alliance within the Empire. The Ständesfront, or ''Corporate Front'', seeks to unite the military forces of the far-right across the Empire, and to ensure the triumph of corporate statism and fascism over communism and democracy in the empire.\n\nThe formation of the alliance has lead to many of the neighboring states concerned for their independence, with some stating that this alliance is mearly a ploy to fuel Wurttembergian expansionism."
 XWB_NE.2.a:0 "Concerning!"
 XWB_NE.2.b:0 "The entire Empire shall kneel before us!"
 #Diplomacy Events#
 XWB.DE_1.t:0 "[XWB.GetName] demands Voralberg"
 XWB.DE_1.d:0 "Having set their sights on agressive expansionism, the [XWB.GetName] has send an official demand to our government, requesting that we transfer ownership of the territory of Voralberg over to them. If they refuse to take no for an answer, this could mean war. However, with Wurttemberg's current expansionist ethos, there's no telling if this will be the end of their threats against us."
 XWB.DE_1.a:0 "Appeasement always works, right?"
 XWB.DE_1.b:0 "Who does [XWB.GetLeader] think they are?"
 XWB.DE_2.t:0 "[FROM.GetName] gives us Voralberg"
 XWB.DE_2.d:0 ""
 XWB.DE_2.a:0 "Everythings coming up Wurttemberg"
 XWB.DE_3.t:0 "[FROM.GetName] refuses demands"
 XWB.DE_3.d:0 ""
 XWB.DE_3.a:0 "They do know we weren't asking, right?"
 XWB.DE_3.b:0 "Was worth a shot"
 XWB.DE_4.t:0 "[XWB_demand_bavarian_swabia_event_name]"
 XWB_demand_bavarian_swabia_event_name_annexation:0 "The [XWB.GetName] Demands Our Annexation"
 XWB_demand_bavarian_swabia_event_name_normal:0 "The [XWB.GetName] Demands Ostschwaben"
 XWB.DE_4.d:0 "[XWB_demand_bavarian_swabia_event_description]"
 XWB_demand_bavarian_swabia_event_description_annexation:0 "Having set their sights on agressive expansionism, the [XWB.GetName] has send an official demand to our government, demanding the annexation of our nation into their territory. Considering the small size of our nation, they will almost certainly refuse to take no for an answer. It might be best if we ask for autonomy within Wurttemberg, to maintain our political power..."
 XWB_demand_bavarian_swabia_event_description_normal:0 "Having set their sights on agressive expansionism, the [XWB.GetName] has send an official demand to our government, requesting that we transfer ownership of the territory of Ostschwaben over to them. If they refuse to take no for an answer, this could mean war. However, with Wurttemberg's current expansionist ethos, there's no telling if this will be the end of their threats against us."
 XWB.DE_4.a:0 "Appeasement always works, right?"
 XWB.DE_4.b:0 "Who does [XWB.GetLeader] think they are?"
 XWB.DE_4.c:0 "Allow our annexation, as long as our nobility can maintain our authority."
 XWB.DE_5.t:0 "[FROM.GetName] gives us Ostschwaben"
 XWB.DE_5.d:0 "The government of the [FROM.GetName] has granted us Ostschwaben. Who would have thought that we would get away with it this easily. It's almost like, uh, taking candy from a baby, I guess. Are you even reading these?"
 XWB.DE_5.a:0 "Well that was easy."
 XWB.DE_6.t:0 "[FROM.GetName] refuses demands"
 XWB.DE_6.d:0 "The [FROM.GetName] government has rejected our very well thought out and not hastily written demands. How they could ever expect to overcome our military might is beyond us, but nonetheless, we ought to make good on our demands, and grind them into dirt... assuming we're actually ready for war, that is."
 XWB.DE_6.a:0 "If they want war, than they got it!"
 XWB.DE_6.b:0 "Uhhh... I was bluffing, can we do this later?"
 XWB.DE_7.t:0 "Gathering Allies"
 XWB.DE_7.d:0 "While some in our government have questioned the feasability of a ''corporatist alliance'', especially with the competing interests of various nationalisms, but the fact is that we're simply not powerful enough to stand up to the entire Empire by ourselves. An alliance will ensure that we have the means to stand against even the Emperor themselves.\n\nBrandenburg is the most obvious choice of an ally, with a firmly anti-monarchist and corporatist government. While allying with them would mean abandoning any claims to their territory, they would be able to handle any threats to the north that we may not be able to handle alone.\n\nWhile Padania is not explicitly corporatist, corporatist are involved in their government. The large Italian kingdom would be a powerful ally to help take down other threats in southern Germany, though their questionable loyalty to the corporate cause has many questioning if they will be a reliable ally."
 XWB.DE_7.a:0 "Brandenburg is likeminded, they will be more than willing to cooperate."
 XWB.DE_7.b:0 "An alliance with Padania is a must."
 XWB.DE_7.c:0 "All like-minded corporatists should be invited to our alliance."
 XWB.DE_7.e:0 "Why bother with all this when the Padania League is right there."
 XWB.DE_8.t:0 "[XWB.GetName] wants us to join the Ständesfront"
 XWB.DE_8.d:0 "The [XWB.GetName] has sought to create a military alliance of corporatist states within the Holy Roman Empire. They have reached out to our government to see if we are willing to join them in this ''Stände''  Front, and are awaiting our response."
 XWB.DE_8.a:0 "An alliance would benefit us both."
 XWB.DE_8.b:0 "An alliance would debase ourselves."
 XWB.DE_9.t:0 "[FROM.GetName] declines to join our alliance"
 XWB.DE_9.d:0 "Despite our best efforts to convince the government of the [FROM.GetName] of our military superiority, they have decided to decline our offer to form an alliance together. We will have to deal with them at a later date..."
 XWB.DE_9.a:0 "Typical."
 XWB.DE_10.t:0 "[FROM.GetName] agrees to join our alliance"
 XWB.DE_10.d:0 "The government of [FROM.GetName], having been convinced of the merits of military security and ideological cooperation, has formally agreed to join our military alliance. We are now equals in the fight for the soul of Germania."
 XWB.DE_10.a:0 "Like a fasces, we're stronger together."
 XWB.DE_11.t:0 "[FROM.GetName] asks for autonomy"
 XWB.DE_11.d:0 "The [FROM.GetName], having correctly recognized the strength of our nation, has offered to surrender themselves to us. However, they have requested that, as part of this agreement, that their nobility will retain their land and titles as part of our nation. While this would allow us to simply integrate the territory into our administration, concerns have been raised over the economic control the former leaders of [FROM.GetName] would retain over the region, and their potential influence over our government."
 XWB.DE_11.a:0 "Welcome to Wurttemberg!"
 XWB.DE_11.b:0 "Frankly, I'd rather not deal with all that paperwork."
 XWB.DE_12.t:0 "[FROM.GetName] requests to join the [XEX.GetFactionName]"
 XWB.DE_12.d:0 "The [FROM.GetName], having recognized the military prowess of our nation, has requested to join the [XEX.GetFactionName], citing the cooperation of corporatists within our government as a sign that we can be trusted. While Württemberg is a fairly strong nation for southern Germany, if we accept it is very likly that they will drag us into a war in the near future. We should be cautious when making our decision."
 XWB.DE_12.a:0 "Welcome to the League"
 XWB.DE_12.b:0 "We don't take open fascists."
 XWB.DE_13.t:0 "[FROM.GetName] allows us in the [XEX.GetFactionName]"
 XWB.DE_13.d:0 "The [FROM.GetName] has agreed to let us in their faction. We are now partners with the Padanians."
 XWB.DE_13.a:0 "We're stronger together."
 XWB.DE_14.t:0 "[FROM.GetName] rejects us from the [XEX.GetFactionName]"
 XWB.DE_14.d:0 "The [FROM.GetName] has refused to let us in their faction, citing our expansionist attitude and corporatist governance as liabilities to their national security."
 XWB.DE_14.a:0 "We'll deal with them later."
 XWB.DE_15.t:0 "[FROM.GetName] demands the Sudetenland"
 XWB.DE_15.d:0 "The [FROM.GetName] has sent an official demand to our government, ''requesting'' the German-speaking territories of the Sudetenland to be transferred to their control. They claim that the German-speaking population is being oppressed by our government, and that this will mean war if we do not surrender the territory over to them."
 XWB.DE_15.a:0 "We choose dishonor."
 XWB.DE_15.b:0 "We choose death."
 XWB.DE_16.t:0 "[FROM.GetName] ceeds the Sudetenland to us."
 XWB.DE_16.d:0 "The [FROM.GetName] government, despite all expectations to the contrary, has apparently thought over our well-written ultimatium thoroughly and logically, and has decided to acquiesce to our demands. We are now the owners of the Sudetenland."
 XWB.DE_16.a:0 "Wait, Really?"
 XWB.DE_17.t:0 "[FROM.GetName] refuses our demands."
 XWB.DE_17.d:0 "The [FROM.GetName] government, despite knowing full well what the consequences of their actions would be, has refused to hand over the territory of the Sudetenland to us. We cannot allow the Czechs to continue to oppress our fellow Germans, we must destroy [FROM.GetName]."
 XWB.DE_17.a:0 "Shame."
 XWB.DE_18.t:0 "[FROM.GetName] Pressures our government for annexation"
 XWB.DE_18.d:0 "[FROM.GetName] agitators have advanced into our country, and have orchestrated a series of nationalistic protests in our capital, demanding that we merge into the pro-unification government of Württemberg. While this is clearly a ploy by Württemberg to undermine our (admittedly weak) sovereignty, it seems to be working, as greater numbers of citizens have begun to join the protests. If we cannot afford to fight a war with both Württemberg and ourselves, it might be best to just surrender complete."
 XWB.DE_18.a:0 "We have no other choice."
 XWB.DE_18.b:0 "...Except this choice of course."
 XWB.DE_19.t:0 "[FROM.GetName] is annexed."
 XWB.DE_19.d:0 "Having faced several protests backed by us, the government of [FROM.GetName] has recognized the severity of the situation, and has agreed to annex themselves into our territory. This is a great day for the [XWB.GetName]."
 XWB.DE_19.a:0 "How can anyone say that the [FROM.GetName] is not German?!"
 XWB.DE_20.t:0 "[FROM.GetName] refuses annexation."
 XWB.DE_20.d:0 "The dishonorable government of the [FROM.GetName] has rejected the protests of their people, and us, and has explictly stated that they will not surrender themselves to ''the cruel joke of corporatist chicanery on a national scale''. We cannot allow them to make an international scene out this situation, the [FROM.GetName] must be dealt with."
 XWB.DE_20.a:0 "Laughable, lets see how well their jokes stand up to machine gun fire."
 XWB.DE_21.t:0 "The [FROM.GetName] Demands our Subjugation*"
 XWB.DE_21.d:0 "An official from the [FROM.GetName] has reached the office of [XEX.GetLeader] with a simple, yet insane demand: Become our subject, or be destroyed. After verifying that the official sent to us is not just a homeless man that just so happens to have a strong South German accent, and after he made it very clear that he himself was not threatening to destroy us, we now find outselves with an interesting decision. While fighting Württemberg through the Alps is expected to be bloody, one could hardly expect them to actually be serious about this. In fact, they're probably joking. And if they're not joking, we could buy some time to deal with them by messing with them..."
 XWB.DE_21.a:0 "Sure, why not."
 XWB.DE_21.b:0 "What the fuck? No, Why would we do that?" #https://www.youtube.com/watch?v=J0RySfG_8OA
 XWB.DE_21.c:0 "Sure, let's become their ''tribute''. What do Germans like, pretzels?"
 XWB.DE_22.t:0 "The [FROM.GetName] sends us ''Tribute''"
 XWB.DE_22.d:0 "While some in our government had concerns that the [FROM.GetName] has simply ignored our demands, it appears that they've done something even more annoying. Having apparently not respected us or our messengers, Padania has decided to ''pay tribute'' to us, in the form of several large crates of pre-packaged pretzels, delivered to our offices in Stuttgart via truck. Furious at this insult to our superiority, several in the military have already called for war with Padania."
 XWB.DE_22.a:0 "Lets just, be more firm with our demands this time..."
 XWB.DE_22.b:0 "Pretzels... they're mocking us!"
 XWB.DE_23.t:0 "The [FROM.GetName] REALLY Demands our Subjugation"
 XWB.DE_23.d:0 "Having apparently found very little humor in our joke, the [FROM.GetName] has sent their official delegate back to us, with a gun (to signal that they're serious this time). After assuring us that he *really* does not want to be shot, the official has stated that the [FROM.GetName] will absolutely declare war on us if we do not accept the demands of their government."
 XWB.DE_24.t:0 "[FROM.GetName] declares war on us."
 XWB.DE_24.d:0 "Having apparently been infuriated by our little ''pretzel'' joke, the [FROM.GetName] has declared war on our government. While the official stated reason is a long list of refused ultimatiums, one would expect that the shipment of Pretzels would be on such a list if it were acceptable. Perhaps in the future, historians will refer to this conflict as the ''Pretzel War'', but for now, we must endure."
 XWB.DE_24.a:0 "And not even a thank you for the pretzels, how ungrateful."
 XWB.DE_25.t:0 "[FROM.GetName] agrees to be subjugated"
 XWB.DE_25.d:0 "Despite our concerns that they would not accept our ultimatium, it seems that the [FROM.GetName] have come to their senses, and have agreed to become our subject. Italy is now effectively under our control."
 XWB.DE_25.a:0 "All according to plan."
 XWB.DE_26.t:0 "The [FROM.GetName] Demands our Subjugation"
 XWB.DE_26.d:0 "An official from the [FROM.GetName] has reached the office of [XEX.GetLeader] with a simple, yet insane demand: Become our subject, or be destroyed. Panic has set in the royal court, as fighting Württemberg through the Alps is expected to be expensive and bloody. This may be very bad for us if we are not prepared."
 XWB.DE_26.a:0 "Just pretend their messenger got lost and never reached us."
 XWB.DE_26.b:0 "Perhaps we should consider the whole ''vassalage'' thing..."
 XWB.DE_27.t:0 "[FROM.GetName] refuses our demands to be subjugated"
 XWB.DE_27.d:0 "It seems that, despite our best efforts, the [FROM.GetName] cannot be reasoned with. They have completely refused to become our vassals, and as such, we are left with no choice..."
 XWB.DE_27.d2:0 "It seems that, despite our best efforts, the [FROM.GetName] cannot be reasoned with. They have seemingly refused to acknowledge our demands in any way, as if they never received a demand. This insolence cannot be tolerated."
 XWB.DE_27.a:0 "Prepare for war."
 
 #Misc.#
 XWB_GATHERING_STORM_DESC:0 "Humiliated in the stalemate of the War of the River Rhine, which saw Württemberg devastated for little gain, the far-right Nationalist Front has seen fit to take power (to an extent). Having secured a narrow coalition with the monarchist Fatherland Party in the 1935 elections, the Nationalists seek to turn Württemberg into a beacon of corporatist ideals. Ferdinand Porsche, elected as a compromise candidate, has found himself the disputed Prime Minister of Württemberg, himself eager to turn Württemberg into a shining example of automotive -industrial might. Will the Corporatist-Monarchist alliance hold, or will the Kingdom fall to its democratic traditions?"
