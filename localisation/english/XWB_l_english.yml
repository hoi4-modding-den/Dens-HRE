 #Fascist Tree
 XWB_porsche_regime:0 "The Porsche Regime"
 XWB_porsche_regime_desc:0 "Humiliated in the War of the River Rhine, which saw our nation fail to break the stalemate against the failing state of Burgundy, Wurttemberg has struggled to find a government that can adequately address our failures. The 1935 Elections have almost remedied this, but without a firm majority in parliament, the Nationalist Front can only do so much. There must be a way to break the stalemate..."
 XWB_bribe_military:0 "The Price of Loyalty"
 XWB_bribe_military_desc:0 "The Military is not a neutral organization. While many members are involved in both parties, they are still an independent actor, with interests that may clash with ours. We must make efforts to ensure their loyalty, even if it means a bit of corruption here and there."
 XWB_we_do_a_bit_of_purging:0 "The Demands of the State"
 XWB_we_do_a_bit_of_purging_desc:0 "We cannot afford to waste time here. While we cannot do anything about the higher-ranking generals, we cannot just let the armed forces play in the background while our nation is at risk. We must take steps to remove more ‘‘insubordinate’’ members of the military."
 XWB_false_flag_time:0 "Political Theater"
 XWB_false_flag_time_desc:0 "If we are to truly break the stalemate, we must put on a little show. After all, dictatorship without justification is merely tyranny, and nobody would stand for that. We must let the people know that we are doing this for their own good. Even if it means that some things must be sacrificed. "
 XWB_reichstag_fire:0 "A Convenient Mistake"
 XWB_reichstag_fire_desc:0 "Sometimes, mistakes happen. A misplaced comma, an outdated schedule, an accidental lapse in security. These things happen as a result of factors beyond the control of any one individual. Something like this was bound to happen eventually. It was only a matter of time."
 XWB_albrecht_abdication:0 "Force King Albrecht to Abdicate"
 XWB_albrecht_abdication_desc:0 ""
 XWB_bribe_monarchists:0 "Divide and Conquer"
 XWB_bribe_monarchists_desc:0 "While the WVLP has been something of a nuisance for a coalition partner, they're arguably just as divided as we are. If we can play them against each other, get some allies within the party, than we won't even have to lift a finger."
 XWB_purge_monarchists:0 "The Obvious Solution"
 XWB_purge_monarchists_desc:0 "Why even bother with playing nice. We have the power, we have the guns, we have the armed forces. Just make up an excuse about them having ''committed treason'' and we can just get rid of the monarchist problem entirely. Maybe we could even consider removing the king entirely..."
