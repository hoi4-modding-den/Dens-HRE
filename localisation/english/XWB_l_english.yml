 form_burgundy_category:0 "Restoration of Burgundy"
 form_burgundy_category_desc:0 "The Kingdom of Burgundy had collapsed into civil war following the ceasefire of the War of the River Rhine. The various post-Burgundian states have failed to unify the country in the aftermath, and have since languished under smaller duchies and counties. If we can reconquer all of the former territory of the kingdom, we would be able to claim the legitimacy of the Kingdom for ourselves."
