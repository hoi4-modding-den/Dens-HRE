 XWB_greater_wurttemberg:0 "Declare Greater Wurttemberg"
 XWB_greater_wurttemberg_desc:0 "We have made history, as Württemberg has firmly solidified itself as the hegemon of southern Germany. We don't need to risk our existence for some far-flung lands that we have no hope of controlling. We shall ensure that our kingdom lasts for a thousand years."
