 XWB_destroy_burgundy:0 "Finish What We Started"
 XWB_destroy_burgundy_desc:0 "Our inability to conquer Baden from Burgundy in 1915 was merely a fluke, an error caused not by our faults, but by the limitations of the technology of the time. We cannot let the deaths of our brothers be for naught. We have overcome our limitations, we are prepared and ready for war, and our flag shall be raised above the streets of Strasbourg, like it should have, all those years ago."
