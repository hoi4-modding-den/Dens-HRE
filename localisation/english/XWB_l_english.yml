 #Foreign Policy Tree
 XWB_foreign_policy_focus:0 "Sein Vaterland Muss Größer Sein!"
 XWB_foreign_policy_focus_desc:0 "Is this all that Württemberg really is? Just Stuttgart and its surroundings? How can we call ourselves a kingdom when even some principalities dwarf us. No, no, no, our fatherland must be bigger. The Empire shall know that we are its true leaders, even if it must be through fire and blood."
 XWB_threat_expansionism:0 "Wurttemberg Declares Expansionist Ambitions"
 XWB_form_the_corporatist_front:0 "Form the Ständesfront"
 XWB_form_the_corporatist_front_desc:0 "No man is an island, and no king rules alone. Württemberg may be strong, but we cannot fight the Empire alone. We must create an alliance, a pact of blood and steel, between all the corporatists of the Empire. And together, the Empire shall tremble beneath our might."
 XWB_form_the_corporatist_front_tooltip:0 "§RWe will be locked out of invading Brandenburg or puppeting Padania if we form an alliance with either of them.§W"
 XWB_demand_voralberg:0 "Demand Voralberg"
 XWB_demand_voralberg_desc:0 "While Voralberg is not a province of high economic value, its position within the Alps is valuable for ensuring a highly-defensible frontline for any further incursions into the Alps."
 XWB_destroy_burgundy:0 "Finish What We Started"
 XWB_destroy_burgundy_desc:0 "Our inability to conquer Baden from Burgundy in 1915 was merely a fluke, an error caused not by our faults, but by the limitations of the technology of the time. We cannot let the deaths of our brothers be for naught. We have overcome our limitations, we are prepared and ready for war, and our flag shall be raised above the streets of Strasbourg, like it should have, all those years ago."
 XWB_destroy_burgundy_indev_tooltip:0 "Since §YBurgundy §Wdoes not exist §g(it's hopefully still being made)§W, we will simply §Gannex §Wall §YGerman §Wterritory that would have belonged to §Ythem§W. This §Geffect §Wwill §Gautomatically change §Wif §YBurgundy §Whas been added to the mod.\n\n"
 XWB_demand_bavarian_swabia:0 "Demand Bavarian Swabia"
 XWB_demand_bavarian_swabia_desc:0 "East Swabia has remained in Bavarian hands for centuries, always just out of our grasp. The weakness of its current government may just be the opportunity we need to seize this land for ourselves."
 XWB_demand_bavarian_swabia_indev_tooltip:0 "Since §YBavaria §Wdoes not exist §g(idk why nobody wanted to make Bavaria)§W, we will simply §Gannex §Wthe §Ystate §Wthat would have belonged to §Ythem§W. This §Geffect §Wwill §Gautomatically change §Wif §YBavaria §Whas been added to the mod.\n\n"
 XWB_south_german_focus:0 "South German Ambitions"
 XWB_south_german_focus_desc:0 "Our ambitions lie not with the unruly, protestant rabble of the North, but here, in South Germany, where the Empire has always been governed from."
 XWB_threat_expansionism_south:0 "South German Ambitions"
