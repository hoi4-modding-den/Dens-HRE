# CHARACTERS

 YRR_gonzalo_queipo_de_llano_name: "Gonzalo Queipo de Llano"


# IDEAS

 YRR_army_state: "Uncontrollable Army"
 YRR_army_state_desc: "Our Armed Forces are made up mostly of militia loyal to various radical groups and former members of the Iberian Army. They are current opposing our rule."
 YRR_anarchist_resistance: "Anarchist Resistance"
 YRR_low_legitimacy: "Illigitimate Regime"
 YRR_low_legitimacy_desc: "Our government may declare to rival that in Madrid, but in reality we are barely recognised by any other nation or even our own people."
 YRR_falangist_support: "Falangist Pressure"
 YRR_falangist_support_desc: "The arrival of the prominent Falangist Julio Ruiz de Alda and his followers from the Basque Country where they were exiled from has significantly shifted the balance of power within the coalition."
 YRR_increased_anti_communist_sentiment: "Bastion against the Red Menace"
 YRR_increased_anti_communist_sentiment_desc: "With the Basque Country falling to the Leftist Threat, our people are more worried than ever."
 YRR_spanish_destiny: "Spanish Destiny"
 YRR_spanish_destiny_desc: "It must be our destiny to establish a world-spanning Empire!"


# FLAGS
 
 YRR_power_struggle_over: "the Power Struggle between the §YAnti-Communist Coalition§! and the §YFalangists§! is over"
 

# DECISIONS

 YRR_utilise_the_falangists: "Utilise the Phalanx"
 YRR_reign_in_the_army: "Reign in the Army"
 YRR_power_struggle_mission: "The Power Struggle continues..."
 YRR_attack_YAS: "Secure Asturias"
 YRR_attack_YBS: "Attack [YBS.GetNameDef]"
 YRR_begin_full_offensive: "Begin the Unification Wars"
 YRR_reunify_spain: "End the Iberian Civil War"


# EVENTS
 
 YRR_events.1.t: "End of the Power Struggle"
 YRR_events.1.desc: "The Anti-Communist Coalition has been in a power struggle with the newly strengthened Falangists. Now, their conflict comes to an end with the following outcome:"
 YRR_events.1.a: "The Coalition keeps its power!"
 YRR_events.1.b: "The Falangists seize the state!"
 YRR_events.2.t: "The Basque Country falls to Socialism!"
 YRR_events.2.desc: "News from our neighbour, the Basque Country paint a grim picture. The people there have supposedly elected the Reds into government. Naturally that cannot be true, but the Socialists are in charge anyway, so we must prepare for our mission to come to fruition."
 YRR_events.2.a: "The Reds are at it again!"


# SETTINGS

 custom_diff_strong_yrr: "Strengthen @YRR Castile Anti-Communist Front"
