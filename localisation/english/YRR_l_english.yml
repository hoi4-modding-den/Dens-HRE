l_english:

 YRR_BLITZKRIEG_DESC: "During the Collapse, the areas around Castile and León were secured by the army, only to face massive resistance by the Anarchists and Socialists. Under the lead of General Gonzalo Queipo de Llano, an uneasy coalition of anti-communist elements began ruling the territory, with the army rampantly out of control.\n \n \n§cContent is available via decisions!§!"

 YRR: "Castile and León"
