  ################
  ## EVENTS LOC ##
  ################

  ZAG_event.1.t: "Monarchists Raiding of the City Hall!"
  ZAG_event.1.d: "News are in: recent events led to an increase in monarchist and fascist movements across the country, making some people unsecure about leaving city centres. Government officials said however that these threats were 'nothing more than populists agitators', dismissing any allegations that some military officials would be involved in shady affairs."
  ZAG_event.1.a: "Oh, the humanity!"
  ZAG_event.1.b: "Against tyranny, rising up is the only solution!"

  ZAG_event.2.t: "Coup d'Etat!"
  ZAG_event.2.d: "Worrying news are coming from the National Assembly in Adana: in the night, military leaders and political commissars raided the houses of numerous political leaders, especially communist and democrats, arresting them under the reason of 'conspirating against the State'.\n\nSome leaders already went into exile in the countryside or neighbouring states but a good part of them was detained and shortly executed afterward. The new government officially asked other nations to recognise it as the sole legitimate leader of Cilicia, promising elections within a few months."
  ZAG_event.2.a: "Onwards!"
  ZAG_event.2.b: "Crush the democrats!"

  ZAG_event.3.t: "On the Matter of State Religion"
  ZAG_event.3.d: "Idk man"
  ZAG_event.3.a: "Yes! We should have christianism!"
  ZAG_event.3.b: "No! The State is secular!"
  ZAG_event.3.c: "Why not jewish?"
  ZAG_event.3.d: "Allah, the good path."

  ZAG_event.4.t: "On the Matter of Voting"
  ZAG_event.4.d: "Don't be an asshole"
  ZAG_event.4.a: "Allow women to vote!"
  ZAG_event.4.b: "Let's no go too fast. Allow women limited rights."
  ZAG_event.4.c: "No rights for women!"

  ZAG_event.5.t: "The First Election!"
  ZAG_event.5.d: "Elections."
  ZAG_event.5.a: "The Liberal Avédis Levon wins!"
  ZAG_event.5.b: "The Social-Democrat wins!"

  ZAG_event.6.t: "Alliance with Armenia - Proposal"
  ZAG_event.6.d: "An envoyé from 'Little Armenia', a rump state centered around the city of Adana, has arrived at our doors. They are asking for an alliance between our two countries, arguing that it would be beneficial for both or our nations due to being both 'Armenias'.\n\nWe should try to keep good relations with them but our advisors aren't sure if this is a good idea, their government being more.. democratic than ours."
  ZAG_event.6.a: "Our Armenian brothers!"
  ZAG_event.6.b: "Let's just.. keep it cool alright?"

  ZAG_event.7.t: "Alliance with Armenia - Yes"
  ZAG_event.7.d: "We have received the answer to our alliance proposal with 'Big Armenia'. They accepted a limited alliance, guaranteeing our independence and giving us military access to assist them in case of a war.\n\nWe are one step closer to being reunited with our people!"
  ZAG_event.7.a: "Our brothers!"

  ZAG_event.8.t: "Alliance with Armenia - No"
  ZAG_event.8.d: "Our diplomat is back in Adana, with bad news. The current government of Armenia in the east has refused our proposal about an alliance, stating that we were too 'ideologically unaligned' with them for such an alliance to be viable.\n\nEven if this is a blow to our efforts of being a good neighbour with our brothers, we cannot let this be the final nail in the coffin of our ambitions!\n\nAs a gift, they sent us a bit of typical armenian food."
  ZAG_event.8.a: "We're still friends, right?"




