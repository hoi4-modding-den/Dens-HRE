 ZAA_utilizing_our_spoils:0 "Utilizing Our Spoils"
 ZAA_utilizing_our_spoils_desc:0 "It would be counterproductive to merely let our... 'captured' spoils collect dust in the corner of some derelict warehouse. If anything, we should put this equipment to good use, and utilize them in a way which would improve our economy and industry.\n\nWe currently own:\n\n£ZAA_construction_equipment_texticon Construction Equipment: §H[?ZAA_construction_equipment_amount]§!\n£ZAA_industrial_machinery_texticon Industrial Machinery: §H[?ZAA_industrial_equipment_amount]§!\n£ZAA_electronic_appliances_texticon Electronic Appliances: §H[?ZAA_electronic_appliances_amount]§!\n"
 
