 #events
 ZAA.1.t:0 "Ultimatum from the Thalassocracy!"
 ZAA.1.d:0 "The Thalassocracy of Al-Bahr Al-Ahmar has offered us an ultimatum; either surrender Aqaba or face an invasion!"
 ZAA.1.a:0 "Let them come if they dare!"
 ZAA.1.b:0 "Concede to their demands"
 
 ZAA.2.t:0 "Jordan stands defiant!"
 ZAA.2.d:0 "[JOR.GetNameDefCap] has refused our ultimatum, and insists on clinging on to the Port of Aqaba."
 ZAA.2.a:0 "How foolish of them."
 
 ZAA.3.t:0 "Jordan backs down"
 ZAA.3.d:0 "Jordan has surrendered the City of Aqaba to us, meaning that our ultimatum worked."
 ZAA.3.a:0 "Perfect!"
 
 ZAA.4.t:0 "An Offer from the Thalassocracy"
 ZAA.4.d:0 "The Thalassocracy of Al-Bahr Al-Ahmar has offered us a deal; give them the Port of Aqaba, and they'll grant us military access alongside a hefty payment."
 ZAA.4.a:0 "That sounds fair..."
 ZAA.4.b:0 "Refuse this faustian bargain."
 
 ZAA.5.t:0 "Jordan accepts our offer!"
 ZAA.5.d:0 "The negotiations were a success, and Jordan are willing to hand the Port of Aqaba to us."
 ZAA.5.a:0 "The Art of the Deal."
 
 ZAA.6.t:0 "Jordan has refused our offer!"
 ZAA.6.d:0 "The negotiations have fallen apart, and Jordan has seemingly ruled out all possibilites of handing Aqaba over to us."
 ZAA.6.a:0 "That can only mean one thing..."
 