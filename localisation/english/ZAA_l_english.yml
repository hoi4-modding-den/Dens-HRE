 #decisions
 ZAA_foreign_affairs:0 "Foreign Affairs"
 ZAA_foreign_affairs_desc:0 "Even if our Thalassocracy doesn't have a Ministry of Foreign Affairs in the traditional sense, it doesn't mean that our state is unable to partake in her own fair share of diplomacy."
 
 ZAA_proclaim_the_red_sea_empire:0 "Proclaim the Red Sea Empire"
 
 ZAA_piracy_category:0 "The Naval Toll System"
 ZAA_piracy_category_desc:0 "Every Thalassocracy in the history of the world has maintained their power by maintaining strict control over their maritime areas. According to our Declaration of Independnce, all of Red Sea should be considered as our internal waters, giving us full rights to police it how we want. As a matter of fact, the Red Sea is a source of just about all wealth of our state. By collecting a 'naval toll' from all passing ships, we've slowly managed to enrich ourselves, only by maintaining authority over the sea.\n\n§HThe more states you control, the better your loot will be. On the contrary, your naval strength is directly tied to the success rate of your raids; the more you have, the better your chances.§!\n"
 
