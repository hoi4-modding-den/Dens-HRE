 #intro gui
 ZAA_intro_loc:0 "After the collapse of the Ottoman Empire, the large, Egyptian section of the imperial navy was left more or less to their own devices. They no longer had a Sultan to protect, or an empire to protect. This meant that salaries were also no longer paid, meaning that both the crews and the commanders had to find alternative methods of creating cashflow for themselves. This economic condition led to the establishment of the Thalassocracy of al-Bahr al-Ahmar, headed by the Egyptian Admiral Suleiman Ezzat, a pariah state that currently claims all of Red Sea as her internal waters, and due to that, claims to have the legal right to collect a naval toll from all passing ships. Our survival is based on the amount of wealth and goods that we are able to extract from the passing ships; the strength of our navy defines how strong our entire state is, which is why we must invest as much as possible into our ships, as the future that we are sailing towards is anything but calm.\n\n§HCurrent Content:§! \n\n §G-Build an undefeatable navy, following the footsteps of the Pharaos and the Fatimids.\n-Seize control of the full coastline of our internal waters and form the Red Sea Empire.\n-Become an industrial and naval powerhouse of the Middle East\n\n§HAvailable Achievements:§!\n\n-§gPirates of the Erythraean\n-Funny How?§!"
 ZAA_credits:0 "Credits for the Thalassocratic Content: §Hkasastul/Kåsastul§!, \nCredits for the rest of the content: \n§HThe HOI4 Modding Den Discord Server§!"
 
