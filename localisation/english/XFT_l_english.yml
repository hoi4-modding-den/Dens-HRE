### IDEAS ###
 XFT_baltic_arms_rivalry:0 "The Baltic Naval Rivalry"
 XFT_baltic_arms_rivalry_desc:0 "Ever since the dawn of our nation in the port city Greifenberg, trade has always been our strongsuit, as convoys went in and out of our port as a way to help the empire with much needed outside resources, however, in recent years, the Principality of Hamburg has also gotten a similar idea. Since a couple years now, a very clear rivalry has been set up, not only politically, but also in our Navy."
 XFT_Gustaf_3:0 "Gustaf III"
 XFT_Gustaf_3_desc:0 "Our most excellant Duke, Gustaf III is the reason why our nation has become so prominent in the stage of Europe, no matter how dire the world may seem, our citizen know that, as long as our duke is here, then the nation should stay unified!"