l_english:

 XFT_GATHERING_STORM_DESC: "Situated along the Baltic sea, the Duchy of Handelmagny has always held a firm grip on the commerce in the north of the Holy Roman Empire; however, some politicians believe that simply trading isn't the way anymore, thankfully, with the recent election of 1934 bringing the P-FAH to lead as the new ministers of the duchy, a bright opportunity for the nation has been presented. With a norm which some say is likely to change as the next dawn strikes some believe that the Seahorse must strike before it's final day goes to pass..."

