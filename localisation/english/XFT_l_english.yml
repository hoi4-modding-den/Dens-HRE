#events, woah...#
XFT.1.t:0 "Death of Erik von Küsrtin"
XFT.1.d:0 "Following an illness some can only theorized was caused stress of the european climate. Erik von Küsrtin, the minister of the [XFT.GetNameDef] has passed away on the night of the final moon of March.\n \nErik von Küsrtin had been mainly known through the duchy and the empire as a whole for his longing to unite the empire through means of togetherness in a community through trade... \nIt is still unkown if his legacy is to be followed, however one thing is for sure, is that Europe has lost a figure far too soon..."
XFT.1.a:0 "Our condolences"
XFT.1.b:0 "Let's hope their new leader is more open to negotiate!"
XFT.1.c:0 "Rest well..."

### IDEAS ###
 XFT_baltic_arms_rivalry:0 "The Baltic Naval Rivalry"
 XFT_baltic_arms_rivalry_desc:0 "Ever since the dawn of our nation in the port city Greifenberg, trade has always been our strongsuit, as convoys went in and out of our port as a way to help the empire with much needed outside resources, however, in recent years, the Principality of Hamburg has also gotten a similar idea. Since a couple years now, a very clear rivalry has been set up, not only politically, but also in our Navy.\n \n§W$XHH_baltic_sea_control_dispute_tt$§!"
 XFT_Gustaf_3:0 "Gustaf III"
 XFT_Gustaf_3_desc:0 "Our most excellant Duke, Gustaf III is the reason why our nation has become so prominent in the stage of Europe, no matter how dire the world may seem, our citizen know that, as long as our duke is here, then the nation should stay unified!"