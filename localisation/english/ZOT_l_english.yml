### IDEAS/NATIONAL SPIRITS ###
ZOT_fractured_eyalets: "Fractured Eyalets"
ZOT_fractured_eyalets_desc: "Though the core territories remain technically loyal to the House of Osman, the reality on the ground is far more fractured. Local provincial governors, wary of the central government’s perceived weakness, have begun withholding tax revenues to fund their own private militias and local protection rackets. These governors prioritize their own regional survival over the needs of the Sublime Porte, creating a patchwork of semi-autonomous fiefdoms. This defiance not only drains the Imperial treasury but fuels a cycle of instability that threatens to tear the remnant state apart from within."
ZOT_the_emergency_requisition_act: "The Emergency Requisition Act"
ZOT_the_emergency_requisition_act_desc: "Passed by the Sultan in a moment of absolute desperation, the Emergency Requisition Act is a drastic attempt to halt the state's economic hemorrhaging. The act mandates the part-nationalization of vital industries and forces the remaining labor force into grueling shifts to sustain the war machine. While these harsh measures have temporarily stabilized the logistics of the Salvation Government, the political cost is high. Overworked laborers and dispossessed business owners harbor growing resentment, which could reach a boiling point if the measures are not revised."
ZOT_steel_will: "Çelik İrade"
ZOT_steel_will_desc: "The concept of 'Çelik İrade', known as the 'Steel Will', is a political movement born from the ashes of the Great Collapse. Ultranationalist and hardline elements within the Sublime State have begun advocating for a ruthless restoration of the lost Anatolian territories, favoring absolute centralized authority over the bureaucratic corruption that preceded the Empire's fall. At its helm is General Hüsrev Gerede, Abdülmecid II's right hand, who has fully embraced the movement and now pressures the Sultan to implement its tenets across the core territories. However, should the Sultan fail to embrace these nationalist tendencies quickly enough, a catastrophe may follow. Rumors are already spreading of Gerede centralizing power around his own person—a development that could prove fatal to the Sultan's legitimacy should a new crisis emerge."
ZOT_the_imperial_gendarmerie: "The Imperial Gendarmerie"
ZOT_the_imperial_gendarmerie_desc: "The once-mighty Ottoman Army has been reduced to a patchwork of semi-professional remnants and local garrison troops. Reorganized into the Imperial Gendarmerie, these soldiers serve as the primary thin line between order and total anarchy. Tasked with policing the core territories and suppressing domestic dissent and foreign intervention, they lack the equipment of a modern fighting force but possess the grit of veterans who have nowhere else to retreat. They are no longer an army of conquest, but a shield for the Sultan's survival."
ZOT_muhacir_refugee_crisis: "Muhacir Refugee Crisis"
ZOT_muhacir_refugee_crisis_desc: "From the purged streets of Istanbul to the lost provinces of the Middle East, a desperate tide of 'Muhacirs', loyalist migrants who seeks sanctuary under the last bastion of the Caliphate has arrived. Fleeing the harsh persecution of the Republican traitors and vengeful minority regimes, these refugees arrive with nothing but their faith and their fury."
ZOT_wreckage_of_the_empire: "Enkaz-ı İmparatorluk"
ZOT_wreckage_of_the_empire_desc: "As the dominoes began to fall around the Empire, the state started to crumble under its own weight and the pressure of external influence. The Ottoman Empire has been in a downward spiral, culminating in the 1933 Coup which saw the rise of the vile Turkish Republic led by the traitorous Mustafa Kemal in İzmit. This dark chapter saw the fall of the prestigious city of Istanbul and the total destruction of the previous Sultan's legitimacy. Ever since the proclamation of the Salvation Government and the inauguration of Abdülmecid II, the Sublime state has been on a desperate quest to restore its shattered institutions and reforge the glory of what once was."

