### CHARACTERS ###
ZOT_Abdulmecid_ii_leader_desc: "Born during the sunset of the Ottoman Sublime State, Abdülmecid II was raised as a prince of both the sword and the brush. While he underwent rigorous training in the Ottoman artillery classes and engaged in military life at a young age, he also distinguished himself as a man of refined culture and the fine arts. Yet, as the Empire faced a gathering dark storm, he was unable to seize the initiative quickly enough to halt the collapse brought on by British external pressure and internal minority uprisings. \n\nIn the wake of the 1933 Coup orchestrated by the National Salvation Movement, which saw the Empire suffer its most devastating territorial losses yet, Abdülmecid II was finally handed the reins of a crumbling state. Now, as the only figure capable of wielding the Caliphate's spiritual authority, he stands as the final hope to restore glory to the Sublime State back to its golden age."
ZOT_husrev_gerede_leader_desc: "Under the House of Osman, Hüsrev Gerede distinguished himself as a diplomat serving primarily in the Empire's European territories. Through his excellence in foreign relations and his growing internal popularity, combined with the tactical experience gained at the Ottoman Military College in his youth, Gerede rose rapidly through the ranks. He became one of the most trusted members of Abdülmecid II's cabinet following the chaos of the early 1930s.\n\nToday, however, Hüsrev Gerede has channeled the downfall of the Sublime State into a far more radical cause. Leading the hardliner and ultranationalist elements of the government, he envisions a future Empire purged of the very institutions he blames for its collapse. To Gerede, the path to salvation lies in the absolute centralization of power and the revocation of the 'overwhelming' rights previously granted to the Empire's minorities and subjects."
ZOT_huseyin_cahit_yalcin_leader_desc: "A lifelong intellectual and a close confidant of Abdülmecid II, Hüseyin Cahit Yalçın serves as a prominent conservative representative within the Sultan’s committee. While many in the capital call for absolute control, Yalçın argues that the only way to safeguard the Sublime State is through the restoration of a Constitutional Monarchy. He believes that by stabilizing the Empire’s institutions through law and representation, the government can finally heal the wounds of the 1930s. However, unlike the radicals of the past, Yalçın remains deeply loyal to the dynasty; he considers the Sultan’s personal authority and spiritual influence absolutely necessary to guide the people through these dark times. For Yalçın, the Crown and the Constitution are not rivals, but the two pillars required to prevent total collapse."
ZOT_sevket_sureyya_aydemir_leader_desc: "The Umumiye Brotherhood and its leader, Şevket Süreyya Aydemir, have become the primary scapegoats for the Empire’s recent humiliations. To the Hardliners in the Porte, Aydemir is a traitor whose movement accelerated the downfall by refusing to oppose—and in some cases, actively promoting—independence movements within the Ottoman colonies. While the government blames 'Red Subversion' for the loss of the frontier, Aydemir views the collapse as the inevitable failure of an imperialist relic. Despite heavy state surveillance and the threat of an impending ban, Aydemir remains a dangerous figure, operating through a vast underground network of secret political societies. He waits in the shadows of the 'Wreckage,' convinced that when the Sultan's government finally stumbles, the workers and the oppressed will be ready to seize what remains."

