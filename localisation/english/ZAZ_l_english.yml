  # Characters
  ZAZ_mahammad_rasulzade_leader_desc: "Mahammad Amin Rasulzade, leader of the Musavat party and father of the Azerbaijan Democratic Republic, is an aging man. Having declared marshal law in 1918 as the revolution engulfed the nation's capital, he has managed to remain the president of the republic for 18 years. Now, the people of Azerbaijan call for a new leader."
  ZBC_stepan_shaumian_leader_desc: "Stepan Georgevich Shaumian, the Caucasian Lenin, was the leader of the revolution in Caucasia. That is, until the project fell apart. Now the leader of a group of commissars only in control of the city of Baku, there is little hope left for his Caucasian revolution."