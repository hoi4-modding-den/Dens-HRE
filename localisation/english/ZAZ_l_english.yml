  # Events
  ZBC_events.1.t: "An Extraordinary Meeting"
  ZBC_events.1.desc: "Meetings of the commissars tend to be scheduled months in advance, but this time Stepan Shaumian, Commissar Extraordinary for the Caucasus, has called one on only a week's notice. Azerbaijani troops have been seen making large-scale movements, all centered around our city of Baku. But while they're here, the commisars may as well discuss anything else on their minds."
  ZBC_events.1.a: "What does this year have in store for us?"
  ZBC_events.2.t: "An Assassination Attempt on Stepan Shaumian!"
  ZBC_events.2.desc: "Today, while leaving his home, Stepan Shaumian was the target of an assassination attempt..."
  ZBC_events.2.a: "...but the bullet missed."
  ZBC_events.2.b: "Headshot!"

