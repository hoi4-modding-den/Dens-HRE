# EVENTS

 YBS_election_events.1.t: "The Military Conspiracy"
 YBS_election_events.1.desc: "Rumours have reached us that the Carlist elements within our 'army' are preparing to overthrow our Republic should the Carlists fail to win the elections. While outright hostile to the socialists and even the liberals, some Carlists have shown sympathy towards our Nationalist Party for representing more traditional values and ideas."
 YBS_election_events.1.a: "Purge them all! We must protect our democracy."
 YBS_election_events.1.a.tt: "Any chance for a §gmilitary coup§! will be §Gcrushed§!."
 YBS_election_events.1.b: "Perhaps some negotiations can be made?"
 YBS_election_events.1.b.tt: "The §gMilitary Coup§! won't occur if the §cNationalists§! win the election."

 YBS_election_events.2.t: "The Election Outcome!"
 YBS_election_events.2.desc: "Election week has come to an end and all across the Basque Country, people await the results of the elections on to be announced on the radio.\n \nThe outcome of the election is..."
 YBS_election_events.2.a: "...the Basque Nationalist Party!"
 YBS_election_events.2.b: "...the Basque Development Party!"
 YBS_election_events.2.c: "...the Basque National Action!"
 YBS_election_events.2.d: "...the Popular Front!"
 YBS_election_events.2.e: "...the Syndicalist Party!"
 YBS_election_events.2.f: "...as no majority is achieved, the Nationalists continue their rule!"
 
 YBS_election_events.3.t: "Leftist Politicians meet in Donostia"
 YBS_election_events.3.desc: "Members of both the democratic socialist Basque National Action and the Basque branch of the Syndicalist Party are meeting today in the city of Donostia to discuss a potential coalition to combine votes and secure a win against the conservative and liberal forces of reaction."
 YBS_election_events.3.a: "Solidarity forever!"
 YBS_election_events.3.b: "Pah! You're just revisionists!"

 YBS_election_events.4.t: "Socialists announce the 'Fronte Herrikoia'"
 YBS_election_events.4.desc: "Following negotiations in Donostia, the Basque National Action and the Syndicalist Party have officially decided to run under the name of the Popular Front, or Fronte Herrikoia in Basque, gathering support from leftists across the country."
 YBS_election_events.4.a: "Together for Victory!"

 YBS_election_events.5.t: "The Military seizes control!"
 YBS_election_events.5.desc: "Increased influence of subversive elements within our Armed Forces has led to a radical Carlist-aligned group seizing power during election week, ambushing representatives in the parliament right before the victory of the elections could be announced."
 YBS_election_events.5.a: "Now to sort out this chaos..."

 YBS_election_events.6.t: "Carlists end the Republic!"
 YBS_election_events.6.desc: "As the outcome of the election became clearer, the Basque Carlist Party made preparations to immediately destroy the constructs of the Republic. Working together with Carlist subversives within the military, the EAK now controls the state without any democratic interference."
 YBS_election_events.6.a: "Long live the King!"

 YBS_election_events.7.t: "Election Week begins"
 YBS_election_events.7.desc: "Election week has arrived and officials have begun to make their way to even the most isolated villages to collect their votes."
 YBS_election_events.7.a: "We'll await the results."

 YBS_election_events.8.t: "Falangist Agitation"
 YBS_election_events.8.desc: "Another clash between Anarchists and members of the Spanish Phalanx has occured in Bilbao. The population is generally opposed to the Falangists due to their views of Spanish supremacy and proposals to centralise power, giving the Anarchists the upper hand in the conflict."
 YBS_election_events.8.a: "We'll deal with them soon enough!"

 YBS_election_events.9.t: "Smuggling from Northern Navarre"
 YBS_election_events.9.desc: "Despite remaining occupied, the people of Northern Navarre remain vigilant and ever-loyal to their roots. Our Republic owes a great deal for them, since it was volunteers from Northern Navarre that helped during our declaration of independence. Even now, our country's arms industry is supplemented by Navarrese smugglers transporting weapon parts across the border."
 YBS_election_events.9.a: "One day, they too shall be free."


 YBS_post_election_events.1.t: "Fate of the Falangists"
 YBS_post_election_events.1.desc: "With the elections over, we can finally focus our attention on the Falangist rabble still roaming our lands. While de Alda and his men are no threat to the republic, they still continue to sabotage our military and make the people feel unsafe. It is time to get rid of them."
 YBS_post_election_events.1.a: "Just get them across the border."

 YBS_post_election_events.2.t: "Ending Republican Resistance"
 YBS_post_election_events.2.desc: "Our takeover has not come without resistance, especially from the democratic and communist groups that would rather die than live under another monarchy. We must eliminate any threat to the rule of our righteous royal."
 YBS_post_election_events.2.a: "Hold a 'Parade'."
 YBS_post_election_events.2.b: "Mobilise the garrison, open fire if the opposition acts violent."

 YBS_post_election_events.3.t: "Exiled Basque Falangists arrive in [ROOT.capital.GetCapitalVictoryPointName]"
 YBS_post_election_events.3.desc: "The falangist branch in the Basque Country has been exiled from the country and now our brothers arrive in our capital as heroes that fought for our beliefs in a foreign land."
 YBS_post_election_events.3.a: "Welcome, Brothers!"

 YBS_post_election_events.4.t: "Corporations seize Control of the Nation"
 YBS_post_election_events.4.desc: "With the growing influence of the Hanseatic League and other foreign companies, the liberals have become a de facto puppet government of their corporate overlords. Now a special commission has been established to officially represent Hanseatic interests in the Basque Country and Iberia."
 YBS_post_election_events.4.a: "Time to make some more money."

 YBS_post_election_events.5.t: "Guns of the Patriots"
 YBS_post_election_events.5.desc: "Patriotic citizens have announced the formation of a militia group to support the government in defending the country. The members of 'Euskadi Ta Askatasuna', 'Basque Homeland and Liberty', have sworn to protect their nation both from foreign forces wishing to crush it and from the internal threats, the Carlist backstabbers and Falangist traitors."
 YBS_post_election_events.5.a: "Our Independence is backed by Weapons!"

 YBS_post_election_events.6.t: "Remnants of the Iberian Fleet join us!"
 YBS_post_election_events.6.desc: "During the tensions that brought the collapse of the Kingdom of Iberia, there had been a large sailor revolt and a significant portion of the Iberian fleet mutinied. With our restoration of an Iberian authority, these sailors have now made their return in hopes of being pardoned for their mutiny."
 YBS_post_election_events.6.a: "We welcome the brave sailors!"
 YBS_post_election_events.6.a.tt: "A fraction of the §YNavy§! that defected before the §gCollapse of Iberia§! will §Gjoin us§!."

 YBS_post_election_events.7.t: "Anti-Government Militias expand Operations"
 YBS_post_election_events.7.desc: "In the wake of our attempts to centralise the Federation into a Federal Republic, multiple groups across the nation have begun to work against us, organising militia groups and sabotaging the integration of regional administrations."
 YBS_post_election_events.7.a: "Stop them!"

 YBS_post_election_events.8.t: "The Sagrada Família captured!"
 YBS_post_election_events.8.desc: "Our troops have finally secure the Sagrada Família after a very long fight with some militia that had hunkered down in the cathedral's lower areas. It was the last part of Barcelona to fall.\n \nWhat should be done with the site?"
 YBS_post_election_events.8.a: "Begin reconstruction. We will complete Gaudí's work!"
 YBS_post_election_events.8.b: "Take everything not nailed down! We can repair later!"

 YBS_post_election_events.9.t: "Unrest in occupied Territories"
 YBS_post_election_events.9.desc: "There is unrest in territories occupied by the army due to their oppressive handling of the local people."
 YBS_post_election_events.9.a: "Hand power to local councils to appease them."
 YBS_post_election_events.9.a.tt: "Unlocks the unique §Y$YBS_iberian_reconciliation$§! occupation law."

 YBS_diplo_events.1.t: "[FROM.GetNameDefCap] officially adopts State Catholicism"
 YBS_diplo_events.1.desc: "The [FROM.GetAdjective] government recently passed a new constitutional referendum in which Catholicism was officially adopted as the state religion of [FROM.GetNameDef]."
 YBS_diplo_events.1.a: "May God bless them."

 YBS_diplo_events.2.t: "[FROM.GetNameDefCap] wants us to join them"
 YBS_diplo_events.2.desc: "WIP"
 YBS_diplo_events.2.a: "Very well, together."
 YBS_diplo_events.2.b: "We cannot surrender our independence!"

 YBS_diplo_events.3.t: "Galicia accepts our Protection!"
 YBS_diplo_events.3.desc: "The Galician government has accepted our proposal and has handed over control over their lands to us."
 YBS_diplo_events.3.a: "United we stand!"

 YBS_diplo_events.4.t: "Galicia refuses!"
 YBS_diplo_events.4.desc: "The Galician government has refused, citing that their own sovereignty is more important than restoring order and democracy in Iberia."
 YBS_diplo_events.4.a: "I suppose that's fair."

 YBS_diplo_events.5.t: "[FROM.GetNameDefCap] prepares for War!"
 YBS_diplo_events.5.desc: "Recent reports from our border show a buildup of [FROM.GetAdjective] troops. Our officers worry that this indicates a continuation of the Iberian Civil War between us and [FROM.GetNameDef]."
 YBS_diplo_events.5.a: "Ready the Army!"
 YBS_diplo_events.5.a.tt: "[FROM.GetNameWithFlag] will declare §RWar§! in §Y30 Days§!."

 YBS_diplo_events.6.t: "[FROM.GetNameDefCap] offers a Merger"
 YBS_diplo_events.6.desc: "WIP"
 YBS_diplo_events.6.a: "This will increase our profits!"
 YBS_diplo_events.6.b: "We can't risk this."

 YBS_diplo_events.7: "Ordinas accepts the Merger"
 YBS_diplo_events.7.desc: "The government of the Balearic Islands has accepted our offer for a merger!"
 YBS_diplo_events.7.a: "Record profits!"

 YBS_diplo_events.8: "Ordinas refuses the Merger"
 YBS_diplo_events.8.desc: "The government of the Balearic Islands has refused our offer to combine our enterprises."
 YBS_diplo_events.8.a: "It could have been a great opportunity."

 YBS_diplo_events.9.t: "[FROM.GetNameDefCap] appropriates our Assets!"
 YBS_diplo_events.9.desc: "The new syndicalist government in the Basque Country has decided to seize our economic assets!"
 YBS_diplo_events.9.a: "Retaliate with an Embargo!"

 YBS_diplo_events.10.t: "[FROM.GetNameDefCap] calls for Unity"
 YBS_diplo_events.10.desc: "WIP"
 YBS_diplo_events.10.a: "Solidarity among Revolutionaries!"
 YBS_diplo_events.10.b: "Pah! You're just Revisionists!"

 YBS_diplo_events.11.t: "[FROM.GetNameDefCap] unites with us"
 YBS_diplo_events.11.desc: "The leaders of [FROM.GetNameDef] have accepted our calls for unity and their territory and troops are now administered by us."
 YBS_diplo_events.11.a: "Solidarity forever!"

 YBS_diplo_events.12.t: "[FROM.GetNameDefCap] refuses Unity!"
 YBS_diplo_events.12.desc: "The [FROM.GetAdjective] leaders have betrayed the revolution and denounced us as revisionists!"
 YBS_diplo_events.12.a: "Another betrays the Revolution."

 YBS_diplo_events.13.t: "[FROM.GetNameDefCap] offers Reconciliation"
 YBS_diplo_events.13.desc: "WIP"
 YBS_diplo_events.13.a: "Carlism doens't sound too bad."
 YBS_diplo_events.13.b: "We cannot compromise on our values!"

 YBS_diplo_events.14.t: "[FROM.capital.GetCapitalVictoryPointName] surrenders!"
 YBS_diplo_events.14.desc: "The traitors have accepted our offer to subjugate themselves to the crown."
 YBS_diplo_events.14.a: "Wise choice."

 YBS_diplo_events.15.t: "The Traitors refuse our Mercy!"
 YBS_diplo_events.15.desc: "The traitors that escaped to [FROM.capital.GetCapitalVictoryPointName] have refused our merciful offer. It's time for war."
 YBS_diplo_events.15.a: "They have chosen... Death."

 YBS_diplo_events.16.t: "[FROM.GetAdjectiveCap] Government offers Passage Home"
 YBS_diplo_events.16.desc: "WIP"
 YBS_diplo_events.16.a: "Finally home!"
 YBS_diplo_events.16.b: "No! We will stay!"

 YBS_diplo_events.17.t: "French Commanders accept our offer"
 YBS_diplo_events.17.desc: "The commanders of the French Regiment have accepted our offer to send them home, allowing our troops to enter their occupied territory."
 YBS_diplo_events.17.a: "We will organise a train home."
 YBS_diplo_events.17.a.tt: "The §YFrench Regiment§! returns home."

 YBS_diplo_events.18.t: "French Commanders refuse negotiations"
 YBS_diplo_events.18.desc: "Our diplomats sent to the remnants of the French intervention force have returned unsuccessful due to the French commanders stubborness to hear us out."
 YBS_diplo_events.18.a: "Their loss. To War!"

 YBS_diplo_events.19.t: "Demoralised Troops"
 YBS_diplo_events.19.desc: "Our continuing war with [YBS.GetNameDef] has begun to demoralise our troops as they see the spirit of the Basque people triumph even in adversity."
 YBS_diplo_events.19.a: "Continue Fighting!"

 YBS_diplo_events.20.t: "Formation of a Holy Alliance"
 YBS_diplo_events.20.desc: "WIP"
 YBS_diplo_events.20.a: "God Wills It."
 YBS_diplo_events.20.b: "Heresy."

 YBS_diplo_events.21.t: "The Papal State joins the Holy Alliance"
 YBS_diplo_events.21.desc: "The Pope has blessed our alliance by joining it!"
 YBS_diplo_events.21.a: "God Wills It!"

 YBS_diplo_events.22.t: "The Papal State refuses to join the Holy Alliance"
 YBS_diplo_events.22.desc: "The Pope has refused to be part of a Holy Alliance led by us."
 YBS_diplo_events.22.a: "If it is His will..."

 YBS_diplo_events.23.t: "Skirmish at the [FROM.FROM.GetAdjective] Border"
 YBS_diplo_events.23.desc: "Our officers are reporting a skirmish between our troops and an invading force from [FROM.FROM.GetNameDef]. While no official declaration of war has been made, it is obvious what this means."
 YBS_diplo_events.23.a: "How dare they try these underhanded methods!"
 YBS_diplo_events.23.b: "We cannot risk war right now..."

 YBS_diplo_events.24.t: "[FROM.GetName] declares War over Border Skirmish!"
 YBS_diplo_events.24.desc: "The [FROM.GetAdjective] government has issued a declaration of war over a skirmish supposedly carried out by our troops at their border."
 YBS_diplo_events.24.a: "Could this have been their plan?"

 YBS_diplo_events.25.t: "[FROM.GetName] offers Non-Aggression Pact"
 YBS_diplo_events.25.desc: "WIP"
 YBS_diplo_events.25.a: "We accept."
 YBS_diplo_events.25.b: "We refuse."

 YBS_diplo_events.26.t: "[FROM.GetName] accepts Non-Aggression Pact"
 YBS_diplo_events.26.desc: "The [FROM.GetAdjective] government has fallen for our trap and accepted our "Non-Aggression Pact"."
 YBS_diplo_events.26.a: "Perfect."

 YBS_diplo_events.27.t: "[FROM.GetName] refuses Non-Aggression Pact"
 YBS_diplo_events.27.desc: "The [FROM.GetAdjective] government has seen through our ruse and refused the pact."
 YBS_diplo_events.27.a: "They'll come around..."
 YBS_diplo_events.27.b: "Then we strike now!"

 YBS_diplo_events.28.t: "Defections to [FROM.GetNameDef]"
 YBS_diplo_events.28.desc: "Soldiers are defecting to [FROM.GetNameDef], expecting their Republican government to stand victorious."
 YBS_diplo_events.28.a: "Curses!"

 YBS_esperanto_events.1.t: "A Flag for the Republic"
 YBS_esperanto_events.1.desc: "Upon the declaration of the Republic of Hope, many proposals for a national flag were submitted to the government. While during the proclamation the flag of the Esperantists was waved by the revolutionaries, we still need to consider its adaptation.\n \nTwo other main proposals have come forth during that time, the first being a rather ironic one at that. The 'Green Star Tricolour' or 'Verda Stelo Trikoloro' shows a bicolour with one vertical white stripe between two green stripes and the Verda Stelo in the centre of it. While its usage of only two colours would suggest it be named a bicolour, its artist, the Russian exile Alexei Kemersky, insists upon its name as 'Tricolour' in a symbolic sense, as many notable republics in history were represented by them.\n \nThe second proposal, luckily, is less symbolically complex. The 'Banner of Nine Stars' or 'Standardo de Naŭ Stelo' shows nine white stars on a green background with a white stripe on the lower part of the flag. The nine stars represent the people of the world, one star for each region: North and South America, Africa, Oceania, Polynesia, excluded from America or Oceania, Asia, Europe, Eurasia, as a reconciliation between the two systems of depicting the continents and Antarctica. The white stripe stands for unity and reaching out from one side to the other.\n \nNow it is up to parliament to decide to adopt one of the two flags or officially adopt the Esperanto Flag for the new republic."
 YBS_esperanto_events.1.a: "We will continue using the Esperanto Flag."
 YBS_esperanto_events.1.a.tt: "We will adopt this flag as a §Ynational flag§!.\n \n \n£GFX_focus_YBS_esperanto_flag_1_texticon\n \n \n \n§L'The Esperanto Flag'§!"
 YBS_esperanto_events.1.b: "Adopt the 'Verda Stelo Trikoloro'"
 YBS_esperanto_events.1.b.tt: "We will adopt this flag as a §Ynational flag§!.\n \n \n£GFX_focus_YBS_esperanto_flag_2_texticon\n \n \n \n§L'Green Star Tricolour'§!"
 YBS_esperanto_events.1.c: "Adopt the 'Standardo de Naŭ Stelo'"
 YBS_esperanto_events.1.c.tt: "We will adopt this flag as a §Ynational flag§!.\n \n \n£GFX_focus_YBS_esperanto_flag_3_texticon\n \n \n \n§L'Banner of Nine Stars'§!"

 YBS_esperanto_events.3.t: "Application for the 29th World Esperanto Congress"
 YBS_esperanto_events.3.desc: "Some of the Esperantists within our government are proposing we apply to have the 29th Universala Kongreso de Esperanto be held in our capital city Bilbao, citing that it would be a great opportunity to strengthen our bonds with the wider internationalist movements."
 YBS_esperanto_events.3.a: "Ni devas esti la gastigantoj!"
 YBS_esperanto_events.3.a.tt: "The §G29th World Esperanto Congress§! will be held in §YBilbao§!, unless §Rwar§! disturbs it."
 YBS_esperanto_events.3.b: "That's nice, but it is not our priority."
 YBS_esperanto_events.3.b.tt: "The §G29th World Esperanto Congress§! will be held in §gWarsaw§!, depriving us of its §Ypossibilities§!."


 YBS_anarchist_events.1.t: "Elections in the Regional Councils"
 YBS_anarchist_events.1.desc: "With the Revolution victorious in Iberia, it is time to let the people decide the path their land shall take. Two streams of political thought have found a major following during the reunification wars:\n \nThe Platformists represent the majority of the anarchist current, wishing for the revolution to continue under the leadership of an elected defence council, representing the entirety of the free territories. There are also some elements within their group that wish to abolish a leadership position in general and simply let each region govern themselves on their own.\n \nThe Syndicalists on the other hand, aside from being quite unhappy that their revolution was hijacked by the Anarchists, wish to continue their current policies of worker self-management and form a trade union government."
 YBS_anarchist_events.1.a: "Let's who will prevail!"
 YBS_anarchist_events.1.a.tt: "We will get §Ysuccessive events§! about the election in each region.\n \nOur §gpolitical situation§! will change depending on who got the §Ymajority§!."

 YBS_anarchist_events.2.t: "The Representative of Andalusia"
 YBS_anarchist_events.2.desc: "The elections in Andalusia are done and the results for who will represent the region are in."
 YBS_anarchist_events.2.a: "The Platformists secure the position!"
 YBS_anarchist_events.2.b: "The Syndicalists secure the position!"

 YBS_anarchist_events.3.t: "The Representative of Aragón-La Rioja"
 YBS_anarchist_events.3.desc: "The elections in Aragón and La Rioja are done and the results for who will represent the region are in."

 YBS_anarchist_events.4.t: "The Representative of Asturias-León"
 YBS_anarchist_events.4.desc: "The elections in Asturias-León are done and the results for who will represent the region are in."

 YBS_anarchist_events.5.t: "The Representative of Catalonia-Balearics"
 YBS_anarchist_events.5.desc: "The elections in Catalonia and the Balearics are done and the results for who will represent the region are in."

 YBS_anarchist_events.6.t: "The Representative of the Central Region"
 YBS_anarchist_events.6.desc: "The elections in the Central Region are done and the results for who will represent the region are in."

 YBS_anarchist_events.7.t: "The Representative of Extremadura"
 YBS_anarchist_events.7.desc: "The elections in Extremadura are done and the results for who will represent the region are in."

 YBS_anarchist_events.8.t: "The Representative of Galicia-Portugal"
 YBS_anarchist_events.8.desc: "The elections in Galicia and Portugal are done and the results for who will represent the region are in."

 YBS_anarchist_events.9.t: "The Representative of the Levante Region"
 YBS_anarchist_events.9.desc: "The elections in the Levante Region are done and the results for who will represent the region are in."

 YBS_anarchist_events.10.t: "The Representative of Murcia"
 YBS_anarchist_events.10.desc: "The elections in Murcia are done and the results for who will represent the region are in."

 YBS_anarchist_events.11.t: "The Representative of the Basque Country"
 YBS_anarchist_events.11.desc: "The elections in the Basque Country are done and the results for who will represent the region are in."

 YBS_anarchist_events.12.t: "The Positions within the Defence Council"
 YBS_anarchist_events.12.desc: "The representatives of each region have finished their debate and the outcome is now clear."
 YBS_anarchist_events.12.a: "The Anarchists have all votes and abolish the system!"
 YBS_anarchist_events.12.b: "The Defence Council is established!"
 YBS_anarchist_events.12.c: "The Trade Unions return!"


 YBS_news_events.1.t: "Carlists overthrow the Basque Country Republic"
 YBS_news_events.1.desc: "Following election week in the Basque Country, a group of Carlist-aligned military officers has put all elected officials under arrest and declared martial law over the Basque Country.\n \nThe new government headed by the military junta has already declared an end to the Republic of the Greater Basque Country and the establishment of a temporary military government until the Carlist heir can be coronated."
 YBS_news_events.1.a: "A sad day for democracy."
 YBS_news_events.1.b: "Another one falls to reaction."
 YBS_news_events.1.c: "They remain an enemy..."
 YBS_news_events.1.d: "A potential ally?"
 YBS_news_events.1.e: "Okay."
 YBS_news_events.1.f: "Thy Kingdom Come!"

 YBS_news_events.2.t: "Nationalists win Basque Elections"
 YBS_news_events.2.desc: "The Basque Nationalist Party has won the elections in the Basque Country. As the ones to declare independence, it is only natural that their popularity with the people is high. Their campaign mostly focused on protecting independence and supporting the people."
 YBS_news_events.2.a: "Who would have guessed..."
 YBS_news_events.2.b: "The bourgeoisie remains in control."
 YBS_news_events.2.c: "We have a lot to do!"

 YBS_news_events.3.t: "Liberals win Basque Elections"
 YBS_news_events.3.desc: "The Basque Development Party has won the elections in the Basque Country. Their party leader, Eli Gallastegi, a former Nationalist Party member who left after the declaration of independence due to the disunity in the party, has mostly made tame promises during his campaign. From allowing international business into our nation to decreasing administratiorial bloat, the liberals have promised a wide range of reforms."
 YBS_news_events.3.a: "Capital always wins."
 YBS_news_events.3.b: "The bourgeoisie strengthens its hold."
 YBS_news_events.3.c: "It's time for reform!"

 YBS_news_events.4.t: "Socialists win Basque Elections"
 YBS_news_events.4.desc: "The Basque National Action has won the elections in the Basque Country. Their party leader, Tomás Bilbao, had promised during the campaign to increase social spending and begin the construction of a welfare state and protecting the poor. While slightly opposed to the Syndicalists, they still wish to cooperate with the Unions."
 YBS_news_events.4.a: "Reform rather than revolution?"
 YBS_news_events.4.b: "Perhaps the workers don't have to free themselves?"
 YBS_news_events.4.c: "Let's focus on the task at hand!"

 YBS_news_events.5.t: "Syndicalists win Basque Elections"
 YBS_news_events.5.desc: "The Syndicalist Party has won the elections in the Basque Country. Their close relationship with the unions and the workers and their promises for a welfare program and public education has brought them their win. Despite being one of the most radical parties in the country, they do not plan on dismantling the institutions of the republic, believing that since the Basque Country is a young state, it is still possible to achieve their aims through reform."
 YBS_news_events.5.a: "Will they join their Catalonian friends?"
 YBS_news_events.5.b: "Another Victory for the Workers!"
 YBS_news_events.5.c: "Workers, unite!"

 YBS_news_events.6.t: "Popular Front wins Basque Elections"
 YBS_news_events.6.desc: "The Popular Front, the coalition of the Basque National Action and the Syndicalist Party, has won the elections in the Basque Country. While most of their program has been adopted from the Basque National Action, some of the most important goals of the Syndicalists has been integrated, including teaching Esperanto and increasing support for the Unions."
 YBS_news_events.6.a: "Democratic Socialists and Syndicalists together?"
 YBS_news_events.6.b: "Workers, unite!"
 YBS_news_events.6.c: "We will hold our promises!"

 YBS_news_events.7.t: "Proclamation of the Republic of Hope"
 YBS_news_events.7.desc: "In an unexpected twist of events, the democratic socialist government of the Basque Country has adopted the Internationalist Cause for themselves, officially disbanding the Basque Country Republic and establishing a new country, called the Republic of Hope.\n \nThis new nation, freed from the boundaries of Nationalism and Irridentism, seeks to unite the peoples of the world through a common language, Esperanto, as well as abandoning the basic concept of a nation for a specific nationality."
 YBS_news_events.7.a: "Can they do that?"
 YBS_news_events.7.b: "An interesting experiment."
 YBS_news_events.7.c: "This must be the work of 'subversive elements'!"
 YBS_news_events.7.d: "Espero triumfos!"

 YBS_news_events.8.t: "29th World Esperanto Congress in Bilbao"
 YBS_news_events.8.desc: "The 29th World Esperanto Congress was held this week in the capital city of the Basque Country, Bilbao. Many Esperantists from across the world attended the congress, which was held in the Txabarri Jauregia (Chavarri Palace) in the centre of the city. Among the attendees were the leader of the Popular Front's Syndicalists, the Anarcho-Syndicalist Rosa Laviña, the Chinese Anarchist Lu Jianbo and the Georgian Linguist Nikolai Marr."
 YBS_news_events.8.a: "Interesting."
 YBS_news_events.8.b: "Estas honoro!"

 YBS_news_events.9.t: "Formation of the Hopeful Internationale"
 YBS_news_events.9.desc: "In an effort to oppose the influences of the Third International, the Esperantists of the Respubliko de Espero have proclaimed the formation of the 'Hopeful Internationale', an international organisation for cooperation between the many international Esperantist movements across the globe.\n \nInternational recognition of the Internationale has however been low, with many nations seeing the project as a plan to subvert the powers of the state and erase national structures and borders."
 YBS_news_events.9.a: "Interesting?"
 YBS_news_events.9.b: "The Internationale will save the Human Race!"

 YBS_news_events.10.t: "Carlist Victory in Iberia"
 YBS_news_events.10.desc: "The Iberian Civil War has come to an end, with the Carlist Loyalists successfully restoring their long-lost crown. Despite their humble beginning as a local insurrection in the Basque Country, the Carlist forces have come far.\n \nWith the collapse of Iberia undone, the Royal House has already announced plans to restore Iberian colonies in Africa and seek approvement from His Holiness, the Pope."
 YBS_news_events.10.a: "Curse the Reactionary Crown!"
 YBS_news_events.10.b: "At least the bloodshed is over."
 YBS_news_events.10.c: "The Kingdom is dead, long live the Kingdom!"

 YBS_news_events.11.t: "Federalist Victory in Iberia"
 YBS_news_events.11.desc: "The Iberian Civil War has come to an end, with the forces of the Basque Democrats successfully entrenching Federalism as Iberia's new future. [YBS.GetNameDefCap] has already gained wide recognition as the legitimate government of Iberia, but there is sitll the matter of the lost African colonial territories, since the Iberian parliament is split on whether to restore colonial rule or let them remain free."
 YBS_news_events.11.a: "At least the bloodshed is over."
 YBS_news_events.11.b: "Democracy prevails in Europe."
 YBS_news_events.11.c: "Victory at last."

 YBS_news_events.12.t: "Anarcho-Syndicalist Victory in Iberia"
 YBS_news_events.12.desc: "The Iberian Civil War has come to an end, with a coalition of leftist forces, ranging from Anarchists to Authoritarian Communists, leading the peninsula under a joint Defence Council.\n \nNo concrete form of government except local unions and councils and a semi-centralised government under the Defence Council exist, but news have reached the world that regional elections to end this state of limbo the government is in will soon be held."
 YBS_news_events.12.a: "Curse those Socialists!"
 YBS_news_events.12.b: "The Age of Revolution will come."
 YBS_news_events.12.c: "Our Revolution is not yet over."

 YBS_news_events.13.t: "Esperantist Victory in Iberia"
 YBS_news_events.13.desc: "The Iberian Civil War has come to an end and in an unexpected string of circumstances, the Republic of Hope has prevailed against all odds.\n \nThe General Committee of the Republic has already reaffirmed their commitment to the internationalist cause, seeking to liberate the former Iberian colonies first before Europe will get their full attention."
 YBS_news_events.13.a: "A-Ha."
 YBS_news_events.13.b: "Internationalism is the way forward for the Human Race!"

 YBS_news_events.14.t: "Hanseatic Victory in Iberia"
 YBS_news_events.14.desc: "The Iberian Civil War has come to an end, with the Corporate-controlled Free Trade Zone of the Basque Country successfully uniting the peninsula."
 YBS_news_events.14.a: "Aren't they just a puppet of Hamburg?"
 YBS_news_events.14.b: "Our stocks will rise dramatically!"


