# IDEOLOGIES

 YBS_market_liberalism: "Market Liberalism"
 YBS_market_liberalism_desc: "An uncompromising devotion to free markets and private wealth, Market Liberalism seeks to ensure that democracy serves the interests of commerce. The state intervenes only to safeguard property and contracts, while industry, trade, and finance shape the course of the nation. Politics is defined less by ideology than by the pursuit of prosperity." # copied _desc from hyper_capitalism in YBL_l_english.yml
 YBS_international_esperantism: "International Esperantism"
 YBS_international_esperantism_desc: "Covering a wide range of ideological positions, from Anarchism and Socialism to Social Liberalism, International Esperantism seeks to unite people and nations using the Esperanto auxiliary language. Its most prominent representative organisation is the Universala Esperanto-Asocio."


# CHARACTERS

 YBS_jose_antonio_aguirre_name: "José Antonio Aguirre"
 YBS_jose_antonio_aguirre_desc: "§YFull Name:§! §LJosé Antonio Aguirre y Lecube§!\n§YBorn:§! §LMarch 6. 1904, in Bilbao§!\n§YBackground:§! §LLeader of the Basque Nationalist Party and the person to declare Basque Independence in the turmoil of the Iberian Civil War. He is the first President of the Republic of the Basque Country.§! $XHH_is_historical_character_tt$"
 YBS_eli_gallastegi_name: "Eli Gallastegi"
 YBS_eli_gallastegi_desc: "§YFull Name:§! §LElias ''Eli'' Gallastegi Uriarte§!\n§YBorn:§! §LJuly 20. 1892, in Bilbao§!\n§YBackground:§! §LA former member of the Basque Nationalist Party, Eli formed his own party after the declaration of Basque Independence to promote more liberal policies which he was unable to in the EAJ.§! $YBS_changed_historical_character_tt$"
 YBS_tomas_bilbao_hospitalet_name: "Tomás Bilbao"
 YBS_tomas_bilbao_hospitalet_desc: "§YFull Name:§! §LTomás Bilbao Hospitalet§!\n§YBorn:§! §LSeptember 18. 1890, in Bilbao§!\n§YBackground:§! §LA Basque architect and socialist politician. He is one of the founders of the Basque National Action and previously served as minister of justice.§! $XHH_is_historical_character_tt$"
 YBS_trade_union_congress_name: "Sindikatuen Kongresua"
 YBS_trade_union_congress_desc: "§YEnglish Name:§! §LCongress of Trade Unions§!"
 YBS_defence_council_name: "Konsilio de Regionaj Anarkiismaj Federacioj"
 YBS_defence_council_desc: "§YEnglish Name:§! §LCouncil of Regional Anarchist Federations§!"
 YBS_rosa_lavina_name: "Rosa Laviña"
 YBS_rosa_lavina_desc: "§YFull Name:§! §LRosa Laviña i Carreras§!\n§YBorn:§! §LJanuary 14. 1918, in Palafrugell§!\n§YBackground:§! §LLeading member of the Libertarian Youth in Catalonia and supporter of the Esperanto Movement, Laviña i Carreras has moved to the Basque Country to support the revolutionary struggle in their Iberian neighbour state.§! $XHH_is_historical_character_tt$"
 YBS_carlist_junta_name: "Basque Military Junta"
 YBS_handelskommission_name: "Hansesonderkommission Iberien"
 YBS_handelskommission_desc: "§YEnglish Name:§! §LHanseatic Special Commission in Iberia§!"
 YBS_julio_ruiz_de_alda_name: "Julio Ruiz de Alda"
 YBS_julio_ruiz_de_alda_desc: "§YFull Name:§! §LJulio Ruiz de Alda Miqueleiz§!\n§YBorn:§! §LOctober 7. 1897, in Lizarra§!\n§YBackground:§! §LTogether with Primo de Rivera, he founded the Falangist movement. He was an aviator in the Iberian National Army and completed a transatlantic flight in 1926 in the 'Plus Ultra'. With the collapse of Iberia, he returned to his homelands to fight for Falangism and Iberian reunification.§! $XHH_is_historical_character_tt$"
 YBS_xavier_of_bourbon_parma_name: "Javier I."
 YBS_xavier_of_bourbon_parma_desc: "§YFull Name:§! §LFrancisco Javier de Borbón-Parma y de Braganza§!\n§YBorn:§! §LMay 25. 1889, in Lucca, Padania§!\n§YBackground:§! §LDon Javier is the rightful heir to the throne of Spain following Carlist succession.§! $XHH_is_historical_character_tt$"
 YBS_literal_anarchy_name: "Mother Anarchy"
 YBS_literal_anarchy_desc: "Anarchy reigns supreme! Humanity has been unshackled from the constraints of Authoritarian rule and within the Free Lands, they are safe from kings, dictators and all kinds of despots. After all, Mother Anarchy loves her Sons!"
