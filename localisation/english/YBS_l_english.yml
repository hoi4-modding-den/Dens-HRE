# IDEAS

 YBS_underdeveloped_economy: "Underdeveloped Economy"
 YBS_underdeveloped_economy_desc: "Our Region had been neglected by the government in Madrid for years. Minimal infrastructure maintenance, low industrialisation and few investments into the Basque country have left us with few economic opportunities following our independence."
 YBS_underdeveloped_economy_tt: " \nWill be §Gremoved§! once all Basque starting states have at least §YLevel 4 Infrastructure§! or we have at least §Y20 Factories§!."
 YBS_disjointed_military: "Disjointed Military"
 YBS_disjointed_military_desc: "Our armed forces are not prepared for any direct conflict. While the Nationalist Party was eager to declare independence, our military power was barely enough to repel immediate attempts to subvert it. Our current army is made up of nationalist militia and sympathetic members of the former Iberian National Army. There are also rumours that some of the Carlist officers aren't as loyal to the parliament as expected."
 YBS_language_issue: "Language Divisions"
 YBS_language_issue_desc: "Our nation is divided between the native Basque people and the Spanish. Despite our government officially recognising both Spanish and Basque as our national languages, this division of culture and language is significantly affecting regular civilian life and our military cohesion."
 YBS_language_issue_basque_dominant: "Enforcing Euskara"
 YBS_language_issue_basque_dominant_desc: "The Basque language is being enforced as the only national language of [ROOT.GetNameDef]."
 YBS_language_issue_mending_ties: "Euskara-Español National Languages"
 YBS_language_issue_mending_ties_desc: "The Basque and Spanish languages are both put in equal positions within the government and in education."
 YBS_public_esperanto_classes: "Nationwide Esperanto Classes"
 YBS_falangist_remnants: "Falangist Remnants"
 YBS_falangist_remnants_desc: "Following their attempted coup in late 1935, the Falangists have been under surveillance by state forces. Their leader is prone to abandon his efforts in the Basque Country should we finish off his little goon squads."
 YBS_national_pride: "Harrotasun Nazionala"
 YBS_national_pride_desc: "One of the few things even the left and right can agree upon is that the people of the Basque country were unfairly disadvantaged by the Spanish government and even if we should come to cooperate with them, we must never again let ourselves be put into a lower position to Madrid. The Basque Country will be free forevermore!"
 YBS_republican_opposition: "Republican Opposition"

 YBS_mondragon_cooperative: "Mondragón Corporación Cooperativa"


