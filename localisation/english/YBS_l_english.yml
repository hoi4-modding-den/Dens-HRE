# EVENTS

 YBS_election_events.1.t: "The Military Conspiracy"
 YBS_election_events.1.desc: "Rumours have reached us that the Carlist elements within our 'army' are preparing to overthrow our Republic should the Carlists fail to win the elections. While outright hostile to the socialists and even the liberals, some Carlists have shown sympathy towards our Nationalist Party for representing more traditional values and ideas."
 YBS_election_events.1.a: "Purge them all! We must protect our democracy."
 YBS_election_events.1.a.tt: "Any chance for a §gmilitary coup§! will be §Gcrushed§!."
 YBS_election_events.1.b: "Perhaps some negotiations can be made?"
 YBS_election_events.1.b.tt: "The §gMilitary Coup§! won't occur if the §cNationalists§! win the election."
 YBS_election_events.2.t: "The Election Outcome!"
 YBS_election_events.2.desc: "WIP"
 YBS_election_events.2.a: "...the Basque Nationalist Party!"
 YBS_election_events.2.b: "...the Basque Development Party!"
 YBS_election_events.2.c: "...the Basque National Action!"
 YBS_election_events.2.d: "...the Popular Front!"
 YBS_election_events.2.e: "...the Syndicalist Party!"
 YBS_election_events.2.f: "...as no majority is achieved, the Nationalists continue their rule!"
 YBS_election_events.3.t: "Leftist Politicians meet in Donostia"
 YBS_election_events.3.desc: "WIP"
 YBS_election_events.3.a: "We must work together!"
 YBS_election_events.3.b: "Pah! Your understanding of Socialism are laughable!"
 YBS_election_events.4.t: "Socialists announce the 'Fronte Herrikoia'"
 YBS_election_events.4.desc: "WIP"
 YBS_election_events.4.a: "Together for Victory!"
 YBS_election_events.5.t: "The Military seizes control!"
 YBS_election_events.5.desc: "WIP"
 YBS_election_events.5.a: "Now to sort out this chaos..."
 YBS_election_events.6.t: "Carlists end the Republic!"
 YBS_election_events.6.desc: "WIP"
 YBS_election_events.6.a: "Long live the King!"
 YBS_election_events.7.t: "Election Week begins"
 YBS_election_events.7.desc: "WIP"
 YBS_election_events.7.a: "We'll await the results."

 YBS_post_election_events.1.t: "Fate of the Falangists"
 YBS_post_election_events.1.desc: "WIP"
 YBS_post_election_events.1.a: "Hunt them down. They shall not escape Judgement."
 YBS_post_election_events.1.b: "Let them run, who cares about them."


