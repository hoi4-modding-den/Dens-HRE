# INTRO GUI

 YBS_BLITZKRIEG_DESC: "The Basque Country has been consistently neglected by the Iberian government and the Spanish before that. With the collapse of Iberia and the start of the Iberian Civil War, the Basque people have seized their own destiny, rallying for their independence under the Basque Nationalist Party and José Antonio Aguirre."

 YBS_intro_loc: "§LThe Basque Country has been consistently neglected by the Iberian government and the Spanish before that. With the collapse of Iberia and the start of the Iberian Civil War, the Basque people have seized their own destiny, rallying for their independence under the §cBasque Nationalist Party§! and §YJosé Antonio Aguirre§!.\n \nWhile the early new republic was plagued by political infighting and attacks from both the Falangists and the Communists, the §cEAK§! managed to establish their authority and in an alliance with the Carlist-dominated military crushed the rebellious falangists.\n \nNow the §Yyoung republic§! faces another crisis as the §gCarlists§! prepare to overthrow the government to prevent the upcoming elections.§!\n \n§YPossible Paths to unite Iberia:§!\n§g  - The Carlist Restoration\n  - The Corporate Dominion\n  - The Federal Republic\n  - The Federation\n  - The Internationalist Republic\n  - The Contumacy§!\n \n§YAchievements:§!§g\n[YBS_achievements_intro_gui_1]\n[YBS_achievements_intro_gui_2]\n[YBS_achievements_intro_gui_3]\n[YBS_achievements_intro_gui_4]\n"
 YBS_credits: "Basque Country Content: §H0rland0§!\nIntro GUI: §HKåsastul§!\nEverything else: §HHoi4 Modding Den Discord§!"
