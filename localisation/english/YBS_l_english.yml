# DECISIONS

 YBS_election_decision_cat: "The 1936 Basque Country Elections"
 YBS_election_decision_cat_desc: "Following the §Ydeclaration of independence§! and the §Yestablishment of the Republic§!, the §cBasque Nationalist Party§!, together with other §Cdemocratic parties§!, began their rule over the region. Now, the first-ever elections are scheduled to happen this year, with all parties, even those opposed to parliamentarian democracy, campaigning for their cause in the hopes of getting to §Crealise their vision§! for the Basque Country and Iberia.\n \nCurrent Popularities of the Parties:\n§cBasque Nationalist Party§!: §G[?ROOT.YBS_con_pop]§!\n§gBasque Carlist Party§!: §G[?ROOT.YBS_mon_pop]§!\n§lBasque Development Party§!: §G[?ROOT.YBS_lib_pop]§!\n[YBS_show_pf_or_synsoc]\n "

