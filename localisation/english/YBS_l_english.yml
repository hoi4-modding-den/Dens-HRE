 YBS_post_election_events.1.t: "Fate of the Falangists"
 YBS_post_election_events.1.desc: "With the elections over, we can finally focus our attention on the Falangist rabble still roaming our lands. While de Alda and his men are no threat to the republic, they still continue to sabotage our military and make the people feel unsafe. It is time to get rid of them."
 YBS_post_election_events.1.a: "Just get them across the border."

 YBS_post_election_events.2.t: "Ending Republican Resistance"
 YBS_post_election_events.2.desc: "WIP"
 YBS_post_election_events.2.a: "Hold a Parade, this will calm things down."
 YBS_post_election_events.2.b: "Mobilise the garrison, open fire if the opposition acts violent."

 YBS_post_election_events.3.t: "Exiled Basque Falangists arrive in [ROOT.capital.GetCapitalVictoryPointName]"
 YBS_post_election_events.3.desc: "The falangist branch in the Basque Country has been exiled from the country and now our brothers arrive in our capital as heroes that fought for our beliefs in a foreign land."
 YBS_post_election_events.3.a: "Welcome, Brothers!"

 YBS_esperanto_events.1.t: "A Flag for the Republic"
 YBS_esperanto_events.1.desc: "Upon the declaration of the Republic of Hope, many proposals for a national flag were submitted to the government. While during the proclamation the flag of the Esperantists was waved by the revolutionaries, we still need to consider its adaptation.\n \nTwo other main proposals have come forth during that time, the first being a rather ironic one at that. The 'Green Star Tricolour' or 'Verda Stelo Trikoloro' shows a bicolour with one vertical white stripe between two green stripes and the Verda Stelo in the centre of it. While its usage of only two colours would suggest it be named a bicolour, its artist, the Russian exile Alexei Kemersky, insists upon its name as 'Tricolour' in a symbolic sense, as many notable republics in history were represented by them.\n \nThe second proposal, luckily, is less symbolically complex. The 'Banner of Nine Stars' or 'Standardo de Naŭ Stelo' shows nine white stars on a green background with a white stripe on the lower part of the flag. The nine stars represent the people of the world, one star for each region: North and South America, Africa, Oceania, Polynesia, excluded from America or Oceania, Asia, Europe, Eurasia, as a reconciliation between the two systems of depicting the continents and Antarctica. The white stripe stands for unity and reaching out from one side to the other.\n \nNow it is up to parliament to decide to adopt one of the two flags or officially adopt the Esperanto Flag for the new republic."
 YBS_esperanto_events.1.a: "We will continue using the Esperanto Flag."
 YBS_esperanto_events.1.a.tt: "We will adopt this flag as a §Ynational flag§!.\n \n \n£GFX_focus_YBS_esperanto_flag_1_texticon\n \n \n \n§L'The Esperanto Flag'§!"
 YBS_esperanto_events.1.b: "Adopt the 'Verda Stelo Trikoloro'"
 YBS_esperanto_events.1.b.tt: "We will adopt this flag as a §Ynational flag§!.\n \n \n£GFX_focus_YBS_esperanto_flag_2_texticon\n \n \n \n§L'Green Star Tricolour'§!"
 YBS_esperanto_events.1.c: "Adopt the 'Standardo de Naŭ Stelo'"
 YBS_esperanto_events.1.c.tt: "We will adopt this flag as a §Ynational flag§!.\n \n \n£GFX_focus_YBS_esperanto_flag_3_texticon\n \n \n \n§L'Banner of Nine Stars'§!"

 YBS_esperanto_events.3.t: "Application for the 29th World Esperanto Congress"
 YBS_esperanto_events.3.desc: "WIP"
 YBS_esperanto_events.3.a: "Ni devas esti la gastigantoj!"
 YBS_esperanto_events.3.a.tt: "The §G29th World Esperanto Congress§! will be held in §YBilbao§!, unless §Rwar§! disturbs it."
 YBS_esperanto_events.3.b: "While nice, it is not our priority."
 YBS_esperanto_events.3.b.tt: "The §G29th World Esperanto Congress§! will be held in §gWarsaw§!, depriving us of its §Ypossibilities§!."


 YBS_news_events.1.t: "Carlists overthrow the Basque Country Republic"
 YBS_news_events.1.desc: "WIP"
 YBS_news_events.1.a: "A sad day for democracy."
 YBS_news_events.1.b: "Another one falls to reaction."
 YBS_news_events.1.c: "They remain an enemy..."
 YBS_news_events.1.d: "A potential ally?"
 YBS_news_events.1.e: "Okay."
 YBS_news_events.1.f: "We will restore the Kingdom!"

 YBS_news_events.2.t: "Nationalists win Basque Elections"
 YBS_news_events.2.desc: "WIP"
 YBS_news_events.2.a: "Who would have guessed..."
