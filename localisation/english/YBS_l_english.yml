# CHARACTERS

 YBS_jose_antonio_aguirre_name: "José Antonio Aguirre"
 YBS_jose_antonio_aguirre_desc: "§YFull Name:§! §LJosé Antonio Aguirre y Lecube§!\n§YBorn:§! §LMarch 6. 1904, in Bilbao§!\n§YBackground:§! §LLeader of the Basque Nationalist Party and the person to declare Basque Independence in the turmoil of the Iberian Civil War. He is the first President of the Republic of the Basque Country.§! $XHH_is_historical_character_tt$"
 YBS_tomas_bilbao_hospitalet_name: "Tomás Bilbao"
 YBS_tomas_bilbao_hospitalet_desc: "§YFull Name:§! §LTomás Bilbao Hospitalet§!\n§YBorn:§! §LSeptember 18. 1890, in Bilbao§!\n§YBackground:§! §LA Basque architect and socialist politician. He is one of the founders of the Basque National Action and previously served as minister of justice.§! $XHH_is_historical_character_tt$"
 YBS_rosa_lavina_name: "Rosa Laviña"
 YBS_rosa_lavina_desc: "§YFull Name:§! §LRosa Laviña i Carreras§!\n§YBorn:§! §LJanuary 14. 1918, in Palafrugell§!\n§YBackground:§! §LLeading member of the Libertarian Youth in Catalonia and supporter of the Esperanto Movement, Laviña i Carreras has moved to the Basque country to support the revolutionary struggle in their Iberian neighbour state.§! $XHH_is_historical_character_tt$"
 YBS_carlist_junta_name: "Basque Military Junta"
 YBS_julio_ruiz_de_alda_name: "Julio Ruiz de Alda"
 YBS_julio_ruiz_de_alda_desc: "§YFull Name:§! §LJulio Ruiz de Alda Miqueleiz§!\n§YBorn:§! §LOctober 7. 1897, in Lizarra§!\n§YBackground:§! §LTogether with Primo de Rivera, he founded the Falangist movement. He was an aviator in the Iberian National Army and completed a transatlantic flight in 1926 in the 'Plus Ultra'. With the collapse of Iberia, he returned to his homelands to fight for Falangism and Iberian reunification.§! $XHH_is_historical_character_tt$"


