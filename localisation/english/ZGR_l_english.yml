  ZGR_on_the_warpath:0 "Prepare for War!"
  ZGR_on_the_warpath_desc:0 "We must prepare for war!"
  ZGR_on_the_warpath_factories:0 "Increase War Production"
  ZGR_on_the_warpath_factories_desc:0 "We must Increase War Production"
  ZGR_on_the_warpath_militias:0 "New Training Regiment"
  ZGR_on_the_warpath_militias_desc:0 "We will implement a New Training Regiment"

  ZGR_political_turmoil_c:0 "A political Scandal!"
  ZGR_political_turmoil_c_desc:0 "A massive vote buying scandal has been uncovered for the liberal parties."

  ZGR_on_the_economy:0 "Agriculture"
  ZGR_on_the_economy_desc:0 "Workers and farmers should be provided with mechanised equipment, and form councils."

  ZGR_Farmers_Councils:0 "Farmers Councils"
  ZGR_Farmers_Councils_desc:0 "Farmer Councils have been established to provide mechanised equipment and independence to our rural territories"

  ZGR_on_the_economy_factories:0 "Invest In Factories"
  ZGR_on_the_economy_factories_desc:0 "We must Invest In Factories"

  ZGR_on_the_economy_production:0 "Oil!"
  ZGR_on_the_economy_production_desc:0 "Good News! We found oil. We must invite foreign investors to help us extract it."

  ZGR_Sided_with_the_people:0 "The People's Revolution"
  ZGR_Sided_with_the_people_desc:0 "The Goverment has collapsed during the scandal. We must strike to gain the workers revolution."

  ZGR_Win_The_civil:0 "Foreign Volunteers"
  ZGR_Win_The_civil_desc:0 "We will launch a campaign to get foreign Volunteers"

  ZGR_Win_The_civil_equipment:0 "Small Arms"
  ZGR_Win_The_civil_equipment_desc:0 "We will confiscate, buy, find, and get donated small arms for use in our army."

  ZGR_Declare_the_Anarchist_state:0 "Declare the Anarchist state"
  ZGR_Declare_the_Anarchist_state_desc:0 "After the warfare has died down, we must decide what to do now. Avraam Benaroya wants to declare an Anarchist state, where all people are free and equal, but to do that, we have a long road ahead..."

  ZGR_the_anarchist_cities:0 "The Anarchist cities"
  ZGR_the_anarchist_cities_desc:0 "We will divide the largest cities in free districts to Further decentralize administration"

  ZGR_more_rural_mechanisation:0 "More Rural Mechanisation"
  ZGR_more_rural_mechanisation_desc:0 "We will voluntarily pool all resources together, and distribute them to mechanize the countryside"

  ZGR_the_anarchist_congress:0 "The Anarchist Congress"
  ZGR_the_anarchist_congress_desc:0 "To realize our anarchist ideals, we will declare a new constitution, no longer based on the Megali idea, but one that establishes a regional parliament, where the regional leaders of all provinces come together in a Grand Congress."

  ZGR_free_the_old_goverment:0 "Free the old Goverment"
  ZGR_free_the_old_goverment_desc:0 "We must absorb the old Government powers into the power of the decentralized administrations"

  ZGR_the_turkish_issue:0 "The Turkish Issue"
  ZGR_the_turkish_issue_desc:0 "We must never see one brother as different to another Those were the words of Avraam Benaroya at the Congress today. We must do everything to eliminate past prejudices. We will grant larger autonomy to the Turk majority province parliaments, and make sure everyone knows his rights."

  ZGR_fortify_the_cities:0 "Fortify The cities"
  ZGR_fortify_the_cities_desc:0 "We must fortify the main cities, and raise troops that unite all the free city regions"

  ZGR_free_speech:0 "Free Speech"
  ZGR_free_speech_desc:0 "We must guarantee absolute free speech everywhere!"

  ZGR_burn_down_the_central_bank:0 "Burn down the Central Bank"
  ZGR_burn_down_the_central_bank_desc:0 "We must take this, the most radical step, to reach our anarchist ideals faster"

  ZGR_take_things_slow:0 "Take things slow"
  ZGR_take_things_slow_desc:0 "Anarchist economy is our goal, but we must not take too radical of steps if we want to keep some control, to make sure anarchy is implemented perfectly..."

  ZGR_controll_the_fallout:0 "Controll The Fallout"
  ZGR_controll_the_fallout_desc:0 "The Provincial Parliaments are "crashing out" because we took out very normal radical step. we must calm the situation"

  ZGR_redistribute_the_money:0 "Redistribute The Money"
  ZGR_redistribute_the_money_desc:0 "We will pool together a lot of the money, and redistribute it to poorer provinces, making sure that when Anarchism is implemented, everyone has a fair shot"

  ZGR_forfreedom:0 "For Freedom!"
  ZGR_forfreedom_desc:0 "Most Rural Provinces and the city of Antalya have seceded, and declared their own anarchist Congress"

  ZGR_the_anarchist_air_force:0 "The Anarchist Air Force"
  ZGR_the_anarchist_air_force_desc:0 "We have received many donation from afar, and even two personal planes. We should start refitting the old air force, and incorporating new weapons. The air force will be communally owned by The Congress."

  ZGR_the_disbanding_of_the_army:0 "The Disbanding Of the army"
  ZGR_the_disbanding_of_the_army_desc:0 "The army is a tool of the state, thus should be disbanded in favor of local militias"

  ZGR_the_rural_corp:0 "The Rural Corp"
  ZGR_the_rural_corp_desc:0 "The more rural provinces will band together to make a full division"

  ZGR_the_free_generals:0 "The Free Generals"
  ZGR_the_free_generals_desc:0 "Generals should be voted on, but still have enough power to control local troops"

  ZGR_rural_terrain_specialists:0 "Rural Terrain Specialists"
  ZGR_rural_terrain_specialists_desc:0 "Our democratic reforms have brought to the spotlight many promising new generals. We must use this."

  ZGR_mechanize_the_supply:0 "Mechanize The Supply"
  ZGR_mechanize_the_supply_desc:0 "We must mechanize the supply lines, to facilitate communication between the rural and urban provinces once full anarchism is achieved"

  ZGR_communal_universities:0 "Communal Universities"
  ZGR_communal_universities_desc:0 "We will make the Universities free and democratic"

  ZGR_the_urban_specialists:0 "The Urban Specialists"
  ZGR_the_urban_specialists_desc:0 "We will recruit promising and up and coming Generals, from more rural places"

  ZGR_free_farms:0 "Free Farms"
  ZGR_free_farms_desc:0 "Farms have always been free and autonomous, and we could channel that spirit to the rural individual as well"

  ZGR_night_patrols:0 "Night Patrols"
  ZGR_night_patrols_desc:0 "To keep the cities safe, anarchist neighborhood night watches will be established"

  ZGR_the_great_revival:0 "The Great Revival"
  ZGR_the_great_revival_desc:0 "With the old system and rules done away with, new, innovative systems in city building and architecture lets us expand out cities"

  ZGR_the_rural_freedom:0 "The Rural Freedom"
  ZGR_the_rural_freedom_desc:0 "As the rural places were quite anacrhist in spirtit already, we have achieved near anarchism there."

  ZGR_propagate_the_cause:0 "Propagate the cause"
  ZGR_propagate_the_cause_desc:0 "Since there is absolute free speech, the more conservative people in the local parliaments and on the streets, have begun organizing with the goal of returning to central power. We will stop this by applying propaganda, to calm the populace"

  ZGR_full_equality:0 "Full Equality"
  ZGR_full_equality_desc:0 "Equality has always been more usual for cities, but we should make it even better, to prepare for anarchism."

  ZGR_anarchy_cities:0 "Anarchy Cities"
  ZGR_anarchy_cities_desc:0 "We have prepared the cities for the disintegration of the congress!"

  zgr-c-anarchy:0 "The Avraam Benaroya Way"

  ZGR_anarchy_warpath:0 "Anatolian Anarchy"
  ZGR_anarchy_warpath_desc:0 "We are surrounded by states that want to destroy us. We are surrounded by states where people are oppressed! We must spread anarchy as far and wide as possible!"

  ZGR_anarchy_warpath_support:0 "Gain Support"
  ZGR_anarchy_warpath_support_desc:0 "Support for a war is very low, but we can appeal to the populace, to see our war as liberation"

  ZGR_anarchy_warpath_spy:0 "Spying"
  ZGR_anarchy_warpath_spy_desc:0 "We have found a few capable individuals to lead a spy mission against our enemies!"

  ZGR_anarchy_warpath_liberation_CYP:0 "Liberate Cyprus"
  ZGR_anarchy_warpath_liberation_CYP_desc:0 "We must Liberate the people of Cyprus from the oppressive colonial Goverment, and establish an anacrhist way of life, so that all of Cyprus is free!"

  ZGR_anarchy_warpath_liberation_Bomb_CYP:0 "Bomb Cyprus"
  ZGR_anarchy_warpath_liberation_Bomb_CYP_desc:0 "The liberation Campaign is not going as hoped, so we will bomb vital military infrastructure."

  ZGR_anarchy_pan_anarchist_state:0 "No Gods, No Masters"
  ZGR_anarchy_pan_anarchist_state_desc:0 "We will Liberate all of Anatolia, and further!"

  ZGR_anarchy_pan_anarchist_state_get_cores:0 "Liberation!"
  ZGR_anarchy_pan_anarchist_state_get_cores_desc:0 "Now that we have spread Propoganda across Anatolia, Anarchist sentiment is at an all time high. We will collaborate with local anarchists, and take over the opressive Goverments!"

  ZGR_anarchy_pan_anarchist_state_get_cores_more:0 "Total Liberation!"
  ZGR_anarchy_pan_anarchist_state_get_cores_more_desc:0 "We will liberate all countries from opression, wherever they are!"

  
