  artillery_expert_desc: "A general who has devoted their life so far to Artilery."
  # Characters
  ZGR_Parliament: "The Parliament of Greeks"
  ZGR_Parliament_leader_desc: "The Parliament of Greeks is the parliment of the new Greek territories. The Parliament is based on the Megali constitution, that proclaims the validity of Greek claims in Anatolia"

  ZGR_Parliament_soc: "The Socialist Parliament"
  ZGR_Parliament_leader_soc_desc: "After the strong showing of socialist parties in the recent election, a socialist leaning parliment has been formed"

  ZGR_Georgios_Bakos: "Georgios Bakos"
  ZGR_Georgios_Bakos_leader_desc: "An Ortodox Christian Greek general who is has a much more radical interpretation of The Megali Idea. Compromises with no-one, and is ready to do anything to expand the Greek claims..."

  ZGR_Avraam_Benaroya: "Avraam Benaroya"
  ZGR_Avraam_Benaroya_leader_desc: "A Blugarian/Jewish anarchist who moved to New Greece to spread anarchist ideas. He dreams of an anarchist territory, where all individuals and communes live together in harmony, weather Greek, Trukish or any other race/religion/ethnicity"

  ZGR_Alexandros_Kallergis: "Alexandros Kallergis"
  ZGR_Alexandros_Kallergis_leader_desc: "An Old-school Venizelist, who advocates for a parlimetary monarchy. Plans being a field marshall soon."

  ZGR_Fallen_Goverment: "Fallen Goverment"

  ZGR_Dimitrios_Anagnostou: "Dimitrios Anagnostou"
  ZGR_Dimitrios_Anagnostou_leader_desc: "Born to a modest family and educated in Athens, Dimitrios Anagnostou represents a new generation of Greek military leadership. Still officially a student when the Megali Idea reignited, he distinguished himself early through exceptional performance at the military academy, where he specialized in modern operational theory, logistics, and combined-arms tactics."

  ZGR_Nikolaos_Drakopoulos: "Nikolaos Drakopoulos"
  ZGR_Nikolaos_Drakopoulos_leader_desc: "An Artilery Offices, who is very advanced in many aspects, but lacks in others."

  ZGR_Hasan_Riza_Demirtas: "Hasan Rıza Demirtaş"
  ZGR_Hasan_Riza_Demirtas_leader_desc: "He is Turkish, and super skilled, but the mean Greeks hate on him :( "

  #Ideas
  ZGR_The_Megali_Idea: "The Mengali Idea"
  ZGR_The_Megali_Idea_desc: "The Megali Idea is the Greek vision to unite all ethnic Greeks into one Greek state. Some are happy with the lands gained after 1933, and want to keep the lands stable, while some dream of resurrecting Byzantine glory, by conquering all of Anatolia"

  ZGR_we_bob_cyprus: "Bombing Raids"
  ZGR_we_bob_cyprus_desc: "We have been hit by devastating raids on military and energy infrastructure."

  ZGR_The_Turk_Problem: "The Turk Problem"
  ZGR_The_Turk_Problem_desc: "The democratic parliament works constantly to maintain stability in Anatolia, pursuing policies meant to integrate the Turkish population rather than reduce it to second-class status. While discrimination and resentment persist beneath the surface, any major political shift risks reigniting ethnic tensions on a massive scale."

  ZGR_Local_Governance: "Local Governance"
  ZGR_Comm_Univers: "Communal Universities"

  ZGR_Major_Well: "Major Wellfare Spending"
  ZGR_Major_Well_desc: "We stick to our election promises, and spend lavishly on wellfare"

  ZGR_Minor_Well: "Minor Wellfare Spending"
  ZGR_Minor_Well_desc: "We had to break our promises, for the sake of a better economy"

  ZGR_Radicalisation: "Radicalisation"
  ZGR_Radicalisation_desc: "§RRadicalisation§R is spreading among the populace..."

  ZGR_devalued_the_money: "Devaluation"
  ZGR_devalued_the_money_desc: "We are fixing our economy"

  ZGR_Anarchist_Propoganda: "Anarchist Propoganda"
  ZGR_Anarchist_Propoganda_desc: "The newly established Anarchist state is spreading propaganda"

  ZGR_post_election_restabilize: "Post Election Restabilising"
  ZGR_post_election_restabilize_desc: "We are restabilasing the after the election"

  ZGR_guns_c: "Small Arms"
  ZGR_guns_c_desc: "We are confiscating, buying, and get reciving small arms for use in our army."

  ZGR_volunteers_c: "Foreign Volunteers"
  ZGR_volunteers_c_desc: "After an international campaign to propogate our cause, we have recived foreign Volunteers"

