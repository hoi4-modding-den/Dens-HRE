  ZGR_theoretical_Anarchism:0 "Theoretical Anarchism"
  ZGR_theoretical_Anarchism_desc:0 "Theoretical Anarchism follows the ideas of Avraam Benaroya for a fully anarchist and decentralizied state, but hasn't implemented most of them."

