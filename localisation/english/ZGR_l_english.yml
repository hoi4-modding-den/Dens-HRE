  # Characters
  ZGR_Parliament: "The Parliament of Greeks"
  ZGR_Parliament_leader_desc: "The Parliament of Greeks is the parliment of the new Greek territories. The Parliament is based on the Megali constitution, that proclaims the validity of Greek claims in Anatolia"

  ZGR_Parliament_soc: "The Socialist Parliament"
  ZGR_Parliament_leader_soc_desc: "After the strong showing of socialist parties in the recent election, a socialist leaning parliment has been formed"

  ZGR_Georgios_Bakos: "Georgios Bakos"
  ZGR_Georgios_Bakos_leader_desc: "An Ortodox Christian Greek general who is has a much more radical interpretation of The Megali Idea. Compromises with no-one, and is ready to do anything to expand the Greek claims..."

  ZGR_Avraam_Benaroya: "Avraam Benaroya"
  ZGR_Avraam_Benaroya_leader_desc: "A Blugarian/Jewish anarchist who moved to New Greece to spread anarchist ideas. He dreams of an anarchist territory, where all individuals and communes live together in harmony, weather Greek, Trukish or any other race/religion/ethnicity"

  #Ideas
  ZGR_The_Megali_Idea: "The Mengali Idea"
  ZGR_The_Megali_Idea_desc: "The Megali Idea is the Greek vision to unite all ethnic Greeks into one Greek state. Some are happy with the lands gained after 1933, and want to keep the lands stable, while some dream of resurrecting Byzantine glory, by conquering all of Anatolia"

  ZGR_The_Turk_Problem: "The Turk Problem"
  ZGR_The_Turk_Problem_desc: "The democratic parliament works constantly to maintain stability in Anatolia, pursuing policies meant to integrate the Turkish population rather than reduce it to second-class status. While discrimination and resentment persist beneath the surface, any major political shift risks reigniting ethnic tensions on a massive scale."

  ZGR_Radicalisation: "Radicalisation"
  ZGR_Radicalisation_desc: "§RRadicalisation§R is spreading among the populace..."

  ZGR_devalued_the_money: "Devaluation"
  ZGR_devalued_the_money_desc: "We are fixing our economy"


  ZGR_Democ_angry:0 "Democratic Nation"
  ZGR_Democ_angry_desc:0 "We might not pay much attention to Turkish Rights, but we still provide democratic freedoms to our Greek populace"
  ZGR_Democ:0 "Free and Democratic Nation"
  ZGR_Democ_desc:0 "We are working twoards a free nation where everyone, no matter their race or religion has a place..."

