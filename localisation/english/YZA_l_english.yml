YZA_dismantle_formal_policing_desc: "The Workers may regulate themselves, no need for this police jargon."
YZA_beheadthevibria: "Behead the Víbria"
YZA_beheadthevibria_desc: "The Catalans will be cut down from there high pedestal"
YZA_integrate_barcelona: "Integrate Barcelona"
YZA_integrate_barcelona_desc: "Barcelona, as the heart of Eastern Spain would do well to be integrated into our nation"
YZA_integrate_the_minor_republics: "Integrate the Minor Republics"
YZA_integrate_the_minor_republics_desc: "The Minor Republics West of Barcelona Should be integrated into our nation"
