YZA_general_paneuropeanism_desc: "Europe should be united together, as one peoples!"
YZA_national_syndicalism: "National Syndicalism"
YZA_national_syndicalism_desc: "Nationalism isn't bad, far from it, it is the force holding us together, it is REQUIRED for greatness"
YZA_invitefascistlabourites: "Invite "Fascist" Labourites"
YZA_invitefascistlabourites_desc: "Figures like Britains Moseley aren't evil right wing fascists, they just care for preserving their country, and for the people in it! We should invite them to us."
YZA_war_focus_2: "War Focus 2"
YZA_war_focus_2_desc: "Self Evident"
YZA_a_coalition_of_anarchists: "A Coalition of Anarchists"
YZA_a_coalition_of_anarchists_desc: "Anarcha-Feminists, Anarcho-capitalists, Anarcho-mutualists, Anarcho-Collectivists, Anarcho-Communists, Anarcho-Syndicalists, Anarcho-Pacifism, as well as even more- we are all anarchists and must work together!"
YZA_togetherforvictory: "Together for Victory!"
YZA_togetherforvictory_desc: "Friendship is magic"
YZA_tank_program: "Tank Program"
YZA_tank_program_desc: "The new age of war requires tanks, and so we shall do what we must"
YZA_modernise_our_military: "Modernise Our Military"
YZA_modernise_our_military_desc: "The Military must be modernised if we are to do well in war."
YZA_guerrilla_warfare: "Guerrilla Warfare"
YZA_guerrilla_warfare_desc: "Guerrilla tactics will be best to defeat the enemy"
YZA_militia_exercises: "Militia Exercises"
YZA_militia_exercises_desc: "We must Exercise out militias to do well in battle"
YZA_montaneras: "Montañeras"
YZA_montaneras_desc: "The Terrain of Spain is harsh, and as such mountaineers would be a massive help."
YZA_destroy_the_state: "Destroy The State"
YZA_destroy_the_state_desc: "The state, like all hierarchies is unnecessary and must be gotten rid of. It is the worst of all hierarchies so will be gotten rid of first."
YZA_incentivise_communal_property: "Incentivise Communal Property"
YZA_incentivise_communal_property_desc: "Private property is evil and must be abolished, this can be done through people doing it themselves."
YZA_abolish_money: "Abolish Money"
YZA_abolish_money_desc: "Money is a hierarchy must be abolished! fuck money."
YZA_get_rid_of_bigotry: "Get rid of Bigotry"
YZA_get_rid_of_bigotry_desc: "Bigotry is a tool of the state that must  be destroyed, but through knowledge not pain. Pain + pain does not equal a lack of pain."
YZA_free_democratic_education: "Free Democratic Education"
YZA_free_democratic_education_desc: "The Current School System is hierarchical and so must be replaced with something equal."
YZA_radio_integrated_army: "Radio Integrated Army"
YZA_radio_integrated_army_desc: "Radio in our army will be a MASSIVE help."
YZA_help_communise_the_nation: "Help Communise the Nation"
YZA_help_communise_the_nation_desc: "Idk if communise is a word but i dont give a fuck"
YZA_the_reactionaries_die_first: "The Reactionaries Die First"
YZA_the_reactionaries_die_first_desc: "The "Lost Regiment" Will be the first of our neighbours to die..."
YZA_allow_the_french_to_stay: "Allow the French to stay"
YZA_allow_the_french_to_stay_desc: "the people deserve to stay, just because they weren't 'originally from here' doesnt mean they cant"
YZA_anarchist_progression: "Anarchist Progression"
YZA_anarchist_progression_desc: "Anarchism is the most progressive ideology of all, and so we should use it to make things better."
YZA_ask_the_basque: "Ask the Basque"
YZA_ask_the_basque_desc: "The Basque wished for independence from reactionarys and imperialists- we should ask them if they wish to join, if they don't then that is fine."
YZA_ask_the_catalans: "Ask the Catalans"
YZA_ask_the_catalans_desc: "Catalans deserve independence as well."
YZA_establish_local_communes: "Establish Local Communes"
YZA_establish_local_communes_desc: "Local Communes are important in any anarchist society"
YZA_zaragoza_munitions_works: "Zaragoza Munitions Works"
YZA_zaragoza_munitions_works_desc: "Munitions be rather important I dare say"
YZA_take_old_spanish_arms: "Take Old Spanish Arms"
YZA_take_old_spanish_arms_desc: "The Spanish Republic of Old had a lot of Arms, we will take some of the remaining arms to help us."
YZA_iberia_rises: "Iberia Rises"
YZA_iberia_rises_desc: "Spain? too reactionary. Iberia Rises"
YZA_the_new_revolution: "The New Revolution"
YZA_the_new_revolution_desc: "Anarchism is the new revolution sweeping the land, for a better tomorrow!"
YZA_platformism: "Platformism"
YZA_platformism_desc: "The Ideology of Platformism stipulates a bit of organisation to help create anarchism- people such as Nestor Makhno used it!"
YZA_start_the_airforce: "Start The Airforce"
YZA_start_the_airforce_desc: "The Airforce will be important in the wars to come"
YZA_start_the_navy: "Start The Navy"
YZA_start_the_navy_desc: "Although it isn't as important, it could be good to have a navy."
YZA_synthesis_anarchism: "Synthesis Anarchism"
YZA_synthesis_anarchism_desc: "Synthesis anarchism says anarchists should be united in diversity, meaning communists, individualists, mutualists and all types of anarchists should work together"
YZA_an_organisational_model: "An Organisational Model"
YZA_an_organisational_model_desc: "Working together to make anarchism possible"
YZA_legacy_of_makhno: "Legacy of Makhno"
YZA_legacy_of_makhno_desc: "Yet another legacy focus smh"
YZA_an_important_military: "An Important Military"
YZA_an_important_military_desc: "The Military is important to keep an anarchist country intact"
YZA_invite_individualists: "Invite Many Types of Anarchists"
YZA_invite_individualists_desc: "Just because they are different does not make them any less of anarchists. we shall invite them"
YZA_war_focus_3: "War Focus 3"
YZA_war_focus_3_desc: "Not again"
YZA_peopleswar: "People's War"
YZA_peopleswar_desc: "This war, will not be one for just the leaders, for the elites, but for all. A People's War"
YZA_milicias_para_todos: "Milicias Para Todos"
YZA_milicias_para_todos_desc: "We should have enough Militias to defend everyone in the country!"


############### EVENTS #################

yza_events.1.t: "The 1936 Congress Begins..."
yza_events.1.d: "The Congress has begun, with the three main factions, the COM, the FST and the CTA all vying for the most influence in the nation, only time will tell who will make it out on top"
yza_events.1.a: "So it begins"
yza_events.2.t: "Autonomy of Workers"
yza_events.2.d: "Day 1- Worker Autonomy:\nThe Marxists see that limited workers autonomy may be required but wish for a centralised body which workers choose through representatives to speak their interests.\nThe Syndicalists see that it is important and wish to allow worker autonomy within organisations, through democratic worker elections and worker control of the means of production.\nThe Anarchists wish for full worker autonomy to do whatever they wish, and to produce how ever much they wish and what they wish."
yza_events.2.a: "Limited Autonomy"
yza_events.2.b: "Autonomy within Unions"
yza_events.2.c: "Full Autonomy"
yza_events.3.t: "Security Policy"
yza_events.3.d: "Day 2- Security Policy:\nThe Marxists wish to quell dissent through some force, though still relatively restrained compared to that of the USSR.\nThe Syndicalists and Anarchists however, both have the same policy of allowing the people to do what they wish and for self-regulation to be key. "
yza_events.3.a: "Security Should Be Important"
yza_events.3.b: "Self-regulation is the only way forward"
yza_events.4.t: "Foreign Policy"
yza_events.4.d: "Day 3- Foreign Policy:\nThe Marxists wish to establish a 'Socialist Internationale' in response to Stalin's Comintern, for which we can add other likeminded nations, and to invade the rest.\nThe Syndicalists wish to Invade the other nations to reunite Spain, but to send ultimatums to like-minded countries to join us or die.\nThe Anarchists wish to reunite Spain like the rest, but unless the opposing side is anarchist, to invade them."
yza_events.4.a: "To the Internationale!"
yza_events.4.b: "Ultimatums sounds Good"
yza_events.4.c: "No Gods, No Masters"
yza_events.5.t: "The Congress Draws to a Close..."
yza_events.5.d: "As the congress draws to a close, the acting speaker can endorse one of the factions, which side will they endorse?"
yza_events.5.a: "The Marxists"
yza_events.5.b: "The Syndicalists"
yza_events.5.c: "The Anarchists"
yza_events.6.t: "Who's In Charge?"
yza_events.6.d: "Only one Union has secured enough of a majority to go into power."
yza_events.6.a: "And the Winner is..."
yza_events.7.t: "Purges..."
yza_events.7.d: "'Although the idea of purges seems very similar to that in the Soviet Union under Stalins dictatorship, we here at the COM can assure you that it is not- whilst in the USSR Stalin would kill and harm people we will simply remove those who are unfit from government- for the benefit of the workers' ran the official COM statement to accusations from the CTA and FST that they had started purging their elements from the Government- only time will tell if this escalates "
yza_events.7.a: "Literally 1963"
yza_events.8.t: "A New Culture"
yza_events.8.d: "The Establishment of a NEW culture is in order, of freedom, and of socialism! One in which all are free and will wish to help us in our goal of a better tomorrow! Join us!"
yza_events.8.a: "Where do I sign up?"
yza_events.9.t: "What to do?"
yza_events.9.d: "The Basque population has possed major resistance to our nation from the start, with such stipulated goals as 'Independence' and 'Autonomy', what should we do about this? \nWe could capitulate to them and offer them autonomy within our nation, or we could crack down HARD on them, preventing any resistance in the future."
yza_events.9.a: "Autonomy"
yza_events.9.b: "Crack Down!"
yza_events.10.t: "The Socialist Internationale"
yza_events.10.d: "'Workers of the world! If you detest Stalin's Authoritarian regime and wish for a more democratic, a more liberal, a better world of Socialism, then JOIN US in the Socialist Internationale, to break the chains, and establish a better tomorrow!'"
yza_events.11.t: "The Lost Regiment"
yza_events.11.d: "What the fuck even is the lost regiment like idk i just have to wait until content is added i guess."
yza_events.12.t: "Alliance, Or War?"
yza_events.12.d: "The Catalans to our East share some similarities in terms of ideology- perhaps we should offer them an alliance? If they say no we can invade them anyway."
yza_events.12.a: "Alliance!"
yza_events.12.b: "War"
yza_events.13.t: "An Offer"
yza_events.13.d: "The Zaragozans to our West have offered us an alliance, if we reject they have said they will declare war."
yza_events.13.a: "Sure"
yza_events.13.b: "No"
yza_events.14.t: "Spain"
yza_events.14.d: "We have officially rebranded to the People's Republic of Spain- this will grant us much legitimacy in the coming struggle."
yza_events.14.a: "A Battle is Afoot"
