YZA_integrate_valencia_desc: "Valencia is an important city and strategic hub- we should seek to integrate it."
YZA_assimilate_new_territory: "Assimilate new Territory"
YZA_assimilate_new_territory_desc: "We will Assimilate our new territory into the nation."
YZA_syndicalise_our_new_friends: "Syndicalise our new friends"
YZA_syndicalise_our_new_friends_desc: "Syndicalism is not just for one, but for all!"
