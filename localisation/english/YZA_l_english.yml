YZA_pancatholicism_desc: "All Catholic nations should join together in Union!"
YZA_moralise_syndicalism: "Moralise Syndicalism"
YZA_moralise_syndicalism_desc: "Morality will be placed upon our syndicalist revolution"
YZA_export_the_revolution: "Export the Revolution"
YZA_export_the_revolution_desc: "Revolutionary propaganda will be given to all those nations which oppose us."
