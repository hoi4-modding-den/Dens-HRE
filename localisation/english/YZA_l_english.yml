YZA_BLITZKRIEG_DESC: "Following the dissolution of the Spanish state, the East of Spain became A leftist hotspot, from those in Catalonia and those in Zaragoza. In Zaragoza new ideas started forming, old ideas of Syndicalism, as well as Marxism, with trade union control over the nation secured factions have formed. 3 Seperate Factions, 3 Different Futures, only time to tell what will happen..."