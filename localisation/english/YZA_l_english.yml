YZA_a_new_education_desc: "Some Say our education should instill Catholic values, some say it should be secular- whereas others state the religion should be PURGED from education entirely. This discussion must be resolved"
YZA_find_allies: "Find Allies"
YZA_find_allies_desc: "Yeah this shit is gonna be complicated as fuck smh"
