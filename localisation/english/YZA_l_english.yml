############# FOCUS ####################

YZA_congress_of_1936: "Congress of 1936"
YZA_congress_of_1936_desc: "The World Grows More Polarised, and war draws close. The other warlord states are ready to fight as we are- we must be ready for what is to come by officially deciding our course of action."
YZA_marxist_supremacy: "Marxist Supremacy"
YZA_marxist_supremacy_desc: "The Marxists have come out on top in the Congress- putting our nation firmly on the path of the marxist revolution!"
YZA_anarchist_victory: "Anarchist Victory"
YZA_anarchist_victory_desc: "The Anarchists have come out on top in the power struggle, we will now walk the path to destruction of the state and a new age of freedom."
YZA_syndicalist_majority: "Syndicalist Majority"
YZA_syndicalist_majority_desc: "The Syndicalists have a majority in the nation- time for a new revolution, a new type of socialism and a better world for all!"
YZA_guard_against_authoritarianism: "Guard against Authoritarianism"
YZA_guard_against_authoritarianism_desc: "Orwell, with his rigid hatred of the Soviet Union and the authoritarianism it commands is the perfect person to lead our nation, and so it shall be him in the reigns."
YZA_trotskyist_bloc: "Trotskyist Bloc"
YZA_trotskyist_bloc_desc: "Wheras in the 'USSR', Stalin has destroyed Lenin's legacy through his authoritarian forces, we shall respect Comrade Lenin and Comrade Trotsky to forge a New USSR..."
YZA_prevent_1984: "Prevent 1984"
YZA_prevent_1984_desc: "We will prevent horrors like that in the Soviet Union, from occuring."
YZA_invite_exiled_bolsheviks: "Invite Exiled Bolsheviks"
YZA_invite_exiled_bolsheviks_desc: "The Leftist Bolsheviks, such as Comrade Trotsky himself, will be given a safe haven against Stalinist elements."
YZA_centralise_the_trade_unions: "Centralise the Trade Unions"
YZA_centralise_the_trade_unions_desc: "We Shall centralise the unions, through a council, so that they may be coordinated better."
YZA_new_marxist_culture: "New Marxist Culture"
YZA_new_marxist_culture_desc: "Community, Family and politics will be put at the forefront of this new culture, so that the people may be guided towards a better education"
YZA_minor_purges: "Minor Purges"
YZA_minor_purges_desc: "We will expel those who wish to harm our nation from our government, they may stay in the country and live their lives however- we are not evil, unlike Stalin."
YZA_target_the_basque: "Target the Basque"
YZA_target_the_basque_desc: "The Basque, as one of our weaker neighbours, would do well to be part of our Federation."
YZA_put_down_resistance: "Put Down Resistance"
YZA_put_down_resistance_desc: "The Reactionary Basque Resistance MUST be dealt with, the only answer is how?"
YZA_integrate_the_basque_into_our_federation: "Integrate The Basque into our Federation"
YZA_integrate_the_basque_into_our_federation_desc: "The Basque Should be Integrated into our Federation."
YZA_nationalise_basque_industry: "Nationalise Basque Industry"
YZA_nationalise_basque_industry_desc: "The Basque had industry for which it would be good for us to have."
YZA_a_new_internationale: "A New Internationale"
YZA_a_new_internationale_desc: "The Internationale is too Soviet lead, instead we will make a NEW Internationale for those who do not wish to associate with the USSR."
YZA_hunt_down_the_french: "Hunt Down the French"
YZA_hunt_down_the_french_desc: "The so called 'Lost Regiment' below us must be dealt with Swiftly, before they gain too much support."
YZA_another_maybe_depending_on_jam_contestants_maybe_nobody: "Another Maybe Depending on Jam Contestants Maybe Nobody"
YZA_another_maybe_depending_on_jam_contestants_maybe_nobody_desc: "Yeah"
YZA_the_catalan_problem: "The Catalan Problem"
YZA_the_catalan_problem_desc: "The Catalans to our east are ideologically very similar to us, so we must wonder- should we fight them, or would it be better if we join them, or they join us?"
YZA_become_a_real_contender: "Become a Real Contender"
YZA_become_a_real_contender_desc: "With our Unification of The North of the country, it would seem logical to change our name to something more appropriate for our new standing..."
YZA_a_2nd_term: "A 2nd Term"
YZA_a_2nd_term_desc: "The Marxists have secured a second term in governance! We shall continue to enact our mandate."
YZA_the_very_thing_you_swore_to_destroy: "The Very Thing You Swore to Destroy"
YZA_the_very_thing_you_swore_to_destroy_desc: "You were the chosen one! It was said that you would destroy the Stalinists, not join them! Bring balance to the World, not leave it in darkness!"
YZA_continue_the_path_of_democracy: "Continue the Path of Democracy"
YZA_continue_the_path_of_democracy_desc: "Our current path serves us well."
YZA_major_purges: "Major Purges"
YZA_major_purges_desc: "Our Last Purges weren't enough, we need more purges and more blood spilled to secure our government."
YZA_the_new_soviet_family: "The New Soviet Family"
YZA_the_new_soviet_family_desc: "Our 'New Marxist Culture' was a bad idea- the family is needed!"
YZA_cement_our_reforms: "Cement our Reforms"
YZA_cement_our_reforms_desc: "'Thank you, Thank you!' 'You have Freed us'\n'Oh I wouldn't say freed, more like under new management'"
YZA_democracy_in_the_workplace: "Democracy in the Workplace"
YZA_democracy_in_the_workplace_desc: "We will implement democracy in the workplace, rather than the old archaic form of managers."
YZA_start_to_change_democracy: "Start to Change Democracy"
YZA_start_to_change_democracy_desc: "The Best Way to prevent authoritarianism is to get power out of the hands of one person- instead we will change democracy to be more direct within the nation."
YZA_democracydemocracyeverywhere: "Democracy, Democracy Everywhere"
YZA_democracydemocracyeverywhere_desc: "Woohoo Democracy"
YZA_war_focuses: "War Focuses"
YZA_war_focuses_desc: "These are"
YZA_electrification_programme: "Electrification Programme"
YZA_electrification_programme_desc: "We will start a programme of Electrification in our Country."
YZA_build_up_huesca: "Build Up Huesca"
YZA_build_up_huesca_desc: "We Will build up Huesca to be more industrial and modern."
YZA_expand_rural_infrastructure: "Expand Rural Infrastructure"
YZA_expand_rural_infrastructure_desc: "Rural Infrastructure is horrific- this must be rectified."
YZA_zaragozan_arms_factory: "Zaragozan Arms Factory"
YZA_zaragozan_arms_factory_desc: "We Will Establish the Zaragozan Arms Factory for better weapon development"
YZA_artillery_factories: "Artillery Factories"
YZA_artillery_factories_desc: "Similar to the Arms Factory, we shall do the same for Artillery"
YZA_establish_a_currency: "Establish a Currency"
YZA_establish_a_currency_desc: "We Will Sadly Have to establish a currency other than the Spanish Peseta if we are to do anything economically"
YZA_expand_industry_from_bilbao: "Expand Industry From Bilbao"
YZA_expand_industry_from_bilbao_desc: "Bilbao is a center of Industry- it would be good to expand our industry from it."
YZA_fishing_infrastructure: "Fishing Infrastructure"
YZA_fishing_infrastructure_desc: "If We export fish it may help our economic development"
YZA_economic_stability: "Economic Stability"
YZA_economic_stability_desc: "Now That Unification has been achieved, so has stability"
YZA_worker_coops: "Worker Co-ops"
YZA_worker_coops_desc: "We Shall Establish Worker Co-ops for better ideological and economic development"
YZA_aluminium_mining: "Aluminium Mining"
YZA_aluminium_mining_desc: "We Shall Mine Aluminium in our mountains."
YZA_drill_for_oil: "Drill for Oil"
YZA_drill_for_oil_desc: "The Sea has much oil which we can use"
############### EVENTS #################

yza_events.1.t: "The 1936 Congress Begins..."
yza_events.1.d: "The Congress has begun, with the three main factions, the COM, the FST and the CTA all vying for the most influence in the nation, only time will tell who will make it out on top"
yza_events.1.a: "So it begins"
yza_events.2.t: "Autonomy of Workers"
yza_events.2.d: "Day 1- Worker Autonomy:\nThe Marxists see that limited workers autonomy may be required but wish for a centralised body which workers choose through representatives to speak their interests.\nThe Syndicalists see that it is important and wish to allow worker autonomy within organisations, through democratic worker elections and worker control of the means of production.\nThe Anarchists wish for full worker autonomy to do whatever they wish, and to produce how ever much they wish and what they wish."
yza_events.2.a: "Limited Autonomy"
yza_events.2.b: "Autonomy within Unions"
yza_events.2.c: "Full Autonomy"
yza_events.3.t: "Security Policy"
yza_events.3.d: "Day 2- Security Policy:\nThe Marxists wish to quell dissent through some force, though still relatively restrained compared to that of the USSR.\nThe Syndicalists and Anarchists however, both have the same policy of allowing the people to do what they wish and for self-regulation to be key. "
yza_events.3.a: "Security Should Be Important"
yza_events.3.b: "Self-regulation is the only way forward"
yza_events.4.t: "Foreign Policy"
yza_events.4.d: "Day 3- Foreign Policy:\nThe Marxists wish to establish a 'Socialist Internationale' in response to Stalin's Comintern, for which we can add other likeminded nations, and to invade the rest.\nThe Syndicalists wish to Invade the other nations to reunite Spain, but to send ultimatums to like-minded countries to join us or die.\nThe Anarchists wish to reunite Spain like the rest, but unless the opposing side is anarchist, to invade them."
yza_events.4.a: "To the Internationale!"
yza_events.4.b: "Ultimatums sounds Good"
yza_events.4.c: "No Gods, No Masters"
yza_events.5.t: "The Congress Draws to a Close..."
yza_events.5.d: "As the congress draws to a close, the acting speaker can endorse one of the factions, which side will they endorse?"
yza_events.5.a: "The Marxists"
yza_events.5.b: "The Syndicalists"
yza_events.5.c: "The Anarchists"
yza_events.6.t: "Who's In Charge?"
yza_events.6.d: "Only one Union has secured enough of a majority to go into power."
yza_events.6.a: "And the Winner is..."
yza_events.7.t: "Purges..."
yza_events.7.d: "'Although the idea of purges seems very similar to that in the Soviet Union under Stalins dictatorship, we here at the COM can assure you that it is not- whilst in the USSR Stalin would kill and harm people we will simply remove those who are unfit from government- for the benefit of the workers' ran the official COM statement to accusations from the CTA and FST that they had started purging their elements from the Government- only time will tell if this escalates "
yza_events.7.a: "Literally 1963"
yza_events.8.t: "A New Culture"
yza_events.8.d: "The Establishment of a NEW culture is in order, of freedom, and of socialism! One in which all are free and will wish to help us in our goal of a better tomorrow! Join us!"
yza_events.8.a: "Where do I sign up?"
yza_events.9.t: "What to do?"
yza_events.9.d: "The Basque population has possed major resistance to our nation from the start, with such stipulated goals as 'Independence' and 'Autonomy', what should we do about this? \nWe could capitulate to them and offer them autonomy within our nation, or we could crack down HARD on them, preventing any resistance in the future."
yza_events.9.a: "Autonomy"
yza_events.9.b: "Crack Down!"
yza_events.10.t: "The Socialist Internationale"
yza_events.10.d: "'Workers of the world! If you detest Stalin's Authoritarian regime and wish for a more democratic, a more liberal, a better world of Socialism, then JOIN US in the Socialist Internationale, to break the chains, and establish a better tomorrow!'"
yza_events.11.t: "The Lost Regiment"
yza_events.11.d: "What the fuck even is the lost regiment like idk i just have to wait until content is added i guess."
yza_events.12.t: "Alliance, Or War?"
yza_events.12.d: "The Catalans to our East share some similarities in terms of ideology- perhaps we should offer them an alliance? If they say no we can invade them anyway."
yza_events.12.a: "Alliance!"
yza_events.12.b: "War"
yza_events.13.t: "An Offer"
yza_events.13.d: "The Zaragozans to our West have offered us an alliance, if we reject they have said they will declare war."
yza_events.13.a: "Sure"
yza_events.13.b: "No"
yza_events.14.t: "Spain"
yza_events.14.d: "We have officially rebranded to the People's Republic of Spain- this will grant us much legitimacy in the coming struggle."
yza_events.14.a: "A Battle is Afoot"
