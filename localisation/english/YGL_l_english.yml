the_pine_trees.1.t:0 "The Chairman's Report"
the_pine_trees.1.d:0 "Castelao sat in the old office, surrounded by flags of the now long-gone spanish second republic. 
The whole place looked almost frozen in time, old photographs still on the walls, papers scattered around,
and a bottle of spilled ink with a fountain pen sitting rather conspicuously on the table. He picked up the 
pen and placed it in the jar before taking a photograph out of his pocket. The glass was cracked
and the frame was bent, but one could still make out the faces of not only Castelao himself, but his old friends too.
Calero, Risco, and a dozen others stared through the grainy glare. He gave a short sigh and returned to 
work, beginning a new draft of the newly-formed republic's constitution. He picked up the pen, and signed his name 
on the paper in black ink, before getting up to finally leave for home, leaving the paper on the table, another addition
to the growing stack of papers atop the old wooden desk on which he wrote."
the_pine_trees.1.a:0 "Old memories die hard.."
vengeance.1.t:0 "Vengeance For the Fallen"
vengeance.1.d:0 "Castelao sat in his office, mulling over possiblities. The Spanish flags were gone, replaced by the Estelada, the flag 
representing the new government out of A Coruna. Now, his mind drifted to a new possiblity. What to do with the Asturias? They only deserve vengeance, he thought. They came over the borders at night, attacking our people, stealing our wealth. What do they not deserve? Why would we spare them from what they did to us? It was decided. He rushed over to the telephone, picked it up, and gave the go ahead. Troops were at once heard marching through Santiago de Compostela, to the border with the Asturias. A soft chuckle could be heard, before the sound of a whistle, the rallying cry of the generals, and the sound of jackboots marching into the night."
vengeance.1.a:0 "This Means War!"
fight_fire.1.t:0 "To Fight Fire With Water." 
fight_fire.1.d:0 "Castelao sat in his office, mulling over possiblities. The Spanish flags were gone, replaced by the Estelada, the flag 
representing the new government out of A Coruna. Now, his mind drifted to a new possiblity. What to do with the Asturias? They only deserve vengeance, he thought. They came over the borders at night, attacking our people, stealing our wealth. What do they not deserve? But no. We can not be violent ourselves, would we be any better then the Asturians if that were the case? The Asturian government does not know what their subjects do anyway. It would be better to be the bigger person, and take the offenders to justice in a real court, without 
violence or fighting. If we want the land, we can open talks later. Better off preserving this already delicate peace."
fight_fire.1.a:0 "War Is Hell."