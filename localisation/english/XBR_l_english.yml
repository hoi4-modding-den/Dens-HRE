 XBR_the_fasces_and_the_eagle_tt:0 "§LThe Fasces Represents §CUnity§!, while the Eagle Represents §RStrength!§!§!\n\n"
 XBR_reinforce_the_querfront_tt:0 "§LOnly Through Collective Action of the §tSocialists§! and the §9Fascists§!, Can §CBrandenburg§! Thrive!§!\n\n"
 XBR_strongarm_the_national_vaguard_tt:0 "§LAll Political Power Arises from the §RBarrel of a Rifle!§!§!\n\n"
 XBR_abolish_the_party_lines_tt:0 "§LFor Far Too Long Have the §CGerman People§! Allowed Themselves to be Caught Up in the Pettyness of §RInter-Party Politics.§!§!\n\n"
 XBR_united_against_decadence_tt:0 "§L§9The Party§! and §Cthe People§! Have the Ability to Form an Unfaltering Bond Between Each Other, Something That §RImpurity and Corruption§! are Unable to Shatter.§!\n\n"
 XBR_volksgemeinschaft_tt:0 "§LPolices That Revolve Around the Concept of §tMutual Aid§! are Necessary if We Ever Wish to Achieve §CNational Unity.§!§!\n\n"
 XBR_promote_class_collaboration_tt:0 "§L§9The Bourgeoisie§! and §tthe Proletariat§! Shall Work and Fight Alongisde One Another For a Cause That is Much More §RConsequential§! Than Any of Their Own Class Interests!§!\n\n"
 XBR_form_the_daf_tt:0 "§LThe §tCorpus of the German Workers§! Is Just as Important as the §9Corpus of the Employers§!, Hence Why Establishing a §CState-Directed Labour Organization§! Should Be Our Top Priority.§!\n\n"
 
 XBR.1.t:0 "The SNPoB's Quest for the Common Good"
 XBR.1.d:0 "'Class conflict, plutocratic rule, monarchies and regencies, all of those are concepts planted into our heads by our enemies, whose only goal is to keep tearing the proud, superior German folk apart. What the average Brandenburger needs to understand is the fact that they have a lot more in common with their fellow labourer, their employer and their lawmakers, as opposed to the rats and pests who attempt to persuade them towards fighting for the international proletariat or tease them with the thought of wealth and riches. The German people can only be superior and pure when they are united together as one, working collectively for the nation, in the nation. This is what we strive for!' Gauleiter Reinhold Muchow proudly proclaimed in front of the vast amounts of people who had turned up to the political rally held by the SNPoB in the Tiergarten.\n\nHe then turns to Leiter Ernst Schlange, the supreme leader of the Social Order who had been observing his perfromance from the afar, who in turn, gives him an encouraging nod, showing Reinhold that he had done well. Muchow's career could only torpedo itself to higher realms after that performance in front of the masses."
 XBR.1.a:0 "The regime is cementing itself."
