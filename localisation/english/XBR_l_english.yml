 XBR_the_fasces_and_the_eagle_tt:0 "§LThe Fasces Represents §CUnity§!, while the Eagle Represents §RStrength!§!§!\n\n"
 XBR_reinforce_the_querfront_tt:0 "§LOnly Through Collective Action of the §tSocialists§! and the §9Fascists§!, Can §CBrandenburg§! Thrive!§!\n\n"
 XBR_strongarm_the_national_vaguard_tt:0 "§LAll Political Power Arises from the §RBarrel of a Rifle!§!§!\n\n"
 XBR_abolish_the_party_lines_tt:0 "§LFor Far Too Long Have the §CGerman People§! Allowed Themselves to be Caught Up in the Pettyness of §RInter-Party Politics.§!§!\n\n"
 XBR_united_against_decadence_tt:0 "§L§9The Party§! and §Cthe People§! Have the Ability to Form an Unfaltering Bond Between Each Other, Something That §RImpurity and Corruption§! are Unable to Shatter.§!\n\n"
 XBR_volksgemeinschaft_tt:0 "§LPolices That Revolve Around the Concept of §tMutual Aid§! are Necessary if We Ever Wish to Achieve §CNational Unity.§!§!\n\n"
 XBR_promote_class_collaboration_tt:0 "§L§9The Bourgeoisie§! and §tthe Proletariat§! Shall Set Aside Their Differences on the Behalf of a Cause That is Much More §RConsequential§! Than Any of Their Own Class Interests!§!\n\n"
 XBR_form_the_daf_tt:0 "§LThe §tCorpus of the German Workers§! is Just as Important as the §9Corpus of the Employers§!, Hence Why Establishing a §CState-Directed Labour Organization§! Should Be Our Top Priority.§!\n"
 XBR_an_united_volk_against_the_parasites_tt:0 "§RBlood Alone Moves the Wheels of History!§!\n\n"
 XBR_purge_the_bureaucrats_tt:0 "§RBormann's Rats§! §Lare Only Asking to be Quashed, Thanks to Their §ROligarchic and Plutocratic§! Ideals!§!\n"
 XBR_crush_the_traitors_tt:0 "§RTreason§! §Lis One of the Most Heinous Crimes That Anyone Can Commit in Brandenburg; Any §RLeech or Parasite§! Can Automatically be Seen as Quilty of That Vile Act.§!\n\n"
 XBR_round_all_of_them_up_tt:0 "§LWe Shall Accelerate the §RAnti-Bormannite Purge§! by Any Means Necessary!§!\n"
 XBR_increase_sh_presence_tt:0 "§LUsing the Blackshirts to Police the Streets is a Good Way to Show the §RParasites§! That They are No Longer Welcome Here.§!\n\n"
 XBR_strangle_the_kingpin_tt:0 "§RThe Bormannite Threat Shall Be Conclusively and Decisively Eliminated!§!\n\n"
 XBR_total_dominance_of_the_state_tt:0 "§LNow That the Last Elements of Opposition Have Been Disposed, There is Nothing Stopping the State Apparatus from Taking Complete Control of All Internal Matters.§! §RThe Transitional Phase to Fascism is Complete!§!\n\n"
 XBR_bolster_the_ministry_of_fa:0 "§GDiplomatic Strength§! §Lis Sometimes Just as Important as §Rthe Might of One's Armed Forces.§!\n"
 XBR_brandenburger_intervention_forces_tt:0 "§LIf We Ever Wish to Establish Ourselves as a §CRegional Power§!, We Must Have the Ability to §RExercise our Power§! Everywhere in the Realm of the Holy Roman Empire.§!\n\n"
 XBR_befriend_likeminded_nations_tt:0 "§LStanding Alone Against the §RInternational Parasites and Pests§! is an Incredibly Unfavourable Geopolitical Position For Us. This is Why Finding §9Ideological Brother in Arms§! From All Corners of the HRE is a Necessity.§!\n\n"
 XBR_against_the_pope_tt:0 "§ROne of Them Fools You With Their Religion, and the Other One Blinds You With Their Riches.§!\n\n"
 XBR_prepare_for_the_southward_strike_tt:0 "§LMonarchism is the Greatest Enemy of the §CSocial Order§!, Which is Why a §RDecisive Strike§! Against the §7Kingdom of Saxony§! is Necessary in Order to Secure the Future of Our Regime.§!\n\n"
 XBR_contact_our_ideological_allies_in_saxony_tt:0 "§LLuckily for Us, There are Still Certain Individuals in Saxony Who Share Our National Corporatist Political Views. One of Them is §9Franz Seldte§!, and By Funding His Party, We Have the Opportunity to Sow §RInternal Disputes§! in Saxony.§!\n\n"
 XBR_agitate_spreewald_sorbia_tt:0 "§LBoth Spreewald and Sorbia are Exceedingly Weak Nations, Hence Why §RDestabilizng Them from the Inside§! in Preparation for Our Invasion Should Not be a Difficult Task to Complete.§!\n\n"
 XBR_gain_the_support_of_our_own_people_tt:0 "§LWe Must Underline the Neccesity of the Looming Invasion to Our People.§!\n\n"
 XBR_strike_at_saxony_tt:0 "§LThe Time is Nigh for the Invasion That We Have Been Passionately Preparing For Throughout This Year.§!\n\n§RFor the Social Revolution and the German Volk!§!\n\n"
 XBR_declare_ourselves_present_tt:0 "§LOur Nation Proudly Stands as a Revolutionary Stronghold for All Germans Everywhere Throughout the Globe Who Oppose the Corruption of the Holy Roman Political System and the Decandence of Capitalism and Bolshevism!§!\n\n"
 XBR_indev_tt:0 "§LThis Path is Currently §!§RIn Development!§!\n\n"
 XBR_integrate_saxonian_territories_tt:0 "§LThe §7Saxonian§! People are Just as German as Their §CBrandenburger§! Brothers and Sisters.§!\n\n"
 XBR_secede_from_the_hre_tt:0 "§LNow That We Have Triumphed Over the Saxonian Monarchy, We Have Enough Geopolitical Relevance to §GDeclare Ourselves Free§! From §Rthe Shackles and the Tyranny of the Holy Roman Empire.§!§!\n\n"
 XBR_champions_of_the_german_people_tt:0 "§LThe Victory Over the Southern Royalists was Merely the First Step Towards Establishing a §CNew, United German State.§!§!\n\n"
 XBR_approach_ferdinand_porsche_tt:0 "§LWurttenburg, Led by §9Ferdinand Porsche§!, is a Nation That Shares a Lot in Common With Our Social Corporatist System. By §GExtending the Olive Branch§! Towards Them, Both of Our Nations Could Advance Towards Mutually Satisfactory Goals.§!\n\n"
 XBR_kdf_wagen_tt:0 "§LThe Level of Motorization in Our Nation is Still Fairly Limited. While There Have Been Efforts to Put the Army on Wheels, Private Motoring and Civilian Cars are Still Very Much a Scarcity in Brandenburg. The Volkswagen Proposal Conceived by Ferdinand Porsche Could Change That for the Better.§!\n\n"
 XBR_shared_panzer_designs_tt:0 "§LArmored Troops Play a Decisive Role in Modern Warfare. This is Why We Collaborate with Wurttenburg to Find the Most Efficient and Potent Designs.§!\n\n"
 
 XBR_declare_ourselves_present_desc:0 "§LOur Nation Proudly Stands as a Revolutionary Stronghold for All Germans Everywhere Throughout the Globe Who Oppose the Corruption of the Holy Roman Political System and the Decandence of Capitalism and Bolshevism!§!\n\n"
 XBR_reinforce_the_querfront_desc:0 "§LOnly Through Collective Action of the §tSocialists§! and the §9Fascists§!, Can §CBrandenburg§! Thrive!§!\n\n"
 XBR_whispers_in_the_shadows_desc:0 "§LThis Path is Currently §!§RIn Development!§!\n\n"
 
 XBR_diplo.1.t:0 "Brandenburger-Wurttenburger Treaty?"
 XBR_diplo.1.a:0 "Accept"
 XBR_diplo.1.b:0 "Refuse"
 XBR_diplo.1.d:0 "Diplomats from the Social Order of Brandenburg have proposed the establishment of a Brandenburger-Wurttenburger treaty, that according to them, would draw our ideologically similiar nations much closer and help us achieve mutually benefitial goals much more efficently."
 XBR_diplo.2.t:0 "Mutual Development of Armored Vehicles?"
 XBR_diplo.2.d:0 "Brandenburger diplomats have put forward an offer that would accelerate the development of armored technology both here and in Brandenburg."
 XBR_diplo.2.a:0 "Accept the offer"
 XBR_diplo.2.b:0 "Refuse the offer"
 XBR_porsche_accepted_tank_treaty_tt:0 "Wurttenburg has accepted our armor technology exchange proposal"
 
 XBR.1.t:0 "The SNPoB's Quest for the Common Good"
 XBR.1.d:0 "'Class conflict, plutocratic rule, monarchies and regencies, all of those are concepts planted into our heads by our enemies, whose only goal is to keep tearing the proud, superior German folk apart. What the average Brandenburger needs to understand is the fact that they have a lot more in common with their fellow labourer, their employer and their lawmakers, as opposed to the rats and pests who attempt to persuade them towards fighting for the international proletariat or tease them with the thought of wealth and riches. The German people can only be superior and pure when they are united together as one, working collectively for the nation, in the nation. This is what we strive for!' Gauleiter Reinhold Muchow proudly proclaimed in front of the vast amounts of people who had turned up to the political rally held by the SNPoB in the Tiergarten.\n\nHe then turns to Leiter Ernst Schlange, the supreme leader of the Social Order who had been observing his perfromance from the afar, who in turn, gives him an encouraging nod, showing Reinhold that he had done well. Muchow's career could only torpedo itself to higher realms after that performance in front of the masses."
 XBR.1.a:0 "The regime is cementing itself."
 XBR_unlocks_muchow_tt:0 "§GUnlocks Reinhold Muchow as an advisor§!"
 XBR_unlocks_extensive_conscription:0 "§GUnlocks the 'Extensive Conscription' conscription law§!"
 XBR_volksgemeinschaft_decisions_unlocked:0 "\nUnlocks additional §HDecisions§! that allow you to improve the §HVolksgemeinschaft§! national spirit"
 XBR_enable_purge_decisions:0 "\nUnlocks §HDecisions§! that allow you to carry out the §Rintra-party puge.§!"
 XBR_reduce_purge_cost:0 "\n§GReduces the cost of all future purge-related decisions.§!"
 XBR.2.t:0 "A Symbolic Declaration of War"
 XBR.2.d:0 "'There is a great, ongoing attack against all of us proud Germans who have woken up from the dusk of our slavery, a charge against us who were brave and strong enough to break the chains that held us in place!' Schlange roused the crowd, trying his best to agitate them, and to make them to have that primal reaction of pure, unfiltered rage, before carefully directing that raw, hate-fueled energy towards those who he personally viewed as undesirable. 'We do not want to regress back into the way things used to be! We have already once risen up to the occasion, and delivered a smashing blow to the parasites. Not only that, I am more than sure that the German volk is able to replicate our earlier successes, this time in much greater scale; not just in Brandenburg, but in Saxony, in Hamburg, in Prussia, in Tyrol, everywhere that the bloodsucking of the leeches has become a norm!' Schlange roared, and the crowd reacted accordingly. 'This is why I call for a counter-attack, a great revoltion against the rats, those grotesque, filthy animals that think that they can just walk over the German people without any resistance! Capitulation or defeat is not an option in this conflict, this is a matter of life and death, the light and civilization against eternal darkness and barbarity! This is why I, in front of tens of thousands of Brandenburgers, ask if you're ready for the most consequential war in the history of mankind! Do you want to be the exterminator or the slave? Do you accept my declaration of war against the parasites?' He staunchily proclaimed, and without a moment of doubt, the masses reacted positively. 'Yes!' was repeatedly chanted in unison. 'Do you accept my declaration of war?' He asked once again, before receiving a similar, overwhelmingly positive reaction."
 XBR.2.a:0 "History is in the hands of Brandenburg"
