YCA_people_aviation_bureau_idea:0 "Oficina de Aviación Popular"
YCA_people_aviation_bureau_idea_desc:0 "The skies have become a new front in the struggle. To defend the revolution and ensure aerial supremacy, the Generalitat has established the People's Aviation Bureau. It coordinates scarce resources, oversees training of pilots, and organizes the maintenance of our aircraft. While the bureau often suffers from shortages and political disputes, it represents the determination of the people to master modern warfare and safeguard the revolution from above."
YCA_people_aviation_bureau_idea_gen:0 "Oficina de Aviación Popular"
YCA_people_aviation_bureau_idea_gen_desc:0 "The skies have become a new front in the struggle. To defend the revolution and ensure aerial supremacy, the Generalitat has established the People's Aviation Bureau. It coordinates scarce resources, oversees training of pilots, and organizes the maintenance of our aircraft. While the bureau often suffers from shortages and political disputes, it represents the determination of the people to master modern warfare and safeguard the revolution from above."
