### INTRO ###
YCA_intro_loc:0 "Born from the upheaval of the §Y1934 Revolution§! and the collapse of the Iberian state, the §rCatalan Revolutionary Front§! stands as a crucible of competing §Rleftist ideals§! at the dawn of 1936. Within the §LGeneralitat§!, the radical forces of the era have converged, yet unity is fragile and contested. The §RVanguardists§! demand a disciplined, centralized authority to safeguard the revolution; the §0Revolutionary Socialists§! push for a pluralist system where the different currents of the left may govern together; while the §gAnarcho-Syndicalists§! call for the total dismantling of the state, replacing it with federated councils and workers’ assemblies.\nThis experiment in §Yrevolutionary governance§! has created both hope and peril. Workers’ militias, red trade unions, and radical committees mobilize to defend the new order, while women’s leagues and popular organizations seek to remake society in the spirit of equality. Yet §Yfactional rivalries§! already gnaw at the §LCatalan Generalitat§!, threatening paralysis and civil strife. With the world sliding toward war, Catalonia emerges as a laboratory of revolution, a fragile, divided, but defiant front that could either inspire Iberia to a new future or collapse under the weight of its own contradictions.\n\n§HCurrent Content:§!\n- Carefully balance the §trevolutionary infighting§! between the various factions of the §LCatalan Generaliat§! \n- Empower the authoritharian §RVanguardists§! to §Yrule over Iberia§! in the name of order and stability \n- Attempt the §Ypluralist experiment§! with the §0Revolutionary Socialists§! \n- §YDestroy the state§! in favor for §gworker's councils§! and federations through the works of the §gAnarcho-Syndicalists§!"
YCA_credits:0 "Catalan Content: §Hfuriousky/Sky§!\nIntro GUI: §CKasastul§!\nRest of the mod: §HThe HOI4 Modding Den§!"

