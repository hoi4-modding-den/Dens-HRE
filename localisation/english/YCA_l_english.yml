YCA_domestic_events.2.t:0 "The Worker Battalions Rise"
YCA_domestic_events.2.desc:0 "WIP"
YCA_domestic_events.2.a:0 "People of Catalonia, Rise!"
YCA_domestic_events.3.t:0 "The Radical Triumvirate"
YCA_domestic_events.3.desc:0 "WIP"
YCA_domestic_events.3.a:0 "The situation grows more dire with each passing day..."
YCA_domestic_events.4.t:0 "Interim Constitution: Preamble"
YCA_domestic_events.4.desc:0 "Within the Catalan Revolutionary Front, debate rages over the wording of the Interim Constitution’s preamble. The vanguardists demand a declaration that enshrines the Party’s guiding role in leading the revolution. Revolutionary socialists insist the preamble must emphasize the eternal unity of workers and peasants. Meanwhile, the anarcho-syndicalists argue that only the councils and federated collectives can truly embody the spirit of Catalonia’s struggle. The choice made will determine the tone of the newborn state."
YCA_domestic_events.4.a:0 "The Party leads the people."
YCA_domestic_events.4.a:0 "The Party leads the people."
YCA_domestic_events.4.b:0 "Unity of workers and peasants."
YCA_domestic_events.4.c:0 "Power rests in the councils."
YCA_domestic_events.5.t:0 "Interim Constitution: State Oversight"
YCA_domestic_events.5.desc:0 "As the drafting of the Interim Constitution continues, fierce arguments erupt over the question of economic oversight. The vanguardists and revolutionary socialists push for a framework where the state directly supervises industry and agriculture, ensuring discipline, planning, and the prioritization of collective progress. On the other hand, the anarcho-syndicalists reject such centralization, instead calling for power to remain in the hands of workers’ assemblies and federated collectives, free from state interference. The decision will define how production and ownership are organized in Catalonia’s new order."
YCA_domestic_events.5.a:0 "Grant the state authority to oversee industry and agriculture."
YCA_domestic_events.5.b:0 "Leave control to the federated collectives."
YCA_domestic_events.6.t:0 "Interim Constitution: Individual Freedoms"
YCA_domestic_events.6.desc:0 "The Catalan Revolutionary Front now debates the guarantees of individual freedoms in the Interim Constitution. Some factions advocate for broad liberties — freedom of the press, open assemblies, and protection of personal expression — seeing them as essential to the revolutionary spirit and the trust of the people. Others, particularly the vanguardists, argue that too much freedom could threaten the revolution, insisting on limits and oversight to ensure unity and discipline. How these rights are framed will shape the character of the new Catalan state."
YCA_domestic_events.6.a:0 "Guarantee broad freedoms of press, assembly, and expression."
YCA_domestic_events.6.b:0 "Place strict limits to safeguard stability and discipline."
YCA_domestic_events.7.t:0 "Interim Constitution: Secularism"
YCA_domestic_events.7.desc:0 "As Catalonia’s Interim Constitution is finalized, the Front discusses the role of religion in the new republic. Some argue for a secular state that still respects freedom of worship, allowing citizens to practice their beliefs without interference while keeping politics and religion separate. Others propose leaving religion entirely unmentioned, focusing solely on civic matters and avoiding any formal stance. The choice will signal how inclusive and tolerant the state appears to its citizens."
YCA_domestic_events.7.a:0 "Establish a secular state while protecting freedom of worship."
YCA_domestic_events.7.b:0 "Do not mention religion in the draft."
YCA_domestic_events.8.t:0 "Interim Constitution: One-Party Rule"
YCA_domestic_events.8.desc:0 "The Catalan Revolutionary Front now faces a crucial decision: how to structure political power in the new republic. Vanguardists push for a single-party system, arguing that only a disciplined revolutionary party can safeguard the revolution. Revolutionary socialists advocate for a pluralist arrangement, allowing various leftist factions to participate and experiment with shared governance. Meanwhile, the anarcho-syndicalists call for decentralized councils and federated collectives, rejecting party dominance altogether. The choice will determine the political landscape and balance of power in Catalonia."
YCA_domestic_events.8.a:0 "Establish a one-party system to ensure revolutionary unity."
YCA_domestic_events.8.b:0 "Allow multiple leftist factions to participate in governance."
YCA_domestic_events.8.c:0 "Mention the importance of federated councils as the highest form of authority."
YCA_domestic_events.9.t:0 "Interim Constitution: §rVanguardist§! Victory"
YCA_domestic_events.9.desc:0 "After intense debate, the Catalan Revolutionary Front has ratified a Vanguardist Interim Constitution, enshrining party leadership and centralized revolutionary authority. The framework sets the foundations for Catalonia’s radical transformation."
YCA_domestic_events.9.a:0 "The people are now united under the Vanguardist ideals"
YCA_domestic_events.10.t:0 "Interim Constitution: §0Revolutionary Socialist§! Victory"
YCA_domestic_events.10.desc:0 "After careful deliberation, the Catalan Revolutionary Front has ratified a Revolutionary Socialist Interim Constitution, allowing for pluralist governance among various leftist factions. The framework emphasizes collective decision-making while maintaining revolutionary principles."
YCA_domestic_events.10.a:0 "A pluralist revolution has begun spearheaded by the Revolutionary Socialists"
YCA_domestic_events.11.t:0 "Interim Constitution: §gAnarcho-Syndicalist§! Victory"
YCA_domestic_events.11.desc:0 "Following prolonged discussion, the Catalan Revolutionary Front has ratified an Anarcho-Syndicalist Interim Constitution, empowering councils and federated collectives. The framework rejects centralized party control, emphasizing direct democratic governance."
YCA_domestic_events.11.a:0 "The Anarcho-Syndicalists place the councils at the core of the regime"
