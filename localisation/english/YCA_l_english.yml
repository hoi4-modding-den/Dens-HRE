YCA_people_aviation_bureau_idea_support_desc:0 "The skies have become a new front in the struggle. To defend the revolution and ensure aerial supremacy, the Generalitat has established the People's Aviation Bureau. It coordinates scarce resources, oversees training of pilots, and organizes the maintenance of our aircraft. While the bureau often suffers from shortages and political disputes, it represents the determination of the people to master modern warfare and safeguard the revolution from above."
YCA_forming_the_red_air_arm:0 "Forming the Brazo Aéreo Rojo"
YCA_forming_the_red_air_arm_desc:0 "With the skies becoming a decisive arena in modern warfare, the Generalitat has resolved to create the Brazo Aéreo Rojo. Drawing from workers, volunteers, and international comrades, this new force will ensure that the Revolution is not only defended on land and sea, but also in the air. Though resources are scarce and training limited, the establishment of a dedicated revolutionary air arm marks a bold step toward true aerial sovereignty."
YCA_flota_del_pueblo_idea:0 "Flota del Pueblo"
YCA_flota_del_pueblo_idea_desc:0 "Born out of necessity and guided by revolutionary determination, the Flota del Pueblo is the maritime shield of the Catalan people. Crewed by workers, fishermen, and volunteers loyal to the cause, this fleet symbolizes popular resistance against reactionary forces. Though resources are limited, its spirit lies not in grandeur, but in the resolve of the people who take to the seas in defense of the Revolution."
YCA_flota_del_pueblo_idea_sailor:0 "Flota del Pueblo"
YCA_flota_del_pueblo_idea_sailor_desc:0 "Born out of necessity and guided by revolutionary determination, the Flota del Pueblo is the maritime shield of the Catalan people. Crewed by workers, fishermen, and volunteers loyal to the cause, this fleet symbolizes popular resistance against reactionary forces. Though resources are limited, its spirit lies not in grandeur, but in the resolve of the people who take to the seas in defense of the Revolution."
