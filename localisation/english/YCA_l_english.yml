YCA_generalitat_faction_decision_guidesc:0 "The §LCatalan Generalitat§!, born from the §t1934 Revolution§!, began as a united front of §tleftist forces§!. Now, unity is fraying as three factions vie for control: the §rVanguardists§!, demanding a strong centralized authority; the §0Revolutionary Socialists§!, pushing for social democracy and left-wing governance; and the §gAnarcho-Syndicalists§!, seeking a stateless order of workers’ councils. The revolution’s future hangs in the balance."
