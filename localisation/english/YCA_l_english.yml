YCA_directive_workers_representation_desc:0 "The Party directs that workers’ councils must be included in all administrative organs, granting labor organizations a direct say in governance."
YCA_directive_socialized_production:0 "Directive: Socialized Production"
YCA_directive_socialized_production_desc:0 "The Party orders an expansion of collective and state-owned enterprises to ensure production directly serves the people rather than private interests."
YCA_directive_party_discipline:0 "Directive: Party Discipline"
YCA_directive_party_discipline_desc:0 "The Party issues strict orders enforcing cadre discipline, reaffirming the principle that the revolutionary vanguard must stand above factionalism and opposition."
YCA_construct_the_air_defense_ring:0 "Construct the Air Defense Ring"
YCA_construct_the_air_defense_ring_desc:0 ""
YCA_leaflet_campaign:0 "Leaflet Campaign"
YCA_leaflet_campaign_desc:0 "Printed manifestos and handbills are distributed across Barcelona and Valencia, reminding the people of their revolutionary duty. These small pieces of paper carry big ideas, spreading the anarcho-syndicalist message through every alleyway, marketplace, and factory floor."
YCA_workplace_outreach:0 "Direct Workplace Outreach"
YCA_workplace_outreach_desc:0 "Syndicalist organizers visit factories, workshops, and docks, speaking directly to the workers. In face-to-face discussions, they argue for greater control of production by those who labor within it, strengthening the influence of anarchist ideals at the very heart of Catalonia’s industry."
YCA_industrialize_llieda:0 "Expand the Workshops of Lleida"
YCA_industrialize_llieda_desc:0 "The countryside of Lleida must be transformed into a hub of productive capacity. By modernizing its small workshops and expanding infrastructure, we can bring the industrial revolution to this vital region."
YCA_industrialize_sobrarbe:0 "Forge Industry in Sobrarbe"
YCA_industrialize_sobrarbe_desc:0 "Sobrarbe has long been defined by its rugged terrain and rural communities. By investing in industry and infrastructure, we can connect the region to the heart of the revolution and unlock its hidden potential."
YCA_industrialize_monegros:0 "Reclaim the Plains of Monegros"
YCA_industrialize_monegros_desc:0 "The arid plains of Monegros may seem unfit for industry, but with determined planning and collective effort, we can turn this barren land into a productive center for the Catalan state."
YCA_industrialize_alcaniz:0 "Industrialize Alcañiz"
YCA_industrialize_alcaniz_desc:0 "Alcañiz stands at a crossroads of trade and agriculture. With proper investment, it can become a new industrial stronghold, supporting the revolution with workers, arms, and modern production."
YCA_the_land_distribution_act:0 "Enact the Land Distribution Act"
YCA_the_land_distribution_act_desc:0 "Large estates and idle lands have long been symbols of exploitation and inequality in Catalonia and Aragon. By passing the Land Distribution Act, the Generalitat will seize and redistribute rural lands to local peasant councils, collectives, and smallholders. This will weaken the remnants of landlord power while bolstering the countryside’s loyalty to the revolutionary state. Though some factions may oppose this radical change, it lays the foundation for a new agrarian order based on equality and self-management."

