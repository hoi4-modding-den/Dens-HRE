### EVENTS ###
YCA_domestic_events.1.t:0 "Future of the Forces Armades"
YCA_domestic_events.1.desc:0 "The Forces Armades of Catalonia, a patchwork of militias, old guard officers, and revolutionary volunteers, stand at a crossroads. Some within the Generalitat demand that the militias remain strong and autonomous, defending their local communities and the revolution itself in a decentralized manner. Others argue that a modern, professional army is needed — one that can not only protect Catalonia from domestic threats, but also prepare for the eventual liberation of Iberia. The future of Catalonia’s armed forces will shape the destiny of the revolution."
YCA_domestic_events.1.a:0 "Embrace the Old Guard ideals"
YCA_domestic_events.1.b:0 "The Military Council shall be tasked with the reforms"
YCA_domestic_events.2.t:0 "The Worker Battalions Rise"
YCA_domestic_events.2.desc:0 "Across Valencia and Barcelona, factory workers and union men answer the call of the revolution. Armed with whatever rifles and uniforms can be gathered, these new battalions march under banners of solidarity and liberation. Though discipline is uneven and equipment scarce, their devotion to the cause inspires the people. The Worker Battalions stand as both defenders of Catalonia’s streets and symbols of the people’s will to resist oppression."
YCA_domestic_events.2.a:0 "People of Catalonia, Rise!"
YCA_domestic_events.3.t:0 "The Radical Triumvirate"
YCA_domestic_events.3.desc:0 "The Generalitat is fractured, a government held together by a fragile alliance between three great factions. The Vanguardists, calling for discipline and centralized leadership, clash bitterly with the Revolutionary Socialists, who envision a pluralist government of the left. Both find themselves opposed by the Anarcho-Syndicalists, who reject the very idea of state power and demand the primacy of councils and workers’ federations. As ideology hardens and rivalries deepen, the tenuous balance within the so-called Triumvirate begins to unravel."
YCA_domestic_events.3.a:0 "The situation grows more dire with each passing day..."
YCA_domestic_events.4.t:0 "Interim Constitution: Preamble"
YCA_domestic_events.4.desc:0 "Within the Catalan Revolutionary Front, debate rages over the wording of the Interim Constitution’s preamble. The vanguardists demand a declaration that enshrines the Party’s guiding role in leading the revolution. Revolutionary socialists insist the preamble must emphasize the eternal unity of workers and peasants. Meanwhile, the anarcho-syndicalists argue that only the councils and federated collectives can truly embody the spirit of Catalonia’s struggle. The choice made will determine the tone of the newborn state."
YCA_domestic_events.4.a:0 "The Party leads the people."
YCA_domestic_events.4.a:0 "The Party leads the people."
YCA_domestic_events.4.b:0 "Unity of workers and peasants."
YCA_domestic_events.4.c:0 "Power rests in the councils."
YCA_domestic_events.5.t:0 "Interim Constitution: State Oversight"
YCA_domestic_events.5.desc:0 "As the drafting of the Interim Constitution continues, fierce arguments erupt over the question of economic oversight. The vanguardists and revolutionary socialists push for a framework where the state directly supervises industry and agriculture, ensuring discipline, planning, and the prioritization of collective progress. On the other hand, the anarcho-syndicalists reject such centralization, instead calling for power to remain in the hands of workers’ assemblies and federated collectives, free from state interference. The decision will define how production and ownership are organized in Catalonia’s new order."
YCA_domestic_events.5.a:0 "Grant the state authority to oversee industry and agriculture."
YCA_domestic_events.5.b:0 "Leave control to the federated collectives."
YCA_domestic_events.6.t:0 "Interim Constitution: Individual Freedoms"
YCA_domestic_events.6.desc:0 "The Catalan Revolutionary Front now debates the guarantees of individual freedoms in the Interim Constitution. Some factions advocate for broad liberties — freedom of the press, open assemblies, and protection of personal expression — seeing them as essential to the revolutionary spirit and the trust of the people. Others, particularly the vanguardists, argue that too much freedom could threaten the revolution, insisting on limits and oversight to ensure unity and discipline. How these rights are framed will shape the character of the new Catalan state."
YCA_domestic_events.6.a:0 "Guarantee broad freedoms of press, assembly, and expression."
YCA_domestic_events.6.b:0 "Place strict limits to safeguard stability and discipline."
YCA_domestic_events.7.t:0 "Interim Constitution: Secularism"
YCA_domestic_events.7.desc:0 "As Catalonia’s Interim Constitution is finalized, the Front discusses the role of religion in the new republic. Some argue for a secular state that still respects freedom of worship, allowing citizens to practice their beliefs without interference while keeping politics and religion separate. Others propose leaving religion entirely unmentioned, focusing solely on civic matters and avoiding any formal stance. The choice will signal how inclusive and tolerant the state appears to its citizens."
YCA_domestic_events.7.a:0 "Establish a secular state while protecting freedom of worship."
YCA_domestic_events.7.b:0 "Do not mention religion in the draft."
YCA_domestic_events.8.t:0 "Interim Constitution: One-Party Rule"
YCA_domestic_events.8.desc:0 "The Catalan Revolutionary Front now faces a crucial decision: how to structure political power in the new republic. Vanguardists push for a single-party system, arguing that only a disciplined revolutionary party can safeguard the revolution. Revolutionary socialists advocate for a pluralist arrangement, allowing various leftist factions to participate and experiment with shared governance. Meanwhile, the anarcho-syndicalists call for decentralized councils and federated collectives, rejecting party dominance altogether. The choice will determine the political landscape and balance of power in Catalonia."
YCA_domestic_events.8.a:0 "Establish a one-party system to ensure revolutionary unity."
YCA_domestic_events.8.b:0 "Allow multiple leftist factions to participate in governance."
YCA_domestic_events.8.c:0 "Mention the importance of federated councils as the highest form of authority."
YCA_domestic_events.9.t:0 "Interim Constitution: §rVanguardist§! Victory"
YCA_domestic_events.9.desc:0 "After intense debate, the Catalan Revolutionary Front has ratified a Vanguardist Interim Constitution, enshrining party leadership and centralized revolutionary authority. The framework sets the foundations for Catalonia’s radical transformation."
YCA_domestic_events.9.a:0 "The people are now united under the Vanguardist ideals"
YCA_domestic_events.10.t:0 "Interim Constitution: §0Revolutionary Socialist§! Victory"
YCA_domestic_events.10.desc:0 "After careful deliberation, the Catalan Revolutionary Front has ratified a Revolutionary Socialist Interim Constitution, allowing for pluralist governance among various leftist factions. The framework emphasizes collective decision-making while maintaining revolutionary principles."
YCA_domestic_events.10.a:0 "A pluralist revolution has begun spearheaded by the Revolutionary Socialists"
YCA_domestic_events.11.t:0 "Interim Constitution: §gAnarcho-Syndicalist§! Victory"
YCA_domestic_events.11.desc:0 "Following prolonged discussion, the Catalan Revolutionary Front has ratified an Anarcho-Syndicalist Interim Constitution, empowering councils and federated collectives. The framework rejects centralized party control, emphasizing direct democratic governance."
YCA_domestic_events.11.a:0 "The Anarcho-Syndicalists place the councils at the core of the regime"
YCA_domestic_events.12.t:0 "Revolutionary Infighting Escalates"
YCA_domestic_events.12.desc:0 "Tensions within the Catalan Generalitat are beginning to spill over. Vanguardists denounce their rivals as weak and undisciplined, while Revolutionary Socialists accuse them of authoritarianism. The Anarcho-Syndicalists, meanwhile, refuse to compromise on their insistence for decentralized councils. The fragile unity of the revolutionary government is starting to fracture."
YCA_domestic_events.12.a:0 "The Front grows increasingly divided."
YCA_domestic_events.13.t:0 "Revolutionary Infighting Heavily Intensifies"
YCA_domestic_events.13.desc:0 "Factional rivalries are now consuming much of the Generalitat’s work. Vanguardists and Revolutionary Socialists trade accusations in the chambers, while Anarcho-Syndicalist delegates stage walkouts and denounce the legitimacy of central authority. Decisions are delayed, committees dissolve into shouting matches, and the revolution risks turning against itself."
YCA_domestic_events.13.a:0 "The Generalitat seens to be on the edge of chaos."
YCA_domestic_events.14.t:0 "Revolutionary Infighting Reaches a Boiling Point"
YCA_domestic_events.14.desc:0 "The Generalitat is paralyzed. Fistfights have broken out during sessions, rival newspapers spread venomous propaganda, and rumors circulate of armed militias preparing for confrontation. The Vanguardists demand total control, the Revolutionary Socialists call for compromise, and the Anarcho-Syndicalists threaten to abandon the Generalitat entirely. The unity of the revolution stands on a knife’s edge."
YCA_domestic_events.14.a:0 "The fire has risen."
YCA_domestic_events.15.t:0 "Revolutionary Socialists Boycott the Generalitat"
YCA_domestic_events.15.desc:0 "The Revolutionary Socialists have announced a boycott of the Generalitat, accusing the Vanguardists of monopolizing authority and dismissing their proposals for a more pluralist government. In protest, their representatives have walked out of the assembly, leaving debates paralyzed and fueling growing distrust among the remaining factions. Without their cooperation, the fragile unity of the revolution continues to crumble."
YCA_domestic_events.15.a:0 "This is getting out of hand quickly."
YCA_domestic_events.16.t:0 "Classifying the Revolutionary Administration"
YCA_domestic_events.16.desc:0 "With the formation of a new proletarian-bureaucratic class, the question arises: how shall the administration of the Revolution be structured? Some argue for a tightly centralized vanguardist model, where party cadres hold strict oversight over all levers of power. Others push for a pluralist socialist framework, where councils and diverse leftist organizations share in governance. The choice made will likely shape the very character of our revolutionary state."
YCA_domestic_events.16.a:0 "Centralize power under the Vanguardists"
YCA_domestic_events.16.b:0 "Adopt a pluralist socialist framework"
YCA_domestic_events.17.t:0 "Women of the Revolution"
YCA_domestic_events.17.desc:0 "In a historic step, the women of Catalonia have organized themselves into a revolutionary league, determined to ensure that the new society does not replicate the injustices of the old. They demand equal participation in political life, recognition of their role in the struggle, and guarantees that the rights of women will be enshrined in the coming constitutional framework. Their presence adds both strength and new debates to the revolutionary process."
YCA_domestic_events.17.a:0 "The revolution belongs to everyone."
YCA_domestic_events.18.t:0 "The Barcelona Radical Congress"
YCA_domestic_events.18.desc:0 "With the state finally achieving a measure of stability, the radical left has called for its first great congress in Barcelona. Delegates from across Catalonia and beyond fill the halls with banners and fiery speeches. At stake is not only the immediate leadership of the Generalitat, but the direction of the entire revolution. Should power consolidate under the discipline of the Vanguardists, the more pluralist vision of the Socialists, or the workers’ councils of the Anarcho-Syndicalists? The speaker chosen here will shape the very character of the state for years to come, and the divisions are already showing signs of becoming permanent."
YCA_domestic_events.18.a:0 "Andreu Nin fiercely takes the podium"
YCA_domestic_events.18.b:0 "Joan Comorera speaks for the Socialists and freedom"
YCA_domestic_events.18.c:0 "Buenaventura Durruti addresses the congress"
YCA_domestic_events.19.t:0 "Syndicalist Union Proves Successful in the Generalitat"
YCA_domestic_events.19.desc:0 "The historic merger of the CNT and FAI into a unified syndicalist organization has begun to bear fruit within the Generalitat. Where once there was discord between competing anarchist tendencies, there is now a stronger and more coordinated movement, spearheaded by dedicated militants and worker delegates. Their growing influence has reshaped the atmosphere of the Generalitat, amplifying the voice of the anarcho-syndicalists and strengthening their claim as the true representatives of the working class."
YCA_domestic_events.19.a:0 "The syndicalist movement grows stronger"
YCA_domestic_events.20.t:0 "Raise Local Anarchist Councils"
YCA_domestic_events.20.desc:0 "Across Catalonia, neighborhoods and towns begin experimenting with new forms of governance inspired by anarcho-syndicalist principles. Workers establish councils and federations to manage local affairs, from the distribution of bread to the organization of defense. Introduced gradually and without overt provocation, these councils expand the reach of anarchist influence while avoiding outright confrontation with rival factions in the Generalitat. Quietly but steadily, the fabric of Catalonia begins to shift toward a society run directly by its people."
YCA_domestic_events.20.a:0 "The councils will guide the people"
YCA_domestic_events.21.t:0 "The Fuerza Obrera Manifesto"
YCA_domestic_events.21.desc:0 "A new pamphlet, now widely known as the 'Fuerza Obrera Manifesto,' has spread rapidly through the streets and factories of Catalonia. Written in fiery prose, it calls for the worker to free himself from oppressive and bureaucratic institutions that stifle liberty and distort the revolution. Without naming names, its attacks on centralized authority clearly hint at the Vanguardists, portraying them as no different from the oppressors of old. For many workers, the manifesto resonates deeply, a reminder that true freedom can only be found in the councils and federations of the people."
YCA_domestic_events.21.a:0 "The worker must be free!"
YCA_domestic_events.22.t:0 "Banc de Barcelona Communalized"
YCA_domestic_events.22.desc:0 "In a historic step, the Generalitat has ordered the communalization of the Banc de Barcelona. Once a symbol of bourgeois privilege and capitalist exploitation, the bank is now being restructured under collective management. Its assets and resources will no longer serve private shareholders but the needs of the people and the revolution. For many, this act represents both a symbolic and practical break with the old order—placing the financial heartbeat of Catalonia firmly in the hands of workers and their councils."
YCA_domestic_events.22.a:0 "The wealth of the few shall serve the many"
YCA_domestic_events.23.t:0 "The First Five-Year Leap"
YCA_domestic_events.23.desc:0 "The Comité de Planificación Popular has unveiled an ambitious program of industrial and agricultural transformation: the First Five-Year Leap. Modeled on the principles of centralized economic coordination yet tailored to Catalonia’s revolutionary context, the plan sets out bold targets for production, infrastructure, and modernization. While some view the initiative as the surest way to achieve socialist prosperity, others warn of potential strain on workers and resources. Whatever the risks, the march toward a new society has begun."
YCA_domestic_events.23.a:0 "We shall leap forward together!"
YCA_domestic_events.24.t:0 "Socialist Emulation Campaign"
YCA_domestic_events.24.desc:0 "The Catalan Revolutionary Front proposes a bold economic initiative aimed at collectivizing industry and fostering worker cooperatives across the region. Inspired by socialist experiments abroad, the plan seeks to boost productivity, reduce inequality, and demonstrate the potential of workers united. Ambitious in scope, the initiative faces resistance from entrenched industrial interests and risks sparking unrest if poorly managed."
YCA_domestic_events.24.a:0 "Young builders of socialism arise!"
YCA_domestic_events.25.t:0 "The Legend of Raimon Puig"
YCA_domestic_events.25.desc:0 ""In the bustling streets of Barcelona, Raimon Puig’s vision of a worker-led revolution has ignited a wave of fervent enthusiasm. Across the city’s textile mills and printing workshops, small groups of self-organized workers—soon dubbed ‘Puigite squads’—have taken it upon themselves to push production to unprecedented levels. Assembly halls echo with chants of solidarity and the promise of collective liberation. Posters bearing the Puigite emblem adorn factory walls, proclaiming that the revolution’s strength lies in the hands of the many, not the few. Workers labor not for individual reward, but for the community and the revolutionary cause. Reports from the workshops describe extraordinary feats of ingenuity and collaboration: machines running at full capacity, logistical bottlenecks solved collectively, and morale higher than ever before. The Puigite spirit is spreading, and the factories of Catalonia are beginning to outshine anything the old capitalist system could produce."
YCA_domestic_events.25.a:0 "The workers’ hands build the world"

