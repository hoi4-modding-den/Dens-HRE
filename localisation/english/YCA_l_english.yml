### IDEAS/NATIONAL SPIRITS ###
YCA_vanguard_of_the_revolution:0 "Vanguard of the Revolution"
YCA_vanguard_of_the_revolution_desc:0 "Catalonia stands as the radical left beacon of the Mediterranean following the Iberian collapse. With the peninsula simmering with unrest, the Vanguardists aspire to ignite a wider revolution, spreading their ideals beyond Catalan lands and reshaping the future of Iberia."
YCA_splintered_generalitat:0 "The Splintered Generalitat"
YCA_splintered_generalitat_desc:0 "The Catalan left is fractured, divided between Vanguardists, Anarcho-Syndicalists, and Revolutionary Socialists. While a tenuous alliance holds for now, each faction jostles for influence, and tensions threaten to erupt. In the long term, a daring experiment in pluralist governance might reshape the political landscape entirely."
YCA_workers_militias:0 "Workers’ Militias"
YCA_workers_militias_desc:0 "Mobilized at a moment’s notice, the workers’ militias embody the people’s determination to defend the revolution. Armed and resolute, they are a living symbol of ordinary citizens standing united to protect their ideals and their communities."
YCA_workers_militias_1:0 "Workers’ Militias"
YCA_workers_militias_desc_1:0 "Mobilized at a moment’s notice, the workers’ militias embody the people’s determination to defend the revolution. Armed and resolute, they are a living symbol of ordinary citizens standing united to protect their ideals and their communities."
YCA_workers_militias_2:0 "Workers’ Militias"
YCA_workers_militias_desc_2:0 "Mobilized at a moment’s notice, the workers’ militias embody the people’s determination to defend the revolution. Armed and resolute, they are a living symbol of ordinary citizens standing united to protect their ideals and their communities."
YCA_red_trade_unions:0 "Red Trade Unions"
YCA_red_trade_unions_desc:0 "As Catalonia asserts its independence, trade unions and syndicates gain unprecedented influence, becoming the backbone of the emerging society. They work tirelessly to organize labor, defend workers’ rights, and ensure that the revolution benefits all. Through collective action, mutual aid, and solidarity, these unions aim to reshape the economy and social order, laying the foundations for a fairer, more equitable nation where the people themselves hold the power to build their future."
YCA_anarchist_society:0 "Anarchist Society"
YCA_anarchist_society_desc:0 "In the Free Territory of Lower Aragon, the Union of Anarchist Collectives guides a society built on cooperation, self-management, and voluntary association. Communities govern themselves through councils and assemblies, making decisions collectively and ensuring that every voice is heard. Daily life is shaped by mutual aid, shared responsibility, and a commitment to individual freedom balanced with communal solidarity. This unique experiment in anarchist governance demonstrates the potential of a society free from centralized authority, where people work together to create a just and sustainable way of life, defending their ideals against external threats while cultivating a culture of autonomy and cooperation."
