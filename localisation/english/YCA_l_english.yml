YCA_flota_del_pueblo_idea_crews_desc:0 "Born out of necessity and guided by revolutionary determination, the Flota del Pueblo is the maritime shield of the Catalan people. Crewed by workers, fishermen, and volunteers loyal to the cause, this fleet symbolizes popular resistance against reactionary forces. Though resources are limited, its spirit lies not in grandeur, but in the resolve of the people who take to the seas in defense of the Revolution."
YCA_the_aero_maritime_complex_idea:0 "The Aero-Maritime Complex"
YCA_the_aero_maritime_complex_idea_desc:0 ""
YCA_national_planning_commission:0 "Comisión Nacional de Planificación"
YCA_national_planning_commission_desc:0 "To guide the economic future of Catalonia, the Comisión Nacional de Planificación has been established as a central body tasked with overseeing industrial development, construction priorities, and the allocation of scarce resources. By coordinating production across regions and sectors, it seeks to balance the needs of the revolution with the long-term goal of prosperity and independence."
YCA_popular_planification_committee:0 "Comité de Planificación Popular"
YCA_popular_planification_committee_desc:0 "To guide the economic future of Catalonia, the Comité de Planificación Popular has been established as a central body tasked with overseeing industrial development, construction priorities, and the allocation of scarce resources. By coordinating production across regions and sectors, it seeks to balance the needs of the revolution with the long-term goal of prosperity and independence."
YCA_catalan_complan:0 "The Catalan ComPlan"
YCA_catalan_complan_desc:0 "To guide the economic future of Catalonia, the The Catalan ComPlan has been formalized as a central body tasked with overseeing industrial development, construction priorities, and the allocation of scarce resources. By coordinating production across regions and sectors, it seeks to balance the needs of the revolution with the long-term goal of prosperity and independence."
YCA_banc_de_barcelona_communalized:0 "Banc de Barcelona Communalized"
YCA_banc_de_barcelona_communalized_desc:0 "The once-private Banc de Barcelona has been seized and reorganized under communal management. Its vaults and ledgers no longer serve the profit of a few, but instead provide credit, liquidity, and financial coordination for the workers’ collectives and the new revolutionary economy. While efficiency may suffer under ideological oversight, the integration of finance into the socialized order ensures capital flows to those most in need of it—factories, cooperatives, and communal farms."
YCA_catalan_complan_labor:0 "The Catalan ComPlan"
YCA_catalan_complan_labor_desc:0 "To guide the economic future of Catalonia, the The Catalan ComPlan has been formalized as a central body tasked with overseeing industrial development, construction priorities, and the allocation of scarce resources. By coordinating production across regions and sectors, it seeks to balance the needs of the revolution with the long-term goal of prosperity and independence."
