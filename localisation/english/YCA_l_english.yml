YCA_directive_socialized_production_idea:0 "Directive: Socialized Production"
YCA_directive_socialized_production_idea_desc:0 "The Party orders an expansion of collective and state-owned enterprises to ensure production directly serves the people rather than private interests. This directive, once enacted, will permanently transform the economy into a socialist model of production."
YCA_directive_party_discipline_idea:0 "Directive: Party Discipline"
YCA_directive_party_discipline_idea_desc:0 "The Party issues strict orders enforcing cadre discipline, reaffirming the principle that the revolutionary vanguard must stand above factionalism and internal dissent. Through centralized command and political rigor, the Revolution shall remain unshaken."
YCA_revolutionary_zeal:0 "Revolutionary Zeal"
YCA_revolutionary_zeal_desc:0 "The Revolution has ignited a fire in the hearts of the masses. Volunteers stream into militias, workers labor tirelessly for the cause, and the people endure sacrifice with pride. Though discipline and efficiency may sometimes falter under the weight of enthusiasm, the unshakable belief in the revolutionary struggle drives the movement forward with unstoppable energy."
