 # DECISIONS #

 ZCT_government_decisions:0 "Government Decisions"
 ZCT_turkish_anarchy:0 "§RTurkish Anarchy§!"
 ZCT_turkish_anarchy_desc:0 "The collapse of the §7Ottoman Empire§! has been categorised by §Rtragedy after tragedy§!. For our people, the hardships introduced by this crisis have become merely a part of life. Despite this, we continue to fight for a brighter future for the §RTurkish§! people. §3Achieving our goal requires sacrifice, it requires courage and the resolve to continue despite facing failure again and again§!. As such, we have been forced to take drastic measures such as §Yemergency conscription§! and §Ywar time taxes§!.\n\nOur ability to enact these measures is represented by £emergency_powers_icon §Yemergency powers§!. We can spend our £emergency_powers_icon to get equipment, divisions, and temporary buffs.\n\nWe currently have £emergency_powers_icon §Y[?ZCT.emergency_powers]§!."
 ZCT_economic_depression:0 "Economic Depression"
 ZCT_economic_depression_desc:0 "The economic pressure from the collapse of the empire has forced our economy into a depression. Though Istanbul still stands as a the vibrant economic hub that stands at the gates of the Black Sea, our people suffer as uncertainty prevents new investment in our country. We must take action to illeviate the affects of this depression on our people, and ideally work towards rebuilding our economy."

