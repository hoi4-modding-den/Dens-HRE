l_english:
 ZCT_GATHERING_STORM_DESC:0 "The decline of the Ottoman Empire is not just attributed to the revolt on the fringes of its domain but also the rise of the Republican movement inside the heartland of the empire. Mustafa Kemal and his followers staged widespread uprisings centered around Istanbul but their onslaught was halted by the remnants of the Ottoman government. Without control of both Istanbul and Ankara, the legitimacy of the new Turkish Republic has not been solidified. Martial law has been called into effect across the Republic's territory in order to maintain control but the people grow weary. Economic ruin has largely devastated the Republic. The future is uncertain for Mustafa Kemal and his supporters but war seems unavoidable."

