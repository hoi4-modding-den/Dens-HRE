#Focus
  ZAR_The_Orthodox_Problem_Rears_Its_Head_Yet_Again: "The Orthodox Problem Rears It's Head"
  ZAR_The_Orthodox_Problem_Rears_Its_Head_Yet_Again_desc: "Following the Massacre in the Katoghike Church, Orthodox protests have errupted across the nation. If we are to stay in charge we need to deal with the Protests, and quickly."
  ZAR_Support_Religious_Leniancy: "Support Religious Leniancy"
  ZAR_Support_Religious_Leniancy_desc: "The Religious population of our nation has suffered much under our government, and the massacre has only prooven that. If we are to keep the nation happy we should be more pragmatic, allowing religious freedoms."
  ZAR_No_Compromise_No_Pragmatism: "No Compromise, No Pragmatism"
  ZAR_No_Compromise_No_Pragmatism_desc: "We cannot allow these rioters to change our policy, in fact this rabble has given us just the excuse to crackdown on religion, and getting the nation ready for the war to come. Religion is the opium of the people and an undue inefficency in our society."
  ZAR_Charents_Speech: "Charents' Speech"
  ZAR_Charents_Speech: "Our glorious Leader, Yeghishe Charents, is making a speech, for what the nation will head to next..."
#Events
  ZAR.1.t: "Massacre in Yerevan"
  ZAR.1.d: "In the past few days, Futurist Militias entered the Katoghike Church in The Capital. They ordered the Congregation to leave, and when they didn't comply the Militiamen fired upon the Congregation, wounding 9 and killing 7, including the Priest. This has sparked massive protests across the nation by Orthodox Christians, horrified and furious with the actions with the Milita force which our government supports. Unless we deal with it now, we will have problems to deal with. We can either support the actions of the Militias and use it as an excuse to crackdown on Religious activity, or we could stand with the protesters, and be more pragmatic in our policy."
  ZAR.1.a: "Fire on The Protesters, We Will Not Change Our Policy"
  ZAR.1.b: "Perhaps We Could Be More Leniant"
  ZAR.2.t: "Charnets Speech"
  ZAR.2.d: "On a rainy Wednesday, Charents made his speech. He called for unity in the nation against the foreign agressors, but more importantly, he stated the aims of the nation. To defeat the Turkish nations that plague the land and create a nation for all Armenians. He called for the population to get ready, and to prepare, for the fight to come..."
  ZAR.2.a: "Lets Get To It!"
  ZAR.3.t: "Steam and Smoke, Gears and Wheels"
  ZAR.3.d: "Far away- and near\nInside the mine pits,\nAt the factories,\nIn the wide steppes and in the forests -\nIn all locations, in all directions,\nMy brothers, thousands, who're lulled with the song\nOf iron and of bronze, of the soil and mines!\nWho possesses our will of fire today,\nOur blood-red power\nOur fervent fortune\nSo universal?\n\nWho has them today...?\nIt's us who are new, we're tens of thousands!\n\nLike an enormous disc made of iron\nThe brave will of our thousands of brothers,\nSo universal -\nWe have already thrown with immense force\nToward all the winds of the coming days,"
  ZAR.3.a: "Toward - the Future..."
  ZAR.4.t: "Time is of the Essence"
  ZAR.4.d: "If we are not quick, we will run out of time. The Turkish yoke who cling to the land like Parasites need to be defeated, and that will be impossible if we do not have the technology to keep them up. So we must make progress, quick and fast, to avenge our bretherin and achieve a better tomorrow for our people."
  ZAR.4.a: "Sacrifices Must Be Made"
  ZAR.5.t: "Art in The Planned Chaos of The Industrial World"
  ZAR.5.d: "Desc about art being found on factories and shit"
  ZAR.5.a: "Even in the most unexpected of places"
  ZAR.6.t: "Speed, Speed Where it counts"
  ZAR.6.d: "Desc about cars and speed"
  ZAR.6.a: "fuck if i know what to put as a description"
  ZAR.7.t: "The Problem of The Trabzon Occupation Zone"
  ZAR.7.d: "Description of problem of trabzon"
  ZAR.7.a: "Quite the problem"
  ZAR.8.t: "From The Mountains to The Sea"
  ZAR.8.d: "Flavour Event (poem by charnets)"
  ZAR.8.a: "last line"
  ZAR.9.t: "While The Iron is Hot"
  ZAR.9.d: "The Time is now desc"
  ZAR.9.a: "Fight! Fight! Fight!"
#Bookmarks
  ZAR_GATHERING_STORM_DESC: "The Armenian poet and futurist, Yeghishe Charents, horrified by the genocide committed against his people by the Ottomans, took it upon himself to make Armenia great, and avenge his people. Soon the Armenian jackboots will march through Instanbul, and we will be avenged..."
