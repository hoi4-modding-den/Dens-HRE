#Events
  ZAR.1.t: "Massacre in Yerevan"
  ZAR.1.d: "Desc About Massacre of Congregation at Katoghike Church in Yerevan. Then Protests against... In the past few days, Futurist Militias entered the Katoghike Church in The Capital. They ordered the Congregation to leave, and when they didn't comply the Militiamen fired upon the Congregation, wounding 9 and killing 7, including the Priest. This has sparked massive protests across the nation by Orthodox Christians, horrified and furious with the actions with the Milita force which our government supports. Unless we deal with it now, we will have problems to deal with. We can either support the actions of the Militias and use it as an excuse to crackdown on Religious activity, or we could stand with the protesters, and be more pragmatic in our policy."
  ZAR.1.a: "Fire on The Protesters, We Will Not Change Our Policy"
  ZAR.1.b: "Perhaps We Could Be More Leniant"
  ZAR.2.d: "On a rainy Wednesday, Charents made his speech. He called for unity in the nation against the foreign agressors, but more importantly, he stated the aims of the nation. To defeat the Turkish nations that plague the land and create a nation for all Armenians. He called for the population to get ready, and to prepare, for the fight to come..."
  ZAR.2.t: "Charnets Speech"
  ZAR.2.a: "Lets Get To It!"
#Bookmarks
  ZAR_GATHERING_STORM_DESC: "The Armenian poet and futurist, Yeghishe Charents, horrified by the genocide committed against his people by the Ottomans, took it upon himself to make Armenia great, and avenge his people. Soon the Armenian jackboots will march through Instanbul, and we will be avenged..."
