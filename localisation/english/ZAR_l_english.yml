#Ideologies
  futurism: "Futurism"
  futurism_desc: "Futurism was originally an artist and social movement, celebrating violence, speed, technology, dynamism and industrial objects. However it has become a political movement recently, especially within Armenia. It has little exact ideological standpoints as some strains are communist, some fascist, and some somewhere inbetween. But it is a radical ideology, utilising nationalism, authoritarianism and creative freedoms."
