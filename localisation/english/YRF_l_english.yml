 #Leader Descriptions
 YRF_KING_JUAN_I_DESC:0 "§R'Am I one of the good guys? Or am I just a mere fool, who may soon fail to protect his people.'§!\n\nKing Juan I, a poor man who ages more faster than milk. As King Juan rules over Murcia not with just an iron fist and cruelty, he leads with something more different. He wants his subjects to feel as if the duties of the king is to protect the people. As a young one, his parents never liked him. They saw him as an insignificant 'enlightened' fool. And that hurt. When he outlived his brothers and sisters, he didn't wish to be king. But somebody had to take the crown. And Juan was the only man available. Set to be crowned as 'Juan I'.\n\nAs the Iberian Peninsula fell to pieces, and it horrified him of the chaos that would begin around him. He organized his loyal army, in order to protect Murcia, to safeguard it from the external threats.\n\nFor now, he rules over Murcia, with threats from both the inside and outside. Will he be able to save Murcia from it all?"
 YRF_LEAH_AVIV_DESC:0 "§BThe Iron Lady of Murcia§! As the head of the Conservative Front, Leah Aviv has gotten a name for herself, as her original career started off with her attempting to repel all forms of Communism from Murcia, being the representative whilst the men all fight. This also includes her harsh stances on internal and external politics. Primarily criticizing King Juan for his inability to do anything about Iberia's downfall, seeing it as a sign of weakness to shelter themselves in Murcia. It'd be better off expanding, crushing the rabid Communists, and traitors that surround Murcia. For now, Leah Aviv can only say and do much, she isn't in power yet. But her ambition is firm and already set in stone. Will she be able to achieve her goals? Or will she just continue to be a harsh-mouthed politician?"
 YRF_PEDRO_RICO_DESC:0 "Pedro Rico, the former Mayor of Madrid from 1931 to 1934, and during that time of him being mayor he grew more and more tolerant towards the Communists, being a potential sympathizer. After the Asturian miners' strike, his removal from power angered him. leading him to lead a force of his loyalists to Murcia, where they plan to ride out the chaos and attempt to form a kind of agreement with other Communists that dominate Eastern Spain. But for now, his struggle to power is going to be really hard, due to the efforts of HRE Volunteers and Nationalists within' Murcia."
