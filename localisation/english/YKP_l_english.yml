 ### EVENTS ###

 YKP.1.t:0 "King Manuel II assassinated!"
 YKP.1.desc:0 "The king has been assassinated by communist guerillas on the Rua Augusta in Lisbon! He was walking with his escort down the famous walkway to connect with his people and give charity to the soup kitchen that had been erected. A small skirmish erupted between the guerillas and the king's guards and though our men fought valiantly, Manuel II was killed before the insurgents could be defeated. Eight of our men lay dead in the capital now."
 YKP.1.a:0 "We will never forget."

