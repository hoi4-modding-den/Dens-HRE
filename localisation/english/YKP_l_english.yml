 YKP_intro_loc:0 "The rebirth of the §2Kingdom of Portugal§! in 1933 was not born out of triumph, but out of collapse. The economic crises of the early 1930s shattered the §YIberian Union§! as industrial relief efforts prioritised Spanish cities over their Portuguese counterparts. As §YMadrid§!'s grip loosened, §Gmonarchist supporters§! based in §YLisbon§! took the chance to re-establish the monarchy under §YKing Manuel II§!, returning from years of exile in London to guide his fractured nation. Yet, §2Portugal§! was not to be reborn without §Rblood§!.\n\nThe economic hardships soon ignited unrest at home. On January 18th 1934, the §RPortuguese General Strike§! paralyzed industry and exposed the deep fractures in the nation's society. §RCommunist organizers§! rallied the disillusioned, and the kingdom found itself facing §Rrebellion§! across the northern region of §YPorto§!. §RSocialist forces overran the ill-prepared monarchist garrisons across Portugal§!. §YManuel II§! rallied §Gloyalist forces§! against the §Rrebellion§! and a brief but brutal conflict was fought between the two factions. An attempt to retake the city of §YViseu§! from the §Rcommunists§! saw a ceasefire negotated as §Groyal forces§! were encircled by §Rcommunist troops§! using superior knowledge of local terrain, effectively crushing any hope of a swift royalist victory.\n\n§YKing Manuel II§! now guides a fractured Portugal through §Reconomic turmoil§!, §Rviolence§!, and §Rpolitical turmoil§!. The military remains in disarray as the defeat at §YViseu§! continues to remind the people that §Rthe kingdom is not invincible§!. §2Yet, there is hope§!. There is hope to rally the people to fight for a better future. There is hope for Portugal to rebuild. §2Through blood and fire the Portuguese people will endure.§!"
 YKP_credits:0 "§YCredits§!\nKingdom of Portugal Content: §HMilessmiles1§!\nIntro GUI: §HKåsastul§!\nEverything else: §HHoi4 Modding Den Discord§!"
