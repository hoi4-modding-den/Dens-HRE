 YKP_news.1.t:0 "King Manuel II of Portugal Assassinated!"
 YKP_news.1.desc:0 "Lisbon reports that Manuel II has been assassinated by communist partisans from the Porto region. His escort was intercepted while walking down Rua Augusta and a small skirmish ensued leaving eight dead including the portuguese monarch. The Kingdom of Portugal has expressed its outrage and has assured the communists in control of the north of the country that there will be severe consequences. The northern revolutionaries deny involvement in the assassination. The kingdom is now led by General Carmona in a provisional government until a new monarch can be selected."
 YKP_news.1.a:0 "A tragedy for the Portuguese..."
 YKP_news.1.b:0 "Authoritarian swine."
 YKP_news.1.c:0 "Tragedy strikes us once more."


