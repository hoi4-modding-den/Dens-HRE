ZIR_GATHERING_STORM_DESC: "The Anglo-Iranian Oil Company, otherwise known as British Petroleum or BP, is an oil monopoly in Iran. For decades, it gathered immense profits for the United Kingdom from oil sales. After the collapse of the Ottoman Empire and Iran, the company decided to declare independence to avoid following regulations and obtain unrestricted profits. However, the oil markets have crashed due to the instability of the region and strikes among the workers of the company have sprung up in every city."

