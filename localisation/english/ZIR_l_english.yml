ZIR_economy_in_shambles_desc:  "The oil market, and thus the Anglo-Iranian Oil Company's economy, has collapsed due to the unstable situation in the Middle East."

ZIR_major_strikes: "Major strikes"
ZIR_major_strikes_desc: "Unkept promises from an agreement in 1933 with the previous Shah have led to Iranian workers organizing into labor unions, which have now gone on strike until the promises are met."

# Events
ZIR_event.1.t: "Alone in the desert"
ZIR_event.1.d: "The Anglo-Iranian Oil Company holds control over a vast amount of Iran's oil reserves. Over the course of its existence, it has experienced non-stop success. The fall of the Ottoman Empire and the subsequent collapse of Iran gave the company the perfect opportunity to seize economic freedom by declaring independence from the British, becoming free of regulations which have held the profits back.\n\nShortly thereafter, the oil market crashed. Instability in the middle east was driving off investors, leaving the Anglo-Iranian Oil Company stranded. Then, the strikes came. Previous promises made with the Shav in 1933 went unkept, which caused the Iranian people to begin organizing into labor unions. Many workers can't be paid due to the troubled times, so the unions have begun striking until they receive their pay on top of the fulfillment previous promises.\n\nUntil these problems are solved, the company will have a rough time making profit."
ZIR_event.1.a: "These are terrible times for oil barons"

