# EVENTS

 ZKR_politics_events.1.t: "Mahmud Barzanji disbands Parliament"
 ZKR_politics_events.1.desc: "With Parliament falling out of favour with the common Kurds, Mahmud Barzanji has rallied his volunteer militia and his contacts in the military to orchestrate a coup against the elected government. With him only recently appointed Commander of the People's Gendarmerie of Kurdistan, he has managed to force Premier Riza to step down and hand over power to him."
 ZKR_politics_events.1.a: "Long live King Mahmud Barzanji!"

 ZKR_politics_events.2.t: "Restoration of the Military Directorate"
 ZKR_politics_events.2.desc: "With Parliament becoming rapidly more unpopular with the Ultranationalists, the Xoybûn Military Committee has rallied around Ihsan Nuri to disband the Parliament and restore the military directorate of the Ararat Republic."
 ZKR_politics_events.2.a: "We shall lead Kurdistan to Greatness!"

 ZKR_politics_events.3.t: "Elections!"
 ZKR_politics_events.3.desc: "Despite many challenges, the Republic of Kurdistan endures and elections are once again being held."
 ZKR_politics_events.3.a: "Seyid Riza is reelected."
 ZKR_politics_events.3.b: "Ahmed Barzani is nominated for PAR leadership."
 ZKR_politics_events.3.c: "The PŞK and Qazi Muhamad win!"

 ZKR_politics_events.4.t: "Bi-Annual [ROOT.GetAdjective] Elections"
 ZKR_politics_events.4.desc: "It's that time of the second year again. Elections are being held in [ROOT.GetNameDef]!"
 ZKR_politics_events.4.a: "Seyid Riza has the mandate."
 ZKR_politics_events.4.b: "Ahmed Barzani is victorious!"
 ZKR_politics_events.4.c: "Haji Baba Sheikh and the PIKI win!"

 ZKR_politics_events.5.t: "Cracks in the Alliance"
 ZKR_politics_events.5.desc: "The ruling coalition Alliance for Kurdistan has begun to show disharmony with the recent passing of the controversial 'Decree for the Centralisation of Government Bureaucracy'. Especially the left-wing PŞK under leadership of the Trotskyist Qazi Muhamad have started to question the words of the leaders of the democratic establishment, reducing the already low public trust of the coalition. If the situation deterioates even further, Kurdistan may face a constitutional crisis or possibly a coup from the anti-democratic or ultranationalist elements in the nation."
 ZKR_politics_events.5.a: "Democracy must endure..."

 ZKR_politics_events.6.t: "Resistance against the Commonwealth"
 ZKR_politics_events.6.desc: "Rural elements across our nation have begun to resist our advancements, both out of xenophobia and out of traditionalist sentiment. While the Commonwealth Parliament is hard at work to bring peace and progress to the Middle East, the people within it are more concerned what will happen to them."
 ZKR_politics_events.6.a: "They won't be able to live in the past forever."

 ZKR_politics_events.7.t: "Reformation of the Front"
 ZKR_politics_events.7.desc: "WIP"
 ZKR_politics_events.7.a: "We shall evolve the Front!"
 ZKR_politics_events.7.b: "Peace and Democracy must be protected!"
 ZKR_politics_events.7.c: "Call up Trotsky, we're doing more Communism!"
 ZKR_politics_events.7.tt: "We will lose all §Ynon-[ROOT.GetRulingIdeology]§! allies."

 ZKR_politics_events.8.t: "[FROM.GetNameDefCap] reforms the Front"
 ZKR_politics_events.8.desc: "The [FROM.GetRulingIdeology] [FROM.GetAdjective] Government has decided to reform the Anti-Imperialist Front and remove us due to our now incompatible government form."
 ZKR_politics_events.8.a: "Pah. Those 'revolutionaries' will be the death of the all."
 ZKR_politics_events.8.b: "We will find other allies."

 ZKR_politics_events.9.t: "Preaching Peace and Waging War"
 ZKR_politics_events.9.desc: "The public has begun questioning our ongoing war of aggression, especially in light of our previously loudly proclaimed efforts to bring peace to our region."
 ZKR_politics_events.9.a: "Sometimes, you need to wage war to bring peace."

 ZKR_politics_events.10.t: "We are One"
 ZKR_politics_events.10.desc: "The Middle East stand more united than ever before. The [ROOT.GetRulingIdeology] government of [ROOT.GetNameDef] has achieved things in the region that once no one thought possible."
 ZKR_politics_events.10.a: "The universe speaks in many languages, but only one voice."

 ZKR_diplo_events.1.t: "[FROM.GetNameDefCap] sends Aid"
 ZKR_diplo_events.1.desc: "Following correspondence between [ROOT.GetLeader] and the [FROM.GetAdjective] embassy, [FROM.GetNameDef] has decided to assist us in the civil war with arms shipments directly from [FROM.Capital.GetCapitalVictoryPointName]."
 ZKR_diplo_events.1.a: "We thank our [FROM.GetAdjective] brothers!"
 ZKR_diplo_events.1.tt: "Deploy §gTwo§! §YVolunteer Divisions§! in §Y[ROOT.capital.GetCapitalVictoryPointName]§!."

 ZKR_diplo_events.2.t: "[FROM.GetNameDefCap] requests Qamishli for Assistance"
 ZKR_diplo_events.2.desc: "WIP"
 ZKR_diplo_events.2.a: "It is a fair deal."
 ZKR_diplo_events.2.b: "It is rightful Syrian land!"

 ZKR_diplo_events.3.t: "[FROM.GetAdjective] Troops leave Qamishli"
 ZKR_diplo_events.3.desc: "WIP"
 ZKR_diplo_events.3.a: "Welcome home!"

 ZKR_diplo_events.4.t: "[FROM.GetNameDef] holds onto Qamishli"
 ZKR_diplo_events.4.desc: "WIP"
 ZKR_diplo_events.4.a: "They'll pay for this!"

 ZKR_diplo_events.5.t: "[FROM.GetAdjective] Appeal to the League of Nations"
 ZKR_diplo_events.5.desc: "WIP"
 ZKR_diplo_events.5.a: "They have our support."

 ZKR_diplo_events.6.t: "The Traitors in Mahabad"
 ZKR_diplo_events.6.desc: "Shortly before our victorious uprising in Ararat, the Kurds living Persia began their own rebellion against their oppressors. Following Haji Baba Sheikh, they took up arms against the Persians in an effort to become free. But as their conflict went on, their spirit weakened.\n \nA few months after we successfully expelled the Ottomans, the Mahabad rebels also declared their victory. But it was a lie. Instead of liberating the Kurdish people, they made peace with their oppressors and turned against their fellow Kurds.\n \nNow this ''Kurdish-Iranian Federation'' lies east of our border, claiming to be the true Kurdistan. This will not stand and their traitorous nature will be laid bare for all to see."
 ZKR_diplo_events.6.a: "They'll never see it coming."

 ZKR_diplo_events.7.t: "Suspicious Preparations on the Western Border!"
 ZKR_diplo_events.7.desc: "Reports from scouting parties along the border to ''Kurdistan'' have reported an increased build-up of divisions. High command fears that the nationalists in Amed plan to strike our innocent federation down for the crime of existence."
 ZKR_diplo_events.7.a: "We will weather this oncoming storm!"
 ZKR_diplo_events.7.tt: "§Y[FROM.GetNameWithFlag]§! will attack in §R120 Days§!!"

 ZKR_diplo_events.8.t: "[FROM.GetNameDefCap] offers [FROM.GetFactionName] Membership"
 ZKR_diplo_events.8.desc: "WIP"
 ZKR_diplo_events.8.a: "Our efforts combined will bring about victory."
 ZKR_diplo_events.8.b: "We accept their proposal."
 ZKR_diplo_events.8.c: "Our current goals do not align with theirs."
 ZKR_diplo_events.8.d: "They are an ill omen."

 ZKR_diplo_events.9.t: "[FROM.GetNameDefCap] joins the [ROOT.GetFactionName]"
 ZKR_diplo_events.9.desc: "WIP"
 ZKR_diplo_events.9.a: "We seek not a conflict, but a restoration of balance, of justice."

 ZKR_diplo_events.10.t: "[FROM.GetNameDefCap] joins the [ROOT.GetFactionName]"
 ZKR_diplo_events.10.desc: "WIP"
 ZKR_diplo_events.10.a: "Another ally in our war against Imperialism!"

 ZKR_diplo_events.11.t: "[FROM.GetNameDefCap] rejects our invitation"
 ZKR_diplo_events.11.desc: "WIP"
 ZKR_diplo_events.11.a: "They don't see it, do they?"

 ZKR_technical_events.1.t: "The Liberation of Palestine"
 ZKR_technical_events.1.desc: "The British bastion in the Levant, the colonial administration in Palestine, has finally been vanquished. The last British boots on our part of the sub-continent have been driven out and our people shall finally be free from their tyranny."
 ZKR_technical_events.1.a: "Forever free! Forevermore!"

 ZKR_technical_events.2.t: "The Liberation of Cyprus"
 ZKR_technical_events.2.desc: "The British bastion on the island of Cyprus has been expelled. With their ports captured and their boats burned, it will take a long time until the Empire can reach into our lands again."
 ZKR_technical_events.2.a: "Another Victory for [ROOT.GetLeader]!"

 ZKR_technical_events.3.t: "The End of Iranian Exploitation"
 ZKR_technical_events.3.desc: "The British economic hold over Iran will soon crumble with their corporate zone in Hamedan expelled."
 ZKR_technical_events.3.a: "The British Fiends shall cower before our might!"

 ZKR_technical_events.4.t: "[FROM.GetNameDefCap] requests Kurdish Territories"
 ZKR_technical_events.4.desc: "As part of the Kurdish Unification Initiative, the [FROM.GetAdjective] government has approached us with the request to hand over all of our territories inhabited by Kurdish tribes. Our diplomats are not certain if they might abandon our alliance should we refuse."
 ZKR_technical_events.4.a: "We cannot risk our alliance over this."
 ZKR_technical_events.4.b: "These lands are [ROOT.GetAdjective], not Kurdish!"

 ZKR_technical_events.5.t: "[FROM.GetNameDefCap] transfers Kurdish Lands"
 ZKR_technical_events.5.desc: "The [FROM.GetAdjective] government has acquiesced to our demands and handed over all Kurdish territories under their control."
 ZKR_technical_events.5.a: "Long live Diplomacy!"

 ZKR_technical_events.6.t: "[FROM.GetNameDefCap] rejects our Demands!"
 ZKR_technical_events.6.desc: "Despite our ernest request, the [FROM.GetAdjective] government has refused to hand over their Kurdish lands."
 ZKR_technical_events.6.a: "We must liberate the oppressed masses!"
 ZKR_technical_events.6.b: "Nothing we can do, they are our allies after all."

 ZKR_technical_events.7.t: "Integration into [FROM.GetNameDef]?"
 ZKR_technical_events.7.desc: "The [FROM.GetAdjective] diplomatic envoy has handed over a proposal that if accepted would see us fully integrated into [FROM.GetNameDef]. Their government cites the fact that most of our lands are inhabited by Kurds as the reason this proposal was sent."
 ZKR_technical_events.7.a: "We are Kurds too!"
 ZKR_technical_events.7.b: "Pah, we're better than them."

 ZKR_technical_events.8.t: "[FROM.GetNameDefCap] accepts Integration into [ROOT.GetNameDef]"
 ZKR_technical_events.8.desc: "Our efforts have been fruitful and the [FROM.GetAdjective] government has accepted our proposal to be integrated into Kurdistan."
 ZKR_technical_events.8.a: "Long live Diplomacy!"

 ZKR_technical_events.9.t: "[FROM.GetNameDefCap] rejects Integration!"
 ZKR_technical_events.9.desc: "Despite our best efforts, the [FROM.GetAdjective] government remains stubborn and refuses to allow itself to be integrated into Kurdistan."
 ZKR_technical_events.9.a: "We shall save them. From themselves!"
 ZKR_technical_events.9.b: "They have the right to self-determination. For now."

 ZKR_technical_events.10.t: "Fate of the Mahabad Government"
 ZKR_technical_events.10.desc: "With the defeat of [ZRM.GetNameDef] and the capture of their leadership, we must make a decision on how to move forwards with the situation. While most nationalist elements have called for the execution of the Mahabad leadership, there have been even more voices demanding mercy for Haji Baba Sheikh, especially because of his religious position."
 ZKR_technical_events.10.a: "Hang the Traitors."
 ZKR_technical_events.10.b: "We cannot simply execute them all."

 ZKR_technical_events.11.t: "[FROM.GetNameDefCap] proposes Membership in the $ZKR_west_asia_tech_sharing_group_name$"
 ZKR_technical_events.11.desc: "WIP"
 ZKR_technical_events.11.a: "Scientific progress is best achieved together."
 ZKR_technical_events.11.b: "We can't risk the enemy getting hands on our stuff!"

 ZKR_technical_events.12.t: "[FROM.GetNameDefCap] joins the $ZKR_west_asia_tech_sharing_group_name$"
 ZKR_technical_events.12.desc: "WIP"
 ZKR_technical_events.12.a: "Wonderful."

 ZKR_technical_events.13.t: "[FROM.GetNameDefCap] invites us to the $ZKR_pre_commonwealth_1$"
 ZKR_technical_events.13.desc: "WIP"
 ZKR_technical_events.13.a: "This will benefit the economy."
 ZKR_technical_events.13.b: "We need to protect our business interests."

 ZKR_technical_events.14.t: "[FROM.GetNameDefCap] joins the $ZKR_pre_commonwealth_1$"
 ZKR_technical_events.14.desc: "WIP"
 ZKR_technical_events.14.a: "Wonderful."

 ZKR_technical_events.15.t: "[FROM.GetNameDefCap] offers Free Travel Zone"
 ZKR_technical_events.15.desc: "WIP"
 ZKR_technical_events.15.a: "How nice."
 ZKR_technical_events.15.b: "They just want to undermine us!"

 ZKR_technical_events.16.t: "[FROM.GetNameDefCap] enters our Free Travel Zone"
 ZKR_technical_events.16.desc: "WIP"
 ZKR_technical_events.16.a: "Wonderful."

 ZKR_technical_events.17.t: "[FROM.GetNameDefCap] invites us to the $ZKR_pre_commonwealth_3$"
 ZKR_technical_events.17.desc: "WIP"
 ZKR_technical_events.17.a: "The more cooperation, the better."
 ZKR_technical_events.17.b: "Nope."

 ZKR_technical_events.18.t: "[FROM.GetNameDefCap] joins the $ZKR_pre_commonwealth_3$"
 ZKR_technical_events.18.desc: "WIP"
