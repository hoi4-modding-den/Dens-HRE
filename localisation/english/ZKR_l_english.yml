# INTRO LORE

 ZKR_GATHERING_STORM_DESC: "The Republic of Kurdistan was officially proclaimed following the successful 1930 Kurdish rebellion ending with the Xoybûn-led Republic of Ararat declaring victory against Ottoman forces. Since then, the Xoybûn military junta has stepped down and allowed the formation of a Kurdish parliament and a democratic republic. But fragile peace rarely lasts and Kurdish democracy is at a breaking point."

 ZKR_intro_loc: "§LThe Republic of Kurdistan was officially proclaimed following the successful §Y1930 Kurdish rebellion§! ending with the Xoybûn-led Republic of Ararat declaring victory against Ottoman forces. Since then, the §FXoybûn§! military junta has stepped down and allowed the formation of a Kurdish parliament and a §2democratic republic§!. But fragile peace rarely lasts and Kurdish democracy is at a breaking point.\n \nWhile the §2Alliance fo§!§rr Kurdistan§! holds the majority in parliament, the coalition itself is divided between the §YIrridentists§! who wish to unite the Kurdish homelands and the so-called §YInternationalists§! who want to preserve the republic and foster multilateral cooperation within the region.\n \nAll the while, the armed forces face a similar struggle between the §FXoybûn Military Committee§! and the §gBarzani Clique§!, a group of officers that want to restore the short-lived §YKingdom of Kurdistan§! under King Barzani.§!\n \n§YPossible Paths for Kurdistan:§!\n§g  - Unite the Middle East\n  - Salvation for Kurdistan\n  - Restoration of the Kingdom§!\n \n§YAchievements:§!§g\n[ZKR_achievements_intro_gui_1]\n [ZKR_achievements_intro_gui_2]\n [ZKR_achievements_intro_gui_3]\n [ZKR_achievements_intro_gui_4]\n "
 ZKR_credits: "Kurdistan Content: §H0rland0§!\nIntro GUI: §HKåsastul§!\nEverything else: §HHoi4 Modding Den Discord§!"
 ZKR_open_welcome_tooltip: "Open §YWelcome Screen§!"
 ZKR_continue_tooltip: "§CInto an uncertain future...§!"

