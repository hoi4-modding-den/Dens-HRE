 ZKR_an_independent_kurdistan: "Kurdish Fervour"
 ZKR_an_independent_kurdistan_desc: "The Republic of Kurdistan was officially proclaimed following the successful 1930 Kurdish rebellion ending with the Xoybûn-led Republic of Ararat declaring victory against Ottoman forces. Since then, the Xoybûn military junta has stepped down and allowed the formation of a Kurdish parliament and a democratic republic."
 ZKR_liberal_versus_communist: "Alliance for Kurdistan"
 ZKR_liberal_versus_communist_desc: "The Kurdish Parliament is split among those that want to achieve Greater Kurdistan and those that seek to maintain Kurdish self-determination and help other ethnicities in the Middle East do the same. The Xoybûn maintains neutrality in this internal conflict, though some members are advocating for the restoration of the military government to achieve Kurdish unification."
