# IDEOLOGIES

 ZKR_kurdish_ultranationalism: "Kurdish Ultranationalism"
 ZKR_kurdish_ultranationalism_desc: "Expanding upon the ideas of Kurdish Nationalism and Irridentism, Kurdish Ultranationalism advocates for the destruction of all states that oppose the full unification of the Kurdish people. Some of its followers also advocate for the total destruction of any people that previously oppressed the Kurds in their nation, especially focusing on the cruel treatment by the Turks under the Ottoman government."
 ZKR_die_gruenen: "Green Politics"
 ZKR_die_gruenen_desc: "Green politics, or ecopolitics, is a political ideology that aims to foster an ecologically sustainable society often, but not always, rooted in environmentalism, nonviolence, social justice and grassroots democracy."


