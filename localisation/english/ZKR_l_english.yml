 ZKR_technical_events.1.t: "Another Victory for [ROOT.GetLeader]"
 ZKR_technical_events.1.desc: "The last British bastion in the middle east, the colonial administration in Palestine, has finally been vanquished. The last British boots on our part of the sub-continent have been driven out and our people shall finally be free from their tyranny."
 ZKR_technical_events.1.a: "Forever free! Forevermore!"
