 ZKR_technical_events.19.t: "[FROM.GetNameDefCap] proposes Association"
 ZKR_technical_events.19.desc: "WIP"
 ZKR_technical_events.19.a: "For the common good." # get it? Because its a commonwealth?
 ZKR_technical_events.19.b: "We cannot give up our diplomatic powers!"

 ZKR_technical_events.20.t: "[FROM.GetNameDefCap] accepts Association"
 ZKR_technical_events.20.desc: "WIP"
 ZKR_technical_events.20.a: "United we stand!"

 ZKR_technical_events.21.t: "Offer of Full Membership in the Commonwealth"
 ZKR_technical_events.21.desc: "WIP"
 ZKR_technical_events.21.a: "Towards a better future for the Middle East!"
 ZKR_technical_events.21.b: "We cannot surrender our Sovereignty!"

 ZKR_technical_events.22.t: "[FROM.GetNameDefCap] becomes Commonwealth Member"
 ZKR_technical_events.22.desc: "WIP"
 ZKR_technical_events.22.a: "Welcome, Brothers and Sisters!"

 ZKR_technical_events.23.t: "[FROM.GetNameDefCap] rejects our proposal"
 ZKR_technical_events.23.desc: "WIP"
 ZKR_technical_events.23.a: "Don't they see it would benefit both of us?"
 ZKR_technical_events.23.tt: "We will be able to try again in §Y140 days§!."

 ZKR_technical_events.24.t: "[ROOT.GetLeader] calls out Oppression of Kurds in [FROM.GetNameDef]"
 ZKR_technical_events.24.desc: "'The Kurdish people have long enough been passive in the face of oppression, but no longer! The imperialists of [FROM.GetNameDef] wish to see us beneath their boots, but we will not stand for it! Any state that stands against the Kurds will see its downfall. First the Ottomans, now the [FROM.GetAdjective] threat!'\n \n[ROOT.GetLeader] has rallied the Kurds behind him to justify his invasion of [FROM.GetNameDef], but the decision still lies with the people."
 ZKR_technical_events.24.a: "All Kurds will be free!"

 ZKR_technical_events.25.t: "[FROM.GetLeader] calls out Oppression of Kurds in [ROOT.GetNameDef]"
 ZKR_technical_events.25.desc: "'The Kurdish people have long enough been passive in the face of oppression, but no longer! The imperialists of [ROOT.GetNameDef] wish to see us beneath their boots, but we will not stand for it! Any state that stands against the Kurds will see its downfall. First the Ottomans, now the [ROOT.GetAdjective] threat!'\n \n[FROM.GetLeader] has rallied the Kurds behind him to justify his invasion of [ROOT.GetNameDef], but the decision still lies with the people."
 ZKR_technical_events.25.a: "It was an inevitability."

 ZKR_lore_events.1.t: "The Calling"
 ZKR_lore_events.1.desc: "While not a very popular move, the establishment of the Kurdish Academy will assist in formulating and preserving the Kurdish language. The simple fact that the Kurdish language is so divided between dialects to the point of mutual unintelligibility is point enough to warrant the establishment of a unified language authority. The people may continue to speak with dialect, but at least in writing the Kurdish language shall be unified. Kurdish linguist and creator of the Hawar Alphabet - which is already in use by most government offices - $ZKR_celadet_ali_bedirxan$ will be appointed president-curator of the academy and has already held a debate with other Kurdish intellectuals about the effectiveness of possible edicts."
 ZKR_lore_events.1.a: "Soon, every Kurd will be able to understand Kurdish."

 ZKR_lore_events.2.t: "Bad Copper Quality"
 ZKR_lore_events.2.desc: "The production at the Colemêrg Cartridge Factory has been disrupted by a scandal as supervisors inspecting the delivered copper noticed a lack of quality and immediately wrote a complaint to the merchant from Ur who had gotten the contract to provide it."
 ZKR_lore_events.2.a: "This will affect ammunition production."

 ZKR_lore_events.3.t: "Trotsky's Visit in [ROOT.capital.GetCapitalVictoryPointName]"
 ZKR_lore_events.3.desc: "Our government has had the honour of hosting a visit for the famous chairman of the Fourth International, Leon Trotsky.\n \nArriving earlier this week in Istanbul, he has made his way across our great nation to visit comrade Qazi Muhamad and congratulate him on his recent victories in the field of socialism. Though critical of Muhamad's practice of 'Pragmatic Trotskyism', the chairman seemed welcoming still, prefering to chat over future plans for socialism in the Middle East over small ideological debate.\n \nAs he departed, comrade Trotsky once again gave his support to comrade Muhamad."
 ZKR_lore_events.3.a: "And we are one step closer to world revolution."
 ZKR_trotsky_visited: "Trotsky has visited our capital"

 ZKR_lore_events.4.t: "Josef 'Stalin' Dzhugashvili arrested!"
 ZKR_lore_events.4.desc: "With the collapse of the [FROM.GetAdjective] government, our intelligence forces have made their way to the home of Josef Dzhugashvili, nicknamed Stalin. The totalitarian leader had previously attempted to overthrow comrade Trotsky and escaped to Circassia. Now in our hands, he will be handed over to the law authorities of the Fourth International."
 ZKR_lore_events.4.a: "Ladies and Gentlemen, we got him."
 ZKR_stalin_arrested_after_trotskys_visit: "Stalin has been arrested after Trotsky has visited"

 ZKR_pax_events.1.t: "Nothing New from Ankara"
 ZKR_pax_events.1.desc: "The Situation in Anatolia has gotten out of control. Our military forces have failed to reign in the national resistance movements and most of our collaborators have either suddenly disappeared or were quite publicly hanged."
 ZKR_pax_events.1.a: "This is bad..."
 ZKR_pax_events.1.tt: "§RThe end is near.§!"

 ZKR_pax_events.2.t: "Guerilla War in Anatolia"
 ZKR_pax_events.2.desc: "WIP"
 ZKR_pax_events.2.a: "They are using our own tactics against us?"

 ZKR_pax_events.3.t: "Turkish War of Independence!"
 ZKR_pax_events.3.desc: "WIP"
 ZKR_pax_events.3.a: "Death to all Turks!"

 ZKR_pax_events.4.t: "The Eastern Territories rebel!"
 ZKR_pax_events.4.desc: "WIP"
 ZKR_pax_events.4.a: "Is this the end for Greater Kurdistan?"

 ZKR_news_events.1.t: "Kurdistan begins Unification Initiative"
 ZKR_news_events.1.desc: "In a great ceremony in [ZKR.Capital.GetCapitalVictoryPointName], the religious and political leaders of [ZKR.GetNameDef] gathered to reaffirm part of the Kurdish constitution that guarantees liberty for all Kurds, a passage that has multiple times been used to justify aggressive actions against neighbouring nations controlling Kurdish tribal lands. Many observers have already taken action on what is seen as a justification for possible wars to unite the Kurdish population in the Middle East and while Kurdish leaders have yet to release an official press statement, the recent troop movements within the nation seem to show nothing but affirmation for any assumptions."
 ZKR_news_events.1.a: "Freedom for all Kurds!"
 ZKR_news_events.1.b: "It is their good right."
 ZKR_news_events.1.c: "Ha! We won't go down without a fight!"
 ZKR_news_events.1.d: "Is this the prelude to more fighting?"

 ZKR_news_events.2.t: "Sheikh Mahmud Barzanji crowned King of Kurdistan"
 ZKR_news_events.2.desc: "Following continued instability and infighting among the politicians of the Kurdish Republic, Mahmud Barzanji and his clique of military officers have overthrown the Parliament of Kurdistan, disbanding the republic and restoring the Kingdom of Kurdistan as it existed during the tumultuous period in 1921.\n \nWhile most Kurds have accepted the transition of power, many neighbouring onlookers fear that the new royal government may be more proactive in pursuing Kurdish reunification and threaten the fragile balance of power in the middle east."
 ZKR_news_events.2.a: "Long may he reign!"
 ZKR_news_events.2.b: "He is dangerous..."
 ZKR_news_events.2.c: "We will continue to observe."
 ZKR_news_events.2.d: "Interesting."

 ZKR_news_events.3.t: "Xoybûn establish Kurdish Military Government"
 ZKR_news_events.3.desc: "Following continued instability and infighting among the politicians of the Kurdish Republic, the military committee of the Xoybûn have taken it into their hands to rule the Kurdish state and bring stability, disbanding the republic and instituting a military regime, similar to the provisional government during the Ararat Republic.\n \nWhile most Kurds have accepted the transition of power, many neighbouring onlookers fear that the new ultranationalist government may be more proactive in pursuing Kurdish reunification and threaten the fragile balance of power in the middle east."
 ZKR_news_events.3.a: "Death to the Enemies of Kurdistan!"
 ZKR_news_events.3.b: "Nuri cannot be trusted."
 ZKR_news_events.3.c: "Let's hope we don't become a target too..."
 ZKR_news_events.3.d: "Interesting."
 ZKR_news_events.3.e: "Even more instability in the Middle East."

 ZKR_news_events.4.t: "Charter of the Commonwealth of the Middle East"
 ZKR_news_events.4.desc: "Today, the Government of Kurdistan in cooperation with their allies has announced the formation of the Commonwealth of the Middle East and the signing of its charter.\n \nAmong other things, the charter claims to guarantee peace and freedom in the Middle East, as well as detailing how the Commonwealth's government will work.\n \nCritics cite the fact that the Commonwealth Parliament is based on the Kurdish Parliament as hint that the organisation will be to Kurd-centric to actually facilitate cooperation, especially among Turks and Arabs, who already feel distrustful towards the Kurds."
 ZKR_news_events.4.a: "Hurrah for International Cooperation!"
 ZKR_news_events.4.b: "Let's see how this develops."
 ZKR_news_events.4.c: "A chance for peace in the Middle East."
 ZKR_news_events.4.d: "Hopefully everything works out in our favour."

 ZKR_news_events.5.t: "Kurdistan loses Control over Anatolia"
 ZKR_news_events.5.desc: "Over the last months, the Turkish Resistance has increased in the Kurdish-occupied Anatolia, with the forces of the now-collapsed Governate failing to subdue them.\n \nNow, [ZKT.GetNameDef] has declared independence under leadership of the [ZKT.GetRulingParty] while Kurdish troops have already been expelled from the territories and are struggling to reorganise against the first Turkish offensives."
 ZKR_news_events.5.a: "We can still win this!"
 ZKR_news_events.5.b: "How could this have happened?"
 ZKR_news_events.5.c: "Death to Kurdistan!"
 ZKR_news_events.5.d: "The Pax Kurdistan was anything but."
 ZKR_news_events.5.e: "The Kurds thought they were the masters of the world."

 ZKR_news_events.6.t: "The Hegemon of the Middle East"
 ZKR_news_events.6.desc: "Following recent conquests, the Kingdom of Kurdistan has established itself as regional hegemon over the Middle East. Now, Mahmud Barzanji, the royal hegemon himself, is to be crowned emperor of the Middle East, following claims that his tribe is actually decendant of ancient Mesopotamian rulers. Therefore, Barzanji is expected to not only 'succeed' the title of Emperor of the Middle East, but also the ancient Mesopotamian titles of 'King of Kings' and 'King of the Four Corners of the Universe'."
 ZKR_news_events.6.a: "Long live the Emperor!"
 ZKR_news_events.6.b: "History being written."
 ZKR_news_events.6.c: "Imperialism remains a threat to the People."

 ZKR_news_events.7.t: "The Pax Kurdistan"
 ZKR_news_events.7.desc: "WIP"
 ZKR_news_events.7.a: "Peace has arrived in the Middle East."
 ZKR_news_events.7.b: "What is peace built on suffering?"
 ZKR_news_events.7.c: "Inspiring."

 ZKR_news_events.8.t: "Trotskyists win Kurdish Elections!"
 ZKR_news_events.8.desc: "Despite recent hardship and attempted coups by various military factions, the Republic of Kurdistan has stabilised enough to hold elections.\n \nThe election results are in and the outcome are clear: the Trotskyist Revolutionary Party of Kurdistan under the leadership of Qazi Muhamad has won a majority of seats in the parliament, letting them to rule without needing a coalition and allowing them to change the constitution of the Republic. Despite objections from the centre and right-wing parties, the people have spoken and Kurdistan will very likely experience institutional revolution."
 ZKR_news_events.8.a: "Revolution can be achieved without bloodshed!"
 ZKR_news_events.8.b: "Congratulations to our comrades."
 ZKR_news_events.8.c: "This is what their democracy has fallen to."
 ZKR_news_events.8.d: "The Trotskyist menace will destroy their country."

 ZKR_news_events.9.t: "The Coalition for Progress wins Kurdish Elections!"
 ZKR_news_events.9.desc: "Despite recent hardship and attempted coups by various military factions, the Republic of Kurdistan has stabilised enough to hold elections.\n \nThe election results are in and the outcome are clear: The center-left to center-right parties have won enough seats in Parliament to form a coalition against the PŞK and the far-right parties. The results of the elections have also restored some trust in public institutions as the people of Kurdistan see that their vote has been heard and the elections have gone through freely and fairly. Kurdish democracy will not fade away anytime soon."
 ZKR_news_events.9.a: "Stability and Institutionalism prevails."
 ZKR_news_events.9.b: "Seems Kurdish Democracy is here to stay."
 ZKR_news_events.9.c: "Pah."

 ZKR_city_capture_events.1.t: "The Fall of Amed"
 ZKR_city_capture_events.1.desc: "The city of Amed, once the great capital of the Kurdish nation has just fallen to [350.controller.GetAdjective] troops. Reportedly, [350.owner.GetAdjective] soldiers are still fighting in and around the city, continuing the war in a form of guerilla warfare.\n \nThe building once housing the Parliament of the Republic of Kurdistan has already been demolished by stray artillery fire and many other important sights of the city lay in ruins due to the constant bombardement."
 ZKR_city_capture_events.1.a: "We will take it back!"
 ZKR_city_capture_events.1.b: "Amed is ours!"
 ZKR_city_capture_events.1.c: "The Home of the Kurdish Rebellion has fallen."
 ZKR_city_capture_events.1.d: "They will surrender soon!"

 ZKR_city_capture_events.2.t: "The Fall of Akkad"
 ZKR_city_capture_events.2.desc: "[291.controller.GetAdjective] troops have just reached the Heart of the [291.owner.GetAdjective] Empire, the legendary City of Akkad. The city had only recently been rebuilt and already, the grand temples and palaces of the Heart of the Middle East lay in ruins.\n \nAccording to reports, fighting in the city is still ongoing, with [291.owner.GetAdjective] soldiers having barricaded themselves in the Imperial Palace in the hopes that it won't become a target for artillery fire."
 ZKR_city_capture_events.2.a: "We just rebuilt that!"
 ZKR_city_capture_events.2.b: "The Heart of their Empire is gone!"
 ZKR_city_capture_events.2.c: "Will the city be lost again?"
 ZKR_city_capture_events.2.d: "The Heart of their Empire is gone!"


