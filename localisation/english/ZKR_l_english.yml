 ZKR_liberal_versus_communist_desc: "The Kurdish Parliament is split among those that want to achieve Greater Kurdistan and those that seek to maintain Kurdish self-determination and help other ethnicities in the Middle East do the same. The Xoybûn maintains neutrality in this internal conflict, though some members are advocating for the restoration of the military government to achieve Kurdish unification."
