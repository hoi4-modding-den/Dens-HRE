 #Ideas#
 ZEG_khedivate_idea:0 "Post-Ottoman Turmoil"
 ZEG_khedivate_idea_desc:0 "Following decades of conflict between the Ottoman Empire and the British Empire, the Khedivate of Egypt has struggled to assert itself in the face of the great powers. However, the sudden collapse of both the Ottoman and British Empires has thrown Egypt into a state of chaos. Communists and Green Shirts clash in the streets, the monarchy openly clashes with the popular Wafd Party for control of the government, and the territories beyond the Nile River have completely fallen outside of our control. If Egypt is to survive, decisive action must be taken, before someone else takes it for us..."
 ZEG_communism_drift:0 "§WDaily Communism Support: §R+0.01§! "
 ZEG_fascism_drift:0 "§WDaily Fascism Support: §R+0.01§! "
 ZEG_democratic_drift:0 "§WDaily Democracy Support: §R+0.01§! "
 ZEG_disorganized_military:0 "Military Chaos"
 ZEG_disorganized_military_desc:0 "The Anglo-Turkish wars has left our armed forces completely reliant on outside military assistance. With such assistance no longer available, we are barely capable of projecting authority within our own borders, let alone outside them."
 ZEG_great_depression_effects:0 "Economic Depression"
 ZEG_great_depression_effects_desc:0 "Our ties to foreign industry has backfired on us. People struggle to find work while our government continues to subsidize foreign buisnesses that have more interest in extracting profits from us instead of developing our economy. If the situation does not improve, we may find our government removed by force, either from the militias in the streets, or the army themselves."
 
 #Misc.#
 ZEG_SUEZ_SNAKE_DESC:0 "The Khedivate of Egypt has been occupied by foreign powers for centuries, whether it be Turkish, English, or French. However, the gradual collapse of the Ottoman Empire in 1930 has left Egypt alone in a state of disarray. Without Turkish or British military support, the Egyptian army has struggled to maintain our territorial integrity. Protests have broken out in Cairo, demanding a return to constitutional governance. Will Egypt shake off the yoke of stagnation, or will it fall under the weight of its own contradictions?"
