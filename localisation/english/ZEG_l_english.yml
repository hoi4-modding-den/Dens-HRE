 #Focuses#
 ZEG_vestigial_khedivate:0 "The Last Days of the Khedivate"
 ZEG_vestigial_khedivate_desc:0 "The Ottoman Empire, once the ''Eternal State'', has been reduced to a shadow of its former self. Our government has sought to weather the storm, waiting for the day that stability returns to the Empire. But that day has not come, and it increasingly seems that it never will. It seems that Egypt's fate lies in its own hands now, even if its ruling class is reluctant to recognize this."
 
