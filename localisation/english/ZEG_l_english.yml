 #Events#
 ZEG.NE_1.t:0 "Egypt at a Crossroads"
 ZEG.NE_1.d:0 "Following the 1919 revolution and the subsequent re-establishment of Ottoman overlordship over Egypt (with the exception of the Suez Canal), concessions were granted by the Turkish to appease the demands of the liberal-nationalist Delegation Party (Hizb al-Wafd). The most important of these demands was the establishment of a formal constitution for the Khedivate, which was implemented in 1923. This constitution greatly increased the powers of parliament, much to the annoyance of the previous Khedive, Fuad I, who would create and fund the Union Party (Hizb al-Ittihad) in 1925 to oppose the growth of the liberal and leftist parties. Despite this, the Delegation Party saw landslide victories in all elections in the 1920s, forcing the Khedive to dismiss parliament on multiple occasions in an effort to prevent liberal reforms. The collapse of the Ottoman Empire in 1930 would grant Fuad I the excuse he needed to suspend the constitution. \n\nLed primarily by the Delegation Party and its Blue Shirt militias, mass protests began to break out throughout Egypt. Fuad I, refusing to give in to ‘‘the wrath of the peasantry’’, declared martial law, and attempted to crack down on the protests. However, the armed forces grew opposed to both the Khedive and parliament, due to the failure of the government to handle the economic depression. The armed forces have since refused to obey the direct orders of the Khedive and, in the case of the navy, have outright rebelled against the Khedivate in the eastern deserts. The chaos would only worsen as an anarchist associated with the Egyptian Communist Party assassinated Faud I, with the inexperienced Farouk I being forced into an early and uneasy coronation. While many had expected the young Khedive would put an end to the protests, Farouk surprised the public by announcing in a public radio address that he would refuse to give in to ‘‘the unruly mob that has killed my father’’, and that order will be restored by any means necessary.\n\nDespite the aggressive posturing from the government, extremist militias continue to grow as they march through the streets unimpeded. In particular, the ultranationalist Young Egypt Party has seen explosive growth as a result of their anti-imperialist and pro-islamist views. Other movements, such as the Community Party and the Muslim Brotherhood, have also seen rapid growth from those disillusioned with parliament for its perceived support of foreign monopolies, in particular the Bechtel Corporation, which has sought to establish an American settler project in the western deserts. With tensions at an all time high, and militias clashing in the streets, the stalemate needs to be broken, before the Khedive loses what little control he has left."
 ZEG.NE_1.a:0 "Long live the Motherland!"
 ZEG.FE_1.t:0 "The Demands of the Protests"
 ZEG.FE_1.d:0 "A new wave of protests has broken out in the major cities this January, primarily as result of prime minister Ismail Sidky Pasha’s recent statements justifying the Khedive’s continued suspension of constitutional rule. A rally of tens of thousands has erupted in Cairo, chanting ‘‘Down with Premier Sidky! We want the 1923 Constitution!’’ Already, ‘Green Shirt’ militias have capitalized on the anger, organizing a march in the streets and clashing with police forces, while the Delegation Party has made demands for the formation of a ‘‘National Front’’ against the monarchy.\n\nMost of our advisors admit that, unless we reinstate the 1923 constitution, the political violence within our country may very well spiral out of our control. While Farouk I has expressed displeasure at returning to constitutional governance, we still retain the ability to dissolve parliament should the powerful Delegation Party exceed our tolerance for democracy. The alternative may not work as well as the Khedive would hope..."
 ZEG.FE_1.a:0 "Restore the constitution and call for new elections."
 ZEG.FE_1.b:0 "Outlaw the militias, dismantle the protests."
 ZEG_event_tooltip_1:0 "We will be led by the §BDelegation Party §!for a least a year after the election."
 ZEG_event_tooltip_2:0 "§RYou're only adding fuel to the flames...§!"