 YPR_the_red_flag_over_portugal:0 "The Red Flag Over Portugal"
 YPR_the_red_flag_over_portugal_tt:0 "§g"A spectre is haunting Europe; the spectre of Communism."\n - Karl Marx, The Communist Manifesto, 1848§!\n\n"
 
 YPR_emphasize_international_solidarity:0 "Emphasize International Solidarity"
 YPR_emphasize_international_solidarity_tt:0 "§g"The interests of the working class and of its struggle against capitalism demand complete solidarity and the closest unity of the workers of all nations."\n - V.I. Lenin, Right of Nations to Self-Determination, 1904§!\n\n"
 
 YPR_affirm_the_policy_of_equality:0 "Affirm the Policy of Equality"
 YPR_affirm_the_policy_of_equality_tt:0 "§g"My Marxist outlook pointed out to me with an illuminating clarity that women's liberation could take place only as the result of the victory of a new social order and a different economic system."\n - Alexandra Kollontai, The Autobiography of a Sexually Emancipated Communist Woman, 1926§!\n\n"
 
 YPR_first_congress_of_the_portuguese_revolutionary_front:0 "Commence the First Congress of the PCP"
 YPR_first_congress_of_the_portuguese_revolutionary_front_tt:0 "§g"We can only be right with and by the Party, for history has provided no other way of being in the right... And if the Party adopts a decision which one or other of us thinks unjust, he will say, just or unjust, it is my party, and I shall support the consequences of the decision to the end."\n - Lev Trotsky, 13th Party Congress of the CPSU, 1924§!\n\n"
 
 YPR_establish_the_vanguard_party:0 "Establish the Vanguard Party"
 YPR_establish_the_vanguard_party_tt:0 "§g"But the necessity of authority, and of imperious authority at that, will nowhere be found more evident than on board a ship on the high seas. There, in time of danger, the lives of all depend on the instantaneous and absolute obedience of all to the will of one."\n - Friedrich Engels, On Authority, 1872§!\n\n"
 
 YPR_institute_a_dictatorship_of_the_proletariat:0 "Dictatorship of the Proletariat"
 YPR_institute_a_dictatorship_of_the_proletariat_tt:0 "§g"I repeat: the experience of the notorious dictatorship of the proletariat in Russia has clearly shown even to those who are incapable of thinking or have had no occasion to give thought to the matter that absolute centralisation and rigorous discipline in the proletariat are an essential condition of victory over the bourgeoisie."\n - V.I. Lenin, "Left-Wing" Communism: An Infantile Disorder, 1920§!\n\n"
 
 YPR_proletarianize_the_peasants:0 "Proletarianize the Peasants"
 YPR_proletarianize_the_peasants_tt:0 "§g"There is no doubt that in a country where the overwhelming majority of the population consists of small agricultural producers, a socialist revolution can be carried out only through the implementation of a whole series of special transitional measures..."\n - V.I. Lenin, 10th Party Congress of the CPSU, 1921§!\n\n"
 
 YPR_rapid_industrialization:0 "Develop the Iron Mines of Moncorvo"
 YPR_rapid_industrialization_tt:0 "§g"The country that is more developed industrially only shows, to the less developed, the image of its own future."\n - Karl Marx, Capital, Volume I, 1867§!\n\n"
 
 YPR_policy_of_war_communism:0 "Policy of War Communism"
 YPR_policy_of_war_communism_tt:0 "§g"The modern proletarian class doesn't carry out its struggle according to a plan set out in some book or theory; the modern workers' struggle is a part of history, a part of social progress, and in the middle of history, in the middle of progress, in the middle of the fight, we learn how we must fight."\n - Rosa Luxemburg, The Mass Strike, the Political Party and the Trade Unions, 1906§!\n\n"
 
 YPR_portuguese_red_army:0 "The Portuguese Red Army"
 YPR_portuguese_red_army_tt:0 "§g"The proletarian army must be exclusively composed of persons belonging to the working class, of persons who do not expoloit labour and who are directly interested in the victory of the workers' revolution."\n - Nikolai Bukharin, The ABC of Communism, 1920§!\n\n"
 
 YPR_political_commissars:0 "Political Commissars"
 YPR_political_commissars_tt:0 "§g"Root out the counterrevolutionaries without mercy, lock up suspicious characters in concentration camps... Shirkers will be shot, regardless of past service."\n - Lev Trotsky, 1918§!\n\n"
 
 YPR_prepare_for_the_great_struggle:0 "Prepare for the Great Struggle"
 YPR_prepare_for_the_great_struggle_tt:0 "§g"We have no compassion and we ask no compassion from you. When our turn comes, we shall not make excuses for the terror. But the royal terrorists, the terrorists by the grace of God and the law, are in practice brutal, disdainful, and mean, in theory cowardly, secretive, and deceitful, and in both respects disreputable."\n - Karl Marx, the New Rheinish Newspaper, 1849§!\n\n"
 
 YPR_all_power_to_the_councils:0 "Empower the Workers' Councils"
 YPR_all_power_to_the_councils_tt:0 "§g"The freedom of any individual carries within it the seed of a free and complete community without government, a free society that lives in organic and decentralized totality, united in its pursuit of the great human goal: Anarchist Communism!"\n - Nestor Makhno, The Anarchist Revolution, 1920§!\n\n"
 
 YPR_arm_the_councils:0 "Arm the Councils"
 YPR_arm_the_councils_tt:0 "§g"I'd rather die on my feet, than live on my knees."\n - Emiliano Zapata§!\n"
 
 YPR_self_management_of_production:0 "The Principles of Self-Management"
 YPR_self_management_of_production_tt:0 "§g"To be governed is to be watched over, inspected, spied on, directed, legislated at, regulated, docketed, indoctrinated, preached at, controlled, assessed, weighed, censored, ordered about, by men who have neither the right, nor the knowledge, nor the virtue."\n - Pierre-Joseph Proudhon, The General Idea of the Revolution in the 19th Century, 1851§!\n\n"
 
 YPR_collectivize_the_chestnut_farms:0 "Collectivize the Chestnut Farms"
 YPR_collectivize_the_chestnut_farms_tt:0 "§g"The means of production being the collective work of humanity, the product should be the collective property of the race. Individual appropriation is neither just nor serviceable."\n - Peter Kropotkin, The Conquest of Bread, 1892§!\n\n"
 
 YPR_communal_autonomy:0 "Broaden Communal Autonomy"
 YPR_communal_autonomy_tt:0 "§g"A natural society, in the midst of which every man is born and outside of which he could never become a rational and free being, becomes humanized only in the measure that all men comprising it become, individually and collectively, free to an ever greater extent."\n - Mikhail Bakunin, Man, Society, Freedom, 1871§!\n\n"
 
 YPR_doctrinal_developments:0 "The Doctrinal Legacy of the 1934 Revolution"
 YPR_doctrinal_developments_tt:0 "§g"It is a fact that under equal conditions, large-scale battles and whole wars are won by troops which have a strong will for victory, clear goals before them, high moral standards, and devotion to the banner under which they go into battle."\n - Georgy Zhukov§!\n\n"
 
 YPR_rifle_modernization:0 "Modernize the Mauser–Vergueiro"
 YPR_rifle_modernization_tt:0 "§g"Every Communist must grasp the truth; Political power grows out of the barrel of a gun."\n - Mao Zedong, Problems of War and Strategy, 1938§!\n\n"
 
 YPR_mass_production_of_weapons:0 "Mass Production of Weapons"
 YPR_mass_production_of_weapons_tt:0 "§g"The pickaxe and the shovel are as important as the rifle. I can't say it often enough."\n - Buenaventura Durruti, 1936§!\n\n"
 
 YPR_wage_war_against_unjust_hierarchies:0 "Topple Unjust Hierarchies"
 YPR_wage_war_against_unjust_hierarchies_tt:0 "§g"When, in the course of human development, existing institutions prove inadequate to the needs of man, when they serve merely to enslave, rob, and oppress mankind, the people have the eternal right to rebel against, and overthrow, these institutions."\n - Emma Goldman, What I Believe, 1908§!\n\n"
 
 YPR_strike_at_the_kingdom:0 "Strike at the Kingdom"
 YPR_strike_at_the_kingdom_tt:0 "§g"The Communists disdain to conceal their views and aims. They openly declare that their ends can be attained only by the forcible overthrow of all existing social conditions. Let the ruling classes tremble at a Communistic revolution!"\n - Karl Marx, The Communist Manifesto, 1848§!\n\n"
 
 YPR_purge_the_royalists:0 "Purge the Royalists"
 YPR_purge_the_royalists_tt:0 "§g"To make the individual sacred we must destroy the social order which crucifies him. And this problem can only be solved by blood and iron."\n - Leon Trotsky, Terrorism and Communism, 1920§!"
 
 YPR_consolidate_the_proletariat_of_the_south:0 "Consolidate the Proletariat of the South"
 YPR_consolidate_the_proletariat_of_the_south_tt:0 "§g"We have spilt an ocean of blood for the brotherhood and unity of the proletariat and we shall not allow anyone to touch or destroy it from within."\n - Josip Broz Tito§!"
 
 YPR_a_new_era_for_portugal:0 "A New Era for Portugal"
 YPR_a_new_era_for_portugal_tt:0 "§g"I believe that the proletarian class is destined, in a more or less near future, to take the direction of the destinies of the world into their own hands, completely transforming the entire existing social organisation."\n - Bento de Jesus Caraça, 1929§!\n\n"
 
 YPR_safeguard_the_revolution:0 "[GetSafeguardTheRevolutionName]"
 YPR_safeguard_the_revolution_anarchist:0 "Safeguard the Free Territory"
 YPR_safeguard_the_revolution_leninist:0 "Safeguard the Soviet Republic"
 YPR_safeguard_the_revolution_default:0 "Safeguard the Revolution"
 YPR_safeguard_the_revolution_tt:0 "§g"Before we are completely routed, let us retreat and reorganise everything, but on a firmer basis."\n - V.I. Lenin, The New Economic Policy, 1921§!\n\n"
 
 YPR_solidarity_with_our_spanish_comrades:0 "Solidarity with Our Spanish Comrades"
 YPR_solidarity_with_our_spanish_comrades_tt:0 "§g"The proletarians have nothing to lose but their chains. They have a world to win. Workers of the world, unite!"\n - Karl Marx, The Communist Manifesto, 1848§!\n\n"
 
 YPR_provide_indirect_aid_to_our_allies:0 "Provide Indirect Aid to Our Allies"
 YPR_provide_indirect_aid_to_our_allies_tt:0 "§g"We should support whatever our enemies oppose and oppose whatever our enemies support."\n - Mao Zedong, 1939§!\n\n"
 
 YPR_a_red_fortress:0 "A Fortaleza Vermelha"
 YPR_a_red_fortress_tt:0 "§g"Raise the revolutionary flag\nWhich carries us ceaselessly towards triumph!\nTo the Barricades!"\n - Valeriano Orobón Fernández, A las Barricadas, 1933§!\n\n"
 
 YPR_industrial_advancements:0 "Industrial Advancements"
 YPR_industrial_advancements_tt:0 "§g"If we enjoy the benefits of peace, it is only because we have an excellent armed force and a fine socialist economy"\n - Kliment Voroshilov§!\n\n"
 
 YPR_the_vanguards_against_capitalism:0 "The Vanguards Against Capitalism"
 YPR_the_vanguards_against_capitalism_tt:0 "§g"To carry on a war for the overthrow of the international bourgeoisie, a war which is a hundred times more difficult, protracted and complex than the most stubborn of ordinary wars between states, and to renounce in advance any change of tack, or any utilisation of a conflict of interests among one’s enemies, or any conciliation or compromise with possible allies — is that not ridiculous in the extreme?"\n - V.I. Lenin, "Left-Wing" Communism, An Infantile Disorder, 1920§!\n\n"
 
 YPR_begin_the_eastward_push:0 "Begin the Eastward Push"
 YPR_begin_the_eastward_push_tt:0 "§g"Naturally our party must defend the working classes against the Fascisti. Naturally we must defend them by force of arms, for if the Fascisti gain power they will rivet the chains of Capitalism upon us."\n - Karl Radek, Lenin, 1923§!\n\n"
 
 YPR_fuse_the_fronts:0 "Fuse the Fronts"
 YPR_fuse_the_fronts_tt:0 "§g"Is it not true that our brotherhood transcends distances, different languages, and the absence of close cultural links, and unites us in the struggle? Ought not a Japanese worker be closer to an Argentine laborer, a Bolivian miner, a man working for United Fruit Company or a Cuban cane cutter, than to a Japanese samurai?"\n - Ernesto 'Che' Guevara, Humanismo, 1959§!\n\n"
 
 YPR_unite_the_iberian_workers:0 "Unite the Iberian Working Class"
 YPR_unite_the_iberian_workers_tt:0 "§g"Long live the fraternal trust and fighting alliance of the workers of all nations in the struggle to overthrow capital!"\n - V.I. Lenin, 1919§!\n\n"