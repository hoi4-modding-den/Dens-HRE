 YPR.1.t:0 "The Inaugral Congress of the Portuguese Revolutionaries"
 YPR.1.d:0 "For the first time since the Revolution of 1934, the key figures of both the PCP and the GCT meet each other in an effort to solidify the foundations of the newly-established Communist government. The most burning question of the day is the philosophical basis of the new constitution; The PCP argues that it should follow the principles set by Lenin and the Bolsheviks, whilst the GCT leans more towards Anarcho-Syndicalist views."
 YPR.1.a:0 "We need a vanguard party to guide the revolution!"
 YPR.1.b:0 "True liberty can only be found within an Anarchist framework!"
 
 YPR_revolutionary_trade_unionist:0 "Working Class Hero"
