 YPR_the_red_flag_over_portugal:0 "The Red Flag Over Portugal"
 YPR_the_red_flag_over_portugal_tt:0 "§g"A spectre is haunting Europe; the spectre of Communism."\n - Karl Marx, The Communist Manifesto, 1848§!\n\n"
 
 YPR_emphasize_international_solidarity:0 "Emphasize International Solidarity"
 YPR_emphasize_international_solidarity_tt:0 "§g"The interests of the working class and of its struggle against capitalism demand complete solidarity and the closest unity of the workers of all nations."\n - V.I. Lenin, Right of Nations to Self-Determination, 1904§!\n\n"
 
 YPR_affirm_the_policy_of_equality:0 "Affirm the Policy of Equality"
 YPR_affirm_the_policy_of_equality_tt:0 "§g"My Marxist outlook pointed out to me with an illuminating clarity that women's liberation could take place only as the result of the victory of a new social order and a different economic system."\n - Alexandra Kollontai, The Autobiography of a Sexually Emancipated Communist Woman, 1926§!\n\n"
 
 YPR_first_congress_of_the_portuguese_revolutionary_front:0 "Commence the First Congress of the PCP"
 YPR_first_congress_of_the_portuguese_revolutionary_front_tt:0 "§g"We can only be right with and by the Party, for history has provided no other way of being in the right... And if the Party adopts a decision which one or other of us thinks unjust, he will say, just or unjust, it is my party, and I shall support the consequences of the decision to the end."\n - Lev Trotsky, 13th Party Congress of the CPSU, 1924§!\n\n"
 
 YPR_establish_the_vanguard_party:0 "Establish the Vanguard Party"
 YPR_establish_the_vanguard_party_tt:0 "§g"But the necessity of authority, and of imperious authority at that, will nowhere be found more evident than on board a ship on the high seas. There, in time of danger, the lives of all depend on the instantaneous and absolute obedience of all to the will of one."\n - Friedrich Engels, On Authority, 1872§!\n\n"
 
 YPR_institute_a_dictatorship_of_the_proletariat:0 "Dictatorship of the Proletariat"
 YPR_institute_a_dictatorship_of_the_proletariat_tt:0 "§g"I repeat: the experience of the notorious dictatorship of the proletariat in Russia has clearly shown even to those who are incapable of thinking or have had no occasion to give thought to the matter that absolute centralisation and rigorous discipline in the proletariat are an essential condition of victory over the bourgeoisie."\n - V.I. Lenin, "Left-Wing" Communism: An Infantile Disorder, 1920§!\n\n"
 
 YPR_all_power_to_the_councils:0 "Empower the Workers' Councils"
 YPR_all_power_to_the_councils_tt:0 "§g"The freedom of any individual carries within it the seed of a free and complete community without government, a free society that lives in organic and decentralized totality, united in its pursuit of the great human goal: Anarchist Communism!"\n - Nestor Makhno, The Anarchist Revolution, 1920§!\n\n"
 
 YPR_wage_war_against_unjust_hierarchies:0 "Wage War Against Unjust Hierarchies"
 YPR_wage_war_against_unjust_hierarchies_tt:0 "§g"It is often said that Anarchists live in a world of dreams to come, and do not see the things which happen today. We do see them only too well, and in their true colors, and that is what makes us carry the hatchet into the forest of prejudice that besets us."\n - Peter Kropotkin, Anarchism: Its Philosophy and Ideal, 1896§!\n\n"