  # Ideology Names
  capitalist_menace_ideology: "Capitalist"
  capitalist_menace_ideology_desc: "The Free Traders League is a nation with only one focus in mind: profit. The League is essentially an anarcho-capitalist land, where the government only exists because of the rules of the Emperor. A place where the rich get richer and the poor get poorer, the League is not a place many dare stay, only stop through."

