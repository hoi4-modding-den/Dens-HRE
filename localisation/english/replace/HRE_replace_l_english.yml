l_english:
 GATHERING_STORM_NAME:0 "The Holy Roman Empire"
 GATHERING_STORM_DESC:0 "The Holy Roman Empire can either be seen as one of the most influential powers in Mainland Europe, or, alternatively, as a weak, disorganized confederation of small, feeble Kingdoms who bitterly oppose one another. Perhaps the truth lies somewhere in-between these two ascriptions, and in actuality, the Holy Roman Empire simply needs one of her subjects to lead the way towards a brighter future..."
 BLITZKRIEG_DESC:0 "The Iberian Peninsula is at a state of disarray. The once-powerful Kingdom of Iberia, which consisted of both Portugal and Spain, has collapsed due to a series of economic and political blunders leading to a rapid decay of the state apparatus of the Dual Monarchy. The power vacuum that was created as a result of this sudden disintegration sowed the seeds of success for a wide-range of anti-royalist and separatist political movements. The game is set, with the future of Iberia being at stake..." 