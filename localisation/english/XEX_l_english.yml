 XEX_adress_the_kingdom_desc:0 "With the Salvini finally uniting the kingdom of padania, it's position is still un known, as we are nothing but a minor and un-important part of a greater empire. But with god and our great leader, nothing could go wrong."
 XEX_economical_growth_desc:0 "Dino Grandi has been having this plan of prioritizing economic growth before investing into military industries, while this will be less beneficial in the short term, it will make up for it in the long term."
 XEX_develop_the_capital_desc:0 "Turin and most cities are filled with crime filled slums, it is our priority to clear them before we can start boosting the local economies, and the first step to fix this in the whole country is to start in our capital."
 XEX_focus_on_industrial_production_desc:0 "The so called ''Piano Focaccia'' is a really simple thing, it strives to make the whole process of production and construction as compressed and simple as possible, we hope that with it and it's reforms we will be able to make the economy move again."
 XEX_electronic_research_desc:0 "Electronics are a main component of any industrialized nation, and not just that, they allow us to use radios, which are especially important in combat, if we want to not fall behind, it's important we stay up to date with electronic research."
 XEX_develop_ports_desc:0 "Before Genova could be defeated, they decided to burn thier important port to ashes, leaving us nothing but rubble, but luckily, with the storm finally calming, we can put some of our greatest engineers to repair it, it's port will bring us a lot of riches."
 XEX_improve_infrastructure_desc:0 "The rural sides of the kingdom has been really distanced and not connected to the capital and it's important cities, as our first step into uniting the kingdom, we should make sure every region has a road to atleast the capital and the closest major city."
 XEX_develop_the_turin_istitute_of_research_desc:0 "The ''Politecnico Di Torino'' is a very important engineering school, which has been quite lacking funds recently, as we've had to send as many men as possible to unite our great kingdom, but with no war in sight, it could be a good idea to start funding them again."
 XEX_improve_energy_use_desc:0 "Energy is a very rare resource in here, but luckily, Dino Grandi has thought of a way to fix the problem alredy, rationing it, but most importantly, updating our infrastructure related to energy as it has been years since they were last checked, and they might be letting go of a lot of energy."
 XEX_use_the_padanian_plains_desc:0 "The po valley is a very rich region, not just for trade, but the opportunity it gives us for farming are immense, while the eastern part of it is controlled by La Serenissima, we control most of it, it should be a priority to use all this farmland to it's best abilities."
 XEX_damn_milans_lakes_desc:0 "In the alps, there are major lakes, which we could use to build dams in, while those lakes were never important enough, with the recent integration of the Principality of Milan and it's northern big lakes, we could use them to create dams to create energy."
 XEX_create_the_geneva_plant_desc:0 "A facility in Genova could be extremely beneficial, despite it not being strictly economic related, it will allow us to protect our import and exports, and especially with the recent reconstruction of the Genova port, it's very important we keep our navy up to date, especially as La Serenissima is always ruling the seas."
