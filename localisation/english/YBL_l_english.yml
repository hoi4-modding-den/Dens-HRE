 YBL_juan_march_ordinas: "Juan March Ordinas"
 YBL_juan_march_ordinas_desc: "Juan March built his fortune on smuggling, banking, and ruthless opportunism, rising to become one of the most powerful financiers in Europe. To his supporters, he is a visionary who can transform the Balearics into a capitalist stronghold at the crossroads of the Mediterranean. To his enemies, he is nothing more than a pirate in a suit, a man who treats nations as just another investment to be bought and sold."
 hyper_capitalism: "Economic Liberalism"
 hyper_capitalism_desc: "An uncompromising devotion to free markets and private wealth, Economic Liberalism seeks to ensure that democracy serves the interests of commerce. The state intervenes only to safeguard property and contracts, while industry, trade, and finance shape the course of the nation. Politics is defined less by ideology than by the pursuit of prosperity."
 financier_of_the_mediterranean: "Financier of the Mediterranean \n§gFor him, borders are obstacles, and profit is destiny.§!"
 foreign_riches: "Foreign Riches \n§gNobody is certain where they come from, but Juan March has always found a way to have a plethora of natural resources ready to do with as he wishes.§!"
