 YBL.1.title: "Outrage Over Ordinas' Great Sale"
 YBL.1.desc: "The board are up in arms after Ordinas' decision to sell the state of Ciudad Real to [YAO.GetNameDef], claiming that there was untapped potential and a possibility to greatly expand the Belaeric Corporate Empire. They have now called for Juan March Ordinas to resign from his position of CEO and leader of [ROOT.GetNameDef], but he has rebuffed the demand and has refused to resign as he believes this decision will benefit the company in the long run more than trying to develop the area."
 YBL.1.a: "Ordinas knows best, he can stay for now"
 YBL.1.b: "Ordinas is mad with power and must be removed"
 YBL.2.title: "Ordinas Survives the Coup"
 YBL.2.desc: "A small portion of the army arrived at the company headquarters in Palma with the intention to remove Ordinas from his position. What they and the board had not anticipated was the majority of the remaining Belaeric troops, along with the company security force, would meet them there, backing Ordinas as President. Tensions were high, but no shots were fired before the aggressors layed down their arms. A few hours later, Ordinas announced the dissolvement of the Belaeric government and announced he is the only one who can lead [ROOT.GetNameDef] into the new world."
 YBL.2.a: "How far can capitalism be pushed?"
 YBL.3.title: "The Xavier Report"
 YBL.3.desc: "Commissioned by Juan March Ordinas at the request of the board, Xavier Ruiz conducted an inspection on the country and has found clear and present issues that need to be addressed. His scathing 236-page report outlines key weaknesses in all aspects of the country, with the conclusion reading:\n'You may believe that a country can be run as a business, and unfortunately for the Belaeric Islands, this report has proven this to be false.'"
 YBL.3.a: "This is terrible!"
 