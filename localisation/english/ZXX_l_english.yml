 ZXX_neutrality_party: "BC"
 ZXX_neutrality_party_long: "Bechtel Corporation\n§LThe Bechtel Corporation is a US-based company that focuses on heavy construction, infrastructure, dams, rail and oil facilities. They successfully won the contract to develop and improve the Saharan Desert in October 1932, and have now moved a significant portion of their operation to Africa.§!"
 ZXX_democratic_party: "RMS"
 ZXX_democratic_party_long: "Sir Robert McAlpine & Sons\n§LSir Robert McAlpine & Sons is a UK-based company that focuses on civil engineering, construction and infrastructure. While they did not win the contract, their influence is still permitted by the League of Nations. Over the past year they have become increasingly vocal about their disapproval of how the ESCA is run, and believe it would be better to ornganise the area with more bureaucracy.§!"
 ZXX_communism_party: "SNR"
 ZXX_communism_party_long: "Soviet National Resistance\n§LA strong Communist resistance, generally grouped under the banner of the Soviet National Resistance (SNR), is present in the region. They oppose the idea of a company owning such a large area of Africa, and blame corruption and nepotism for the continued relocation of the Saharan natives.§!"
 ZXX_fascism_party: "PERP"
 ZXX_fascism_party_long: "Popular Egyptian Resistance Party\n§LDespite what their name may suggest, the Popular Egyptian Resistance Party (PERP) is a fringe movement advocating for the end of imperialist oversight and demanding the return of the territory to the natives currently being upended in the name of progress. However, if the company in charge fails to deliver on their promises, the PERP could start to become a real alternative for the African natives who outnumber the colonialists 10-1.§!"
 
 african_wasteland: "African Wasteland"

