l_english:
 ZXX: "East Saharan Construction Authority"
 ZXX_DEF: "East Saharan Construction Authority"
 ZXX_ADJ: "American"
 ZXX_samuel_insull: "Samuel Insull"
 ZXX_samuel_insull_desc: "A pioneer of modern utilities and mass electrification, Samuel Insull represents the belief that society can be engineered as efficiently as a power grid. Rising from the world of American finance and public utilities, Insull built vast, vertically integrated systems that bound industry, infrastructure, and population together through centralized planning and private capital. To his supporters, he is proof that technocratic management can succeed where politics fails; to his critics, he is the embodiment of unaccountable corporate authority.\n\nAs head of the East Saharan Construction Authority alongside the Bechtel Corporation, Insull envisions the desert not as empty land, but as an undeveloped system awaiting rational design. Power generation, water control, transport, and settlement are treated as interconnected components, to be expanded methodically under expert supervision. Elections and ideology are secondary to balance sheets, output figures, and long-term investment confidence.\n\nUnder Insull’s leadership, the state becomes a utility in itself: centralized, disciplined, and optimized for growth. Prosperity is promised, but only to those willing to accept that efficiency, not popular will, is the true foundation of modern civilization."
 
 STATE_1104: "Western Libyan Desert"
 VICTORY_POINTS_1057: "Central Saharan Complex"
 
 ZXX_neutrality_party: "BC"
 ZXX_neutrality_party_long: "Bechtel Corporation\n§LThe Bechtel Corporation is a US-based company that focuses on heavy construction, infrastructure, dams, rail and oil facilities. They successfully won the contract to develop and improve the Saharan Desert in October 1932, and have now moved a significant portion of their operation to Africa.§!"
 ZXX_democratic_party: "RMS"
 ZXX_democratic_party_long: "Sir Robert McAlpine & Sons\n§LSir Robert McAlpine & Sons is a UK-based company that focuses on civil engineering, construction and infrastructure. While they did not win the contract, their influence is still permitted by the League of Nations. Over the past year they have become increasingly vocal about their disapproval of how the ESCA is run, and believe it would be better to ornganise the area with more bureaucracy.§!"
 ZXX_communism_party: "SNR"
 ZXX_communism_party_long: "Soviet National Resistance\n§LA strong Communist resistance, generally grouped under the banner of the Soviet National Resistance (SNR), is present in the region. They oppose the idea of a company owning such a large area of Africa, and blame corruption and nepotism for the continued relocation of the Saharan natives.§!"
 ZXX_fascism_party: "PERP"
 ZXX_fascism_party_long: "Popular Egyptian Resistance Party\n§LDespite what their name may suggest, the Popular Egyptian Resistance Party (PERP) is a fringe movement advocating for the end of imperialist oversight and demanding the return of the territory to the natives currently being upended in the name of progress. However, if the company in charge fails to deliver on their promises, the PERP could start to become a real alternative for the African natives who outnumber the colonialists 10-1.§!"
 
 african_wasteland: "African Wasteland"
 ZXX_nile_sahara_logistics_accord: "Nile–Sahara Logistics Accord"
 ZXX_nile_sahara_logistics_accord_desc: "In order for supplies from our headquarters in the §Y[ENG.GetNameWithFlag]§! and §Y[USA.GetNameWithFlag]§! to reach us, we have struck a deal with §Y[ZEG.GetNameWithFlag]§! that allows safe passage from the port in §YAlexandria§!. \n\n§RHowever, this deal is insecure and a change in the Egyptian politics could prove fatal to our operations.§!"
 ZXX_nile_sahara_logistics_crisis: "Nile–Sahara Logistics Crisis"
 ZXX_nile_sahara_logistics_crisis_desc: "§RThe §YNile–Sahara Logistics Accord§! is currently not active and we must reach out to the new government in §Y[ZEG.GetNameWithFlag]§! before our operations collapse!"
 ZXX_strong_local_resistance: "Strong Local Resistance"
 ZXX_strong_local_resistance_desc: "It should come at no surprise that the locals are not happy with our corporate occupation of the region, but so far their efforts seem insignificant and can be contained."
 ZXX_corporate_struggle: "Corporate Struggle"
 ZXX_corporate_struggle_desc: "Although we won the contract to operate in the Sahara, our largest competitor, Sir Robert McAlpine & Sons, was still allowed access to the area and to contribute to decision making."
