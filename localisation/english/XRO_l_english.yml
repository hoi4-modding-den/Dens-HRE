 #PASSAGES
 XRO_passage_decision_1: "The Fall of Man"
 XRO_passage_decision_1_description: "The account of the fall in Genesis 3 uses figurative language, but affirms a primeval event, a deed that took place at the beginning of the history of man. Revelation gives us the certainty of faith that the whole of human history is marked by the original fault freely committed by our first parents."
 XRO_passage_decision_2: "The Burning Bush"
 XRO_passage_decision_2_description: "God revealed himself progressively and under different names to his people, but the revelation that proved to be the fundamental one for both the Old and the New Covenants was the revelation of the divine name to Moses in the theophany of the burning bush, on the threshold of the Exodus and of the covenant on Sinai."
 XRO_passage_decision_3: "The Ten Plagues"
 XRO_passage_decision_3_description: "This is what the great LORD says: Let my people go, so that they may worship me. If you refuse to let them go, I will plague your whole country with frogs. The Nile will teem with frogs. They will come up into your palace and your bedroom and onto your bed, into the houses of your officials and on your people, and into your ovens and kneading troughs."
 XRO_passage_decision_4: "Crossing the Red Sea"
 XRO_passage_decision_4_description: "Then Moses stretched out his hand over the sea; and the Lord caused the sea to go back by a strong east wind all that night, and made the sea into dry land, and the waters were divided. So the children of Israel went into the midst of the sea on the dry ground, and the waters were a wall to them on their right hand and on their left."
 XRO_passage_decision_5: "The Ten Commandments"
 XRO_passage_decision_5_description: "When the people saw the thunder and lightning and heard the trumpet and saw the mountain in smoke, they trembled with fear. They stayed at a distance and said to Moses, 'Speak to us yourself and we will listen. But do not have God speak to us or we will die.'"
 XRO_passage_decision_6: "David and Goliath"
 XRO_passage_decision_6_description: "David said to the Philistine, 'You come against me with sword and spear and javelin, but I come against you in the name of the Lord Almighty, the God of the armies of Israel, whom you have defied. This day the Lord will deliver you into my hands, and I'll strike you down and cut off your head.'"
 XRO_passage_decision_7: "Solomon's Wisdom"
 XRO_passage_decision_7_description: "Solomon answered, 'You have shown great kindness to your servant, my father David, because he was faithful to you and righteous and upright in heart. You have continued this great kindness to him and have given him a son to sit on his throne this very day.'"
 XRO_passage_decision_8: "Elijah on Mount Carmel"
 XRO_passage_decision_8_description: "Now summon the people from all over Israel to meet me on Mount Carmel. And bring the four hundred and fifty prophets of Baal and the four hundred prophets of Asherah, who eat at Jezebel's table."
 XRO_passage_decision_9: "The Valley of Dry Bones"
 XRO_passage_decision_9_description: "This is what the Sovereign Lord says: My people, I am going to open your graves and bring you up from them; I will bring you back to the land of Israel. Then you, my people, will know that I am the Lord, when I open your graves and bring you up from them."
 XRO_passage_decision_10: "The Birth of Jesus"
 XRO_passage_decision_10_description: "Do not be afraid. I bring you good news that will cause great joy for all the people. 11 Today in the town of David a Savior has been born to you; he is the Messiah, the Lord. This will be a sign to you: You will find a baby wrapped in cloths and lying in a manger."
 XRO_passage_decision_11: "Sermon on the Mount"
 XRO_passage_decision_11_description: "Now when Jesus saw the crowds, he went up on a mountainside and sat down. His disciples came to him, and he began to teach them."
 XRO_passage_decision_12: "The Beatitudes"
 XRO_passage_decision_12_description: "Blessed are you when people insult you, persecute you and falsely say all kinds of evil against you because of me. Rejoice and be glad, because great is your reward in heaven, for in the same way they persecuted the prophets who were before you."
 XRO_passage_decision_13: "The Parable of the Sower"
 XRO_passage_decision_13_description: "Because the knowledge of the secrets of the kingdom of heaven has been given to you, but not to them. Whoever has will be given more, and they will have an abundance. Whoever does not have, even what they have will be taken from them."
 XRO_passage_decision_14: "The Good Samaritan"
 XRO_passage_decision_14_description: "But a Samaritan, as he traveled, came where the man was; and when he saw him, he took pity on him. He went to him and bandaged his wounds, pouring on oil and wine. Then he put the man on his own donkey, brought him to an inn and took care of him."
 XRO_passage_decision_15: "The Prodigal Son"
 XRO_passage_decision_15_description: "But while he was still a long way off, his father saw him and was filled with compassion for him; he ran to his son, threw his arms around him and kissed him."
 XRO_passage_decision_16: "Jesus Walks on Water"
 XRO_passage_decision_16_description: "Shortly before dawn Jesus went out to them, walking on the lake. When the disciples saw him walking on the lake, they were terrified. 'It's a ghost,' they said, and cried out in fear."
 XRO_passage_decision_17: "The Last Supper"
 XRO_passage_decision_17_description: "The one who has dipped his hand into the bowl with me will betray me. The Son of Man will go just as it is written about him. But woe to that man who betrays the Son of Man! It would be better for him if he had not been born."
 XRO_passage_decision_18: "The Crucifixion"
 XRO_passage_decision_18_description: "He saved others but he can't save himself! He's the king of Israel! Let him come down now from the cross, and we will believe in him. He trusts in God. Let God rescue him now if he wants him."
 XRO_passage_decision_19: "The Resurrection"
 XRO_passage_decision_19_description: "When the centurion and those with him who were guarding Jesus saw the earthquake and all that had happened, they were terrified, and exclaimed, 'Surely he was the Son of God!'"
 XRO_passage_decision_20: "The Road to Emmaus"
 XRO_passage_decision_20_description: "How foolish you are, and how slow to believe all that the prophets have spoken! Did not the Messiah have to suffer these things and then enter his glory?"
 XRO_passage_decision_21: "Pentecost"
 XRO_passage_decision_21_description: "Fellow Israelites, listen to this: Jesus of Nazareth was a man accredited by God to you by miracles, wonders and signs, which God did among you through him, as you yourselves know. This man was handed over to you by God's deliberate plan and foreknowledge..."
 XRO_passage_decision_22: "The Conversion of Saul"
 XRO_passage_decision_22_description: "Brother Saul, the Lord—Jesus, who appeared to you on the road as you were coming here—has sent me so that you may see again and be filled with the Holy Spirit. Immediately, something like scales fell from Saul's eyes, and he could see again."
 XRO_passage_decision_23: "Paul in Athens"
 XRO_passage_decision_23_description: "eople of Athens! I see that in every way you are very religious. For as I walked around and looked carefully at your objects of worship, I even found an altar with this inscription: to an unknown god. So you are ignorant of the very thing you worship—and this is what I am going to proclaim to you."
 XRO_passage_decision_24: "The Armor of God"
 XRO_passage_decision_24_description: "Finally, be strong in the Lord and in his mighty power. Put on the full armor of God, so that you can take your stand against the devil's schemes. For our struggle is not against flesh and blood, but against the rulers, against the authorities, against the powers of this dark world and against the spiritual forces of evil in the heavenly realms"
 XRO_passage_decision_25: "The Fruit of the Spirit"
 XRO_passage_decision_25_description: "But the fruit of the Spirit is love, joy, peace, forbearance, kindness, goodness, faithfulness, gentleness and self-control. Against such things there is no law."
 XRO_passage_decision_26: "The New Heaven and Earth"
 XRO_passage_decision_26_description: "It is done. I am the Alpha and the Omega, the Beginning and the End. To the thirsty I will give water without cost from the spring of the water of life. Those who are victorious will inherit all this, and I will be their God and they will be my children."
 XRO_passage_decision_27: "The River of Life"
 XRO_passage_decision_27_description: "And he showed me a river of the water of life, shining like crystal, proceeding out from the throne of God and of the Lamb, in the middle of its wide-road. And on this side and on that side of the river is a tree of life producing twelve fruits, yielding its fruit every month."
 XRO_passage_decision_28: "The Tower of Babel"
 XRO_passage_decision_28_description: "If as one people speaking the same language they have begun to do this, then nothing they plan to do will be impossible for them. Come, let us go down and confuse their language so they will not understand each other."
 XRO_passage_decision_29: "Noah's Ark"
 XRO_passage_decision_29_description: "Take with you seven pairs of every kind of clean animal, a male and its mate, and one pair of every kind of unclean animal, a male and its mate, and also seven pairs of every kind of bird, male and female, to keep their various kinds alive throughout the earth."
 XRO_passage_decision_30: "God's Covenant with Abraham"
 XRO_passage_decision_30_description: "Know for certain that for four hundred years your descendants will be strangers in a country not their own and that they will be enslaved and mistreated there. But I will punish the nation they serve as slaves, and afterward they will come out with great possessions. You, however, will go to your ancestors in peace and be buried at a good old age."
 XRO_passage_decision_31: "Jacob's Ladder"
 XRO_passage_decision_31_description: "He had a dream in which he saw a stairway resting on the earth, with its top reaching to heaven, and the angels of God were ascending and descending on it. There above it stood the Lord, and he said: 'I am the Lord, the God of your father Abraham and the God of Isaac. I will give you and your descendants the land on which you are lying.'"
 XRO_passage_decision_32: "Joseph's Dreams"
 XRO_passage_decision_32_description: "Joseph had a dream, and when he told it to his brothers, they hated him all the more. He said to them, 'Listen to this dream I had: We were binding sheaves of grain out in the field when suddenly my sheaf rose and stood upright, while your sheaves gathered around mine and bowed down to it.'"
 XRO_passage_decision_33: "The Fiery Furnace"
 XRO_passage_decision_33_description: "May the king live forever! Your Majesty has issued a decree that everyone who hears the sound of the horn, flute, zither, lyre, harp, pipe and all kinds of music must fall down and worship the image of gold, and that whoever does not fall down and worship will be thrown into a blazing furnace."
 XRO_passage_decision_34: "Daniel in the Lion's Den"
 XRO_passage_decision_34_description: "So the king gave the order, and they brought Daniel and threw him into the lions' den. The king said to Daniel, 'May your God, whom you serve continually, rescue you!'"
 XRO_passage_decision_35: "Jonah and the Whale"
 XRO_passage_decision_35_description: "But Jonah ran away from the Lord and headed for Tarshish. He went down to Joppa, where he found a ship bound for that port. After paying the fare, he went aboard and sailed for Tarshish to flee from the Lord."
 XRO_passage_decision_36: "Ruth's Loyalty"
 XRO_passage_decision_36_description: "Do not urge me to leave you or to turn back from following you. Where you go I will go, and where you lodge I will lodge. Your people will be my people and your God my God. Where you die I will die, and there I will be buried."
 XRO_passage_decision_37: "Esther Saves Her People"
 XRO_passage_decision_37_description: "And in every province and in every city, wherever the king's command and his edict reached, there was gladness and joy among the Jews, a feast and a holiday. And many from the peoples of the country declared themselves Jews, for fear of the Jews had fallen on them."
 XRO_passage_decision_38: "Job's Trials"
 XRO_passage_decision_38_description: "Then Job arose and tore his robe and shaved his head and fell on the ground and worshiped. And he said, 'Naked I came from my mother's womb, and naked shall I return. The Lord gave, and the Lord has taken away; blessed be the name of the Lord!'"
 XRO_passage_decision_39: "Psalm 23"
 XRO_passage_decision_39_description: "The Lord is my shepherd, I lack nothing. He makes me lie down in green pastures, he leads me beside quiet waters, he refreshes my soul. He guides me along the right paths for his name's sake."
 XRO_passage_decision_40: "The Call of Isaiah"
 XRO_passage_decision_40_description: "There is no hope for me! I am doomed because every word that passes my lips is sinful, and I live among a people whose every word is sinful. And yet, with my own eyes I have seen the King, the Lord Almighty."
 XRO_passage_decision_41: "The Dry Bones Come Alive"
 XRO_passage_decision_41_description: "Prophesy to the breath; prophesy, son of man, and say to it, 'This is what the Sovereign Lord says: Come, breath, from the four winds and breathe into these slain, that they may live.'"
 XRO_passage_decision_42: "Hosea's Faithful Love"
 XRO_passage_decision_42_description: "I desire faithful love and not sacrifice, the knowledge of God instead of entirely burned offerings. But like Adam they broke the covenant; then they acted in bad faith against me. Gilead is a city of wicked people, tracked with blood."
 XRO_passage_decision_43: "Habakkuk's Complaint"
 XRO_passage_decision_43_description: "Why do you make me look at injustice? Why do you tolerate wrongdoing? Destruction and violence are before me; there is strife, and conflict abounds. Therefore the law is paralyzed, and justice never prevails. The wicked hem in the righteous, so that justice is perverted."
 XRO_passage_decision_44: "The Writing on the Wall"
 XRO_passage_decision_44_description: "God has numbered the days of your reign and brought it to an end. You have been weighed on the scales and found wanting. Your kingdom is divided and given to the Medes and Persians."
 XRO_passage_decision_45: "Nehemiah Rebuilds the Wall"
 XRO_passage_decision_45_description: "Face it: we're in a bad way here. Jerusalem is a wreck; its gates are burned up. Come—let's build the wall of Jerusalem and not live with this disgrace any longer."
 XRO_passage_decision_46: "The Widow's Mite"
 XRO_passage_decision_46_description: "Truly I say to you that this poor widow has put in more than all; for all these out of their abundance have put in offerings for God, but she out of her poverty put in all the livelihood that she had."
 XRO_passage_decision_47: "Zacchaeus the Tax Collector"
 XRO_passage_decision_47_description: "Look, Lord! Here and now I give half of my possessions to the poor, and if I have cheated anybody out of anything, I will pay back four times the amount."
 XRO_passage_decision_48: "Jesus Heals a Blind Man"
 XRO_passage_decision_48_description: "Neither this man nor his parents sinned, but this happened so that the works of God might be displayed in him. As long as it is day, we must do the works of him who sent me. Night is coming, when no one can work. While I am in the world, I am the light of the world."
 XRO_passage_decision_49: "The Rich Young Ruler"
 XRO_passage_decision_49_description: "'If you want to be complete, go and sell your possessions and give to the poor, and you will have treasure in heaven; and come, follow Me.' But when the young man heard this statement, he went away grieving; for he was one who owned much property."
 XRO_passage_decision_50: "The Transfiguration"
 XRO_passage_decision_50_description: "After six days Jesus took with him Peter, James and John the brother of James, and led them up a high mountain by themselves. There he was transfigured before them. His face shone like the sun, and his clothes became as white as the light. Just then there appeared before them Moses and Elijah, talking with Jesus."
 XRO_passage_decision_51: "Mary and Martha"
 XRO_passage_decision_51_description: "'Martha, Martha,' the Lord answered, 'you are worried and upset about many things, but few things are needed—or indeed only one. Mary has chosen what is better, and it will not be taken away from her.'"
 XRO_passage_decision_52: "Jesus Raises Lazarus"
 XRO_passage_decision_52_description: "Father, I thank you that you have heard me. I knew that you always hear me, but I said this for the benefit of the people standing here, that they may believe that you sent me."
 XRO_passage_decision_53: "Peter Walks on Water"
 XRO_passage_decision_53_description: "But while Peter was walking on the water, he saw the wind and the waves. He was afraid and began sinking into the water. He shouted, 'Lord, save me!'"
 XRO_passage_decision_54: "Jesus Calms the Storm"
 XRO_passage_decision_54_description: "He got up, rebuked the wind and said to the waves, 'Quiet! Be still!' Then the wind died down and it was completely calm. He said to his disciples, 'Why are you so afraid? Do you still have no faith?' They were terrified and asked each other, 'Who is this? Even the wind and the waves obey him!'"
 XRO_passage_decision_55: "The Fig Tree Cursed"
 XRO_passage_decision_55_description: "The next day as they were leaving Bethany, Jesus was hungry. Seeing in the distance a fig tree in leaf, he went to find out if it had any fruit. When he reached it, he found nothing but leaves, because it was not the season for figs."
 XRO_passage_decision_56: "The Cleansing of the Temple"
 XRO_passage_decision_56_description: "And Jesus entered the temple and drove out all who sold and bought in the temple, and he overturned the tables of the money-changers and the seats of those who sold pigeons. He said to them, 'It is written, 'My house shall be called a house of prayer,' but you make it a den of robbers.'"
 XRO_passage_decision_57: "The Great Commission"
 XRO_passage_decision_57_description: "All authority in heaven and on earth has been given to me. Therefore go and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit, and teaching them to obey everything I have commanded you. And surely I am with you always, to the very end of the age."
 XRO_passage_decision_58: "Stephen's Martyrdom"
 XRO_passage_decision_58_description: "And they stoned Stephen as he was calling on God and saying, 'Lord Jesus, receive my spirit.' Then he knelt down and cried out with a loud voice, 'Lord, do not charge them with this sin.' And when he had said this, he fell asleep."
 XRO_passage_decision_59: "Philip and the Ethiopian"
 XRO_passage_decision_59_description: "So he started out, and on his way he met an Ethiopian eunuch, an important official in charge of all the treasury of the Kandake (which means 'queen of the Ethiopians'). This man had gone to Jerusalem to worship, and on his way home was sitting in his chariot reading the Book of Isaiah the prophet."
 XRO_passage_decision_60: "Peter's Vision"
 XRO_passage_decision_60_description: "About noon the following day as they were on their journey and approaching the city, Peter went up on the roof to pray. He became hungry and wanted something to eat, and while the meal was being prepared, he fell into a trance. He saw heaven opened and something like a large sheet being let down to earth by its four corners."
 XRO_passage_decision_61: "Paul and Silas in Prison"
 XRO_passage_decision_61_description: "About midnight Paul and Silas were praying and singing hymns to God, and the other prisoners were listening to them. Suddenly there was such a violent earthquake that the foundations of the prison were shaken. At once all the prison doors flew open, and everyone’s chains came loose."
 XRO_passage_decision_62: "Paul Shipwrecked"
 XRO_passage_decision_62_description: "The soldiers planned to kill the prisoners to prevent any of them from swimming away and escaping. But the centurion wanted to spare Paul's life and kept them from carrying out their plan. He ordered those who could swim to jump overboard first and get to land."
 XRO_passage_decision_63: "The Faith of the Centurion"
 XRO_passage_decision_63_description: "Lord, I do not deserve to have you come under my roof. But just say the word, and my servant will be healed. For I myself am a man under authority, with soldiers under me. I tell this one, 'Go,' and he goes; and that one, 'Come,' and he comes. I say to my servant, 'Do this,' and he does it."
 XRO_passage_decision_64: "Jesus Anointed at Bethany"
 XRO_passage_decision_64_description: "Six days before the Passover, Jesus came to Bethany, where Lazarus lived, whom Jesus had raised from the dead. Here a dinner was given in Jesus’ honor. Martha served, while Lazarus was among those reclining at the table with him. Then Mary took about a pint of pure nard, an expensive perfume; she poured it on Jesus’ feet and wiped his feet with her hair."
 XRO_passage_decision_65: "Jesus and the Samaritan Woman"
