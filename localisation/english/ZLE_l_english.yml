 ZLE_one_holy_catholic_and_apostolic_church_desc: "Despite our country being home to a great deal of different faiths and sects, the Maronite sect of Catholicism reigns dominant. In plurality, in politics, as well as in economics. This has brought our fledgling state a great deal of stability and support over the years, though religious minorities in Lebanon are beginning to question the Catholic Church's influence. "
 
