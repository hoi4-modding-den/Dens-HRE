  DN1:0 "Mandatory Palestine"
  DN1_DEF:0 "Mandatory Palestine"
  DN1_ADJ:0 "Palestinian"
  DN1_neutrality_party:0 "Colonial Administration"
  DN1_rising_hostilities:0 "Rising Hostilities"
  DN1_rising_hostilities_desc:0 "The region of Palestine is the religious holy land for Jews, Christians and Muslims, and because of that, it is not a huge surprise to discover that this Abrahamic overlap has led to a significant rise in hostilities between different religious groups, especially after our colonial administration has been signifanctly weakened during the last year."
  DN1_the_empires_last_bastion:0 "The Empire's Last Bastion"
  DN1_the_empires_last_bastion_desc:0 "The dominoes have fallen around us, and we remain as the last standing bastion of the British Expedition in the Middle East. The efforts by the British Empire to consolidate the deserted areas around us have been proven foolish and fruitless, and as a result, the brave soldiers of his majesty have retreated all the way back to Palestine."
  
  DN2:0 "International Provisional Administration of the Suez Region" #Administration Provisoire Internationale de la Région de Suez
  DN2_DEF:0 "the International Provisional Administration of the Suez Region"
  DN2_ADJ:0 "International"
  DN2_neutrality_party:0 "International Provisional Administration"
  DN2_international_in_name_only:0 "International in Name Only"
  DN2_international_in_name_only_desc:0 "Even if the Suez Canal is de jure an international zone ruled by a provisional administration with a mandate from the League of Nations, in actuality, this government is nothing more than a continuation of the earlier British Colonial Expedition in Egypt after the fall of the Ottoman Empire."