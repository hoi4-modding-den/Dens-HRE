ZTS_Ahmed_Al_Nahyan_desc_1: "Ahmed is not like any other ruler,"
ZTS_legacy_of_Ahmhed_westernization: "Legacy of Ahmed's Westernization Program"
ZTS_legacy_of_Ahmhed_westernization_desc: "The Westernization Program created by Ahmed was initially met with contestation but was quickly changed into a success story, however this doesn't mean it didn't become a problem. Quite on the contrary while the Trucial State definitely enjoyed major economic growth and massive amounts of refugees from Europe it only became a burden on the government by having to waste more resources in stabilizing the situation."
ZTS_Rabaatoil_conglomerate_success: "RabaatOil Conglomerate's Sucess"
ZTS_legacy_of_the_al_ru_b: "Legacy of the al-ru'b"
ZTS_legacy_of_the_al_ru_b_desc: "The British were initially offering us help to develop our country and guarantee our independence, however they suddenly withdrew for unknown reasons. There were already multiple administrative infrastructures dependent on the British, this caused our stability to decrease at an alarming rate. This crisis was known as the al-ru'b 'the horror' as hundreds of citizens died in riots repression."
ZTS_begin_the_next_industrial_revolution: "Begin the next Industrial Revolution !"